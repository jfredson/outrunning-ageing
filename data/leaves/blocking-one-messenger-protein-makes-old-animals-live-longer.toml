# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage record
# was checked against the paper's listing on 2026-10-16; the rest is in the verify list. The
# estimate is a first pass.

id = "blocking-one-messenger-protein-makes-old-animals-live-longer"
added_on = 2026-10-16
name = "Blocking one inflammatory messenger protein makes old animals live longer"
branch = "inflammation-and-signalling"
description = """
Cells talk to each other through proteins in the blood, and some of those messages go wrong with
age. Interleukin-11 is one such messenger, rising with age and driving scarring and
inflammation. In 2024 a Singapore and London group reported that mice bred without it, or old
mice given an antibody that blocks it from 75 weeks of age (about 55 in human years), lived about
a quarter longer, with less frailty and fewer tumours. It is among the largest lifespan gains
from a single drug started late in life in mice. Antibodies against the same protein were in
early trials in people for lung scarring, not for ageing, when this was written."""
test = """
An old living animal given a drug that blocks a single messenger protein in the blood, started
in the second half of its life, afterwards lives longer than untreated controls, in a
peer-reviewed report. The first-human rung needs a controlled trial in which people given such a
drug improve on an age-related measure (frailty, muscle, a validated clock) more than placebo. For
the clinic rung: a regulator approves such a drug for an age-related condition."""
settler = "Peer-reviewed reports; the trial registry; the regulator's approval record for the clinic rung"
stage = "shown-in-animals"
stage_reached_on = "2024-07-17"
stage_record = "https://doi.org/10.1038/s41586-024-07701-9"
status = "tracked"
horizon = "mid"

notes = """
Other single messengers with animal results sit under this treatment in spirit (GDF11, oxytocin,
klotho, the TGF-beta family); interleukin-11 is the record because its result is a full
lifespan study with a drug started late. A human lifespan result is not asked for at the
first human rung, because no such trial can be run in a working lifetime; a controlled
age-related measure is."""

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
An antibody already in people for scarring could be tried in frailty quickly; the likely year
for a first human result is 2032, and for an approval in an age-related condition the mid 2040s,
allowing for the lung-scarring programmes to establish safety first. The earliest assumes the
scarring trials double as the age-related trial; the latest allows for the mouse result being
one of the many that do not carry to people."""

[[estimate.rung]]
rung = "first-human"
earliest = 2028
likely = 2032
latest = 2050

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2034
likely = 2045
latest = 2100

[[revision]]
date = 2026-10-17
field = "estimate.status"
old = "first-pass"
new = "reviewed"
why = "An outside review of the year ranges ran on 2026-10-17 (by an AI model from another company, Google's Gemini 3.1 Pro in its preview version, given the treatments in four groups) and left this range as it is, with a line saying why. John ruled on every point the review raised on 2026-10-17, so this estimate moves from a first estimate, not yet reviewed, to a reviewed one, as the rules for the record and for outside reviews say; no year changed."

# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The facts are from
# memory and from 2026 trade coverage of the trial's status, and are in the verify list. The
# estimate is a first pass.

id = "a-regulator-recognises-ageing-as-a-condition-a-drug-can-treat"
name = "A regulator recognises ageing itself as a condition a drug can be approved to treat"
branch = "measuring-age"
description = """
Drugs are approved for diseases, and ageing is not one on any regulator's list; so a drug that
slowed ageing itself would have no label to carry it, and every drug on this tree is being
tested instead against one disease of age at a time. In planning the TAME metformin trial its
designers consulted the United States regulator, whose officials stressed an outcome based on
disease rather than on measures of function; the trial's main measure became the time to any of
several age-related diseases, or death, taken together. That is as close as the published record
shows a regulator coming to treating ageing as an indication, and it is not a promise to approve.
The trial has not launched: its sponsor's own page, as saved on 2026-07-04, was still raising funds
to start it. Nothing has been written into any regulator's rules, and no drug has been approved for
ageing anywhere."""
test = """
A regulator approves a drug with ageing, or the delay of age-related disease in general, as its
indication, in the regulator's own record; that is the clinic rung. The first-human rung is a
registered, running trial whose main measure is time to age-related disease in general, or a
measure of ageing itself, run with a regulator's written agreement. There is no animal rung for a
regulatory act, and the idea-only rung means neither has happened."""
settler = "The regulator's own approval record or written agreement; the trial registry entry of the running trial"
stage = "idea-only"
status = "tracked"
horizon = "mid"

notes = """
The metformin leaf on the energy branch is the same trial seen from the drug's side; this leaf
is the rule change, which would carry every other drug. The two measuring-branch regulatory
leaves are kept separate because a regulator could accept a marker (the other leaf) and still
require a disease on the label, or the reverse.
What the sources say, read on 2026-10-17. The regulator's part in the trial's design: Justice and
colleagues, Cardiovascular Endocrinology and Metabolism, 2018 (https://doi.org/10.1097/XCE.0000000000000159;
open copy https://pmc.ncbi.nlm.nih.gov/articles/PMC6428447/) say discussions were begun with the
regulator, that its officials stressed an outcome based on disease rather than markers of function
or syndromes, and that this shaped the trial's main outcome (a heart attack, stroke, hospital stay
for heart failure, cancer, dementia or mild memory loss, or death); Kritchevsky and Espeland, a
conference abstract in Innovation in Aging, 2018 (https://pmc.ncbi.nlm.nih.gov/articles/PMC6230116/),
say the main outcome "was shaped by FDA input". Neither gives a date for the meeting or says the
regulator would accept the trial as grounds for an approval. An earlier version of this record gave a
meeting in 2015 and an acceptance; both were removed on 2026-10-17 for want of a source, because the
only account of them was trade coverage and a news feature in Science of 2015-09-18 ("A trial for the
ages", Hall) that sits behind a paywall with no abstract carrying either fact. The trial's status:
the sponsor's own trial page (American Federation for Aging Research), as saved by the Internet
Archive on 2026-07-04, was headed "Raising Funds to Launch" and spoke of six years of trials "once
launched" (https://web.archive.org/web/20260704152538/https://www.afar.org/tame-trial; the page no
longer loads on the sponsor's site); a search of ClinicalTrials.gov by title and by sponsor on
2026-10-17 found no entry for the trial. The earlier statement that it had enrolled no one by
mid-2026 rested on trade reports and was dropped for want of a primary source.
The World Health Organization's classification of diseases, read in its own browser (version
2025-01, https://icd.who.int/browse/2025-01/mms/en) on 2026-10-17: code MG2A is titled "Ageing
associated decline in intrinsic capacity" and sits among the general symptoms, in the chapter of
symptoms, signs and clinical findings, with the index terms "ageing" and "old age without mention of
psychosis"; a review (Mendoza-Núñez and Mendoza-Soto, Cureus, 2024, https://pmc.ncbi.nlm.nih.gov/articles/PMC10894070/)
reports that the title "Old age" was replaced after objections. The browser also lists a
separate add-on code, XT9T "Ageing-related", among the causes a diagnosis can be tagged with; it
means caused by the biological processes that steadily wear down the body's ability to adapt as
people grow older. A classification code is neither a regulator's approval of a drug nor an
indication for one, and it does not meet the test."""

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
The first-human rung needs a trial such as TAME to run, which is a funding question with a
likely answer of 2029 and a real chance of never; the clinic rung, an approval with ageing on the
label, needs that trial or a successor to read out positive and a regulator to accept the
indication, likely in the mid 2040s. The earliest assumes the trial starts next year and reads
out positive on schedule with a label to match; the latest says it may not happen this century."""

[[estimate.rung]]
rung = "first-human"
earliest = 2027
likely = 2029
latest = 2045

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2034
likely = 2045
latest = 2100


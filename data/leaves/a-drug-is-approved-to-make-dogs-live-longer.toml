# Leaf record (docs/record-schema.md). Written 2026-10-17 by the verify session, to give the Loyal
# claim (loyal-2025-senior-dog-approval-by-end-of-2025) a leaf to point at. The stage and the
# estimate were proposed by the verify session and ruled by John on 2026-10-17 as proposed; see
# the notes. Facts are from the company's own
# posts, read in full on 2026-10-17 (loy-002-rxe, loy-002-tas, loy-003-rxe,
# what-is-fda-conditional-approval, and the for-vets page), and from a trade report of the
# safety step (longevity.technology, 2026-01-14).

id = "a-drug-is-approved-to-make-dogs-live-longer"
name = "A drug is approved to make dogs live longer"
branch = "energy-and-fuel"
description = """
Dogs share our homes, our food and many of our diseases, and they age fast enough that a lifespan
trial finishes in years, not decades. A drug approved to lengthen a dog's life would be the first
approval of its kind in any species. One company, Loyal, has taken three such drugs to the United
States veterinary regulator and has had the regulator accept that each can reasonably be expected
to work. None has yet been approved, and none has yet been shown to lengthen dogs' lives in a
published, peer-reviewed report. The treatment sits beside the human ones on this branch because it is
the first place a regulator is being asked to put "extends lifespan" on a label."""
test = """
A regulator (the United States Food and Drug Administration's Center for Veterinary Medicine, or
the regulator of any other country) grants an approval, full or conditional, for a drug whose
stated purpose is to extend the lifespan of dogs, or their healthy lifespan, in the regulator's
own approval record. A conditional approval counts for the clinic rung, because under it a
veterinarian can prescribe the drug outside a trial; the leaf notes whether the approval is
conditional. Acceptance of one section of an application, a company's announcement and a
supplement sold without approval are not the leaf. For the first rung above idea only: a
peer-reviewed report that dogs given such a drug lived longer, or stayed free of age-related
disease longer, than dogs given a placebo."""
settler = "The regulator's own approval record; for the first rung, the peer-reviewed report of the trial"
stage = "idea-only"
status = "tracked"
horizon = "near"

notes = """
Why the stage is idea only (ruled by John on 2026-10-17, as proposed to him after a check of the record). The ladder is written for treatments
meant for people, and its second rung asks for a peer-reviewed report that the treatment works in
a living animal. Loyal has given the drug to more than 400 dogs in safety work and to 48 in a
three-month pilot, and the regulator has accepted that the company's data give a reasonable
expectation of effectiveness (accepted 2025-02-26 for LOY-002, the senior-dog drug; the large-dog
drugs LOY-001 and LOY-003 were accepted earlier and on 2026-09-16 respectively), and the safety
section for LOY-002 was accepted on 2026-01-13. But the effectiveness evidence behind those
acceptances is the company's own, not a peer-reviewed report of dogs living longer, and the
pivotal trial (STAY: first dog dosed in December 2023, about 1,000 to 1,300 dogs at 55 to 70
clinics, about four years) has not read out. Read strictly, the record supports idea only. The
alternative is shown in animals, on the regulator's acceptance of effectiveness; that would
credit a private data package that no reader can check, so it was not taken.
What counts as the clinic. Under the regulator's expanded conditional approval route a drug may
be conditionally approved on full safety data, full manufacturing data and a reasonable
expectation of effectiveness, for up to five years while the full trial finishes, and a
veterinarian may prescribe it as normal in that time. This entry counts such an approval as the
clinic rung, which is a lower bar than the human treatments on this branch clear; a stricter test
would wait for the full approval, perhaps two years later than the estimate. It is a judgment
call, and John ruled on 2026-10-17 that the conditional approval counts as the clinic rung.
What this does to the headline. The treatment is on the energy and fuel branch because the drug
(LOY-002) is said to act on the metabolic dysfunction of ageing, and because the claims log
already files the Loyal claim there. Its early clinic estimate would make it the second treatment
on that branch to reach the clinic, so the branch would count as handled much earlier than before.
The site's headline computation shows the effect; the report on the check of this record, put to
John, gave the numbers before and after. An approval for dogs says nothing yet about people, which
is the other reason this treatment was put to John; he ruled on 2026-10-17 that the entry stands
with the stage idea only and the estimate as proposed (earliest 2027, likely 2028, latest 2032).
Related: Loyal's claim of 2025-02-26, in the claims log, that its senior-dog drug's application
would be complete by the end of 2025 (the promise, missed).
Checked on 2026-10-17 against the regulator's own news list and the company's own pages. The United
States veterinary regulator's list of its announcements, which runs to 2026-09-30
(https://www.fda.gov/animal-veterinary/news-events/cvm-updates), shows no approval or conditional
approval of a drug to extend dogs' lives; its conditional approvals there are for other uses (for
example new world screwworm, a heart condition in cats, and a condition of the skull and spine in dogs). The company's
page for veterinarians (https://loyal.com/for-vets, read the same day) lists the manufacturing section
of the application and the conditional approval as "In progress", and the safety section as complete.
The company's news release of 2026-01-13, as carried by Yahoo Finance
(https://finance.yahoo.com/news/loyal-receives-fda-acceptance-safety-140000887.html), says it
expected to complete the final major section and apply for expanded conditional approval "next year",
that is 2027, and the veterinary trade paper dvm360 of the same day reports that the company expects
the final section to be reviewed in 2027. The regulator's
explanation of the route, including the five-year limit on a conditional approval, is at
https://www.fda.gov/animal-veterinary/resources-you/conditional-approval-explained-resource-veterinarians.
The regulators of other countries were not searched on their own lists; a web search on that day
found no approval of a dog lifespan drug anywhere else."""

[estimate]
status = "reviewed"
set_on = 2026-10-17
why = """
The company's own timetable is the only schedule there is, and it has slipped once: in February
2025 it expected the manufacturing and safety sections by the end of 2025; safety was accepted in
January 2026 and manufacturing was still open when its next posts went out, with the application
now expected in 2027. Approval then needs the regulator's review of the full application, so the
likely year is 2028, a year after the application. The earliest assumes the review is quick
because the regulator has already accepted two of the three sections; the latest allows for
manufacturing problems, for the regulator asking for more, or for the company running short of
money, which in a company with one product family is a real risk."""

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2027
likely = 2028
latest = 2032

[[revision]]
date = 2026-10-17
field = "notes"
old = "(nothing; the result of checking the regulator's own news list and the company's own pages added at the end of the notes)"
new = "Checked on 2026-10-17: the United States veterinary regulator's list of announcements, to 2026-09-30, shows no approval or conditional approval of a drug to extend dogs' lives; the company's own page lists the manufacturing section and the conditional approval as in progress, and its news release of 2026-01-13 expected to apply 'next year', that is 2027."
why = "Checked against the regulator's own list and the company's own pages on 2026-10-17; the two statements previously rested on the company's posts and a web search."

[[revision]]
date = 2026-10-17
field = "estimate.status"
old = "first-pass"
new = "reviewed"
why = "An outside review of the ranges of years ran on 2026-10-17 (by Google's Gemini 3.1 Pro, an AI model, in its preview version, sent the records in four parts) and left this range as it is, with a line saying why. John ruled on every point of the review on 2026-10-17, so the estimate moves from a first estimate, not yet reviewed, to reviewed, as the rules for the records and for the review say; no year changed."

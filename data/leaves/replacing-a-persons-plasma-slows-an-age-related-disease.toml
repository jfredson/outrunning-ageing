[estimate]
status = "first-pass"
set_on = 2026-10-17
why = """
Written on 2026-10-17 by the session that applied John's ruling moving this treatment to the clinic,
as a first pass for the wide-use rung, which the headline does not draw; it waits on John's ruling
and the next outside review. Wide use means the procedure is offered for an age-related condition
to the general public in at least one country and taken up by many people. Today it is one centre in
Barcelona with three more announced in Spain, a supplier's planned registry of real-world results,
and a guideline category that says its role is not established. The earliest year assumes the
Spanish programme's registry reports and public hospitals in one country adopt the procedure for
Alzheimer's disease within a few years of that; the likely year assumes wide uptake waits for a
second controlled trial, in Alzheimer's disease or in healthy older adults, reporting positive in
the 2030s and for payers and guidelines to follow; the latest allows for the 2020 result never
being confirmed and the procedure staying a few centres' offer.
"""

[[estimate.rung]]
rung = "in-wide-use"
earliest = 2032
likely = 2045
latest = 2090


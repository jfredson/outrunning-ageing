# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage facts are
# from memory of the papers and are in the verify list. The estimate is a first pass.

id = "replacing-a-persons-plasma-slows-an-age-related-disease"
name = "Replacing the liquid part of a person's blood slows an age-related disease"
branch = "inflammation-and-signalling"
description = """
If old blood carries signals that hold the body back, then taking out the liquid part (the
plasma) and replacing it with salt water and a blood protein should help, and in 2020 a Berkeley
group showed that it did in old mice: one such exchange improved their muscle repair, liver and
brain. The procedure, plasma exchange, has been used in hospitals for decades for other reasons.
In people the record so far is a 2020 Spanish and American trial of 347 people with Alzheimer's
disease (322 of them treated and followed), in which those given monthly plasma exchange for over a year declined more slowly on
tests of daily function than those given a sham procedure. It is a first human on an age-related
disease, with the caution that the trial had several measures and not all moved. Since 2021 the
Ace Alzheimer Center in Barcelona has given the procedure to people with Alzheimer's disease as a
clinical programme outside any trial, and on 2026-04-27 it published on its own page that 71 patients
had completed its 15-month programme under routine clinical practice conditions; John ruled on
2026-10-17 that this counts as a named clinical setting publishing its practice, so the treatment
is in clinical use from that date."""
test = """
A controlled trial in people reports that replacing or diluting the plasma slows the course of
an age-related disease, or improves an age-related function, more than a sham procedure on a
pre-stated main measure, in a peer-reviewed report. The animal rung is the same in a living
animal. For the clinic rung: a regulator approves plasma exchange or dilution for an age-related
condition, or a named clinical setting gives it for that purpose in routine care and publishes
that practice."""
settler = "The peer-reviewed trial report; the regulator's approval record, or a named clinical setting's published practice, for the clinic rung"
stage = "in-clinical-use"
stage_reached_on = "2026-04-27"
stage_record = "https://www.acebarcelona.org/en/plasma-exchange-alzheimers-asfa-2026"
stage_publication = "ace-barcelona-2026"
status = "tracked"
horizon = "mid"

notes = """
The animal result came after the human trial started, which is why the earlier-stage date is
later than one might expect; the ladder records when each rung was reached, not the order a
reader expects. The procedure already exists in every large hospital, so the clinic rung here
is about a regulator or a named service deciding it is for ageing, not about building anything
new. A small placebo-controlled trial in 42 healthy adults over 50, from the Buck Institute and a
plasma-exchange company (Aging Cell, online 2025-05-27; posted first as a preprint on 2024-08-08),
reported younger readings than placebo on 15 age clocks (estimates of biological age read from the
chemical marks on DNA); its main aims were safety and those clocks.
FOR JOHN, added 2026-10-17 from the weekly reading of that date: the case for the clinic rung. The
test accepts a named clinical setting that gives the treatment for that purpose in routine care and
publishes that practice. On 2026-03-12 the supplier Grifols announced (grifols-2026) that the Ace
Alzheimer Center in Barcelona has run its plasma-exchange-with-albumin programme (AMBAR) for people
with Alzheimer's disease since 2021, that new clinics are opening in hospitals in Madrid, Mallorca and
Alicante, that more than 5,000 exchanges have been done, and that the protocol is in the guidelines
of the American Society for Apheresis. On a plain reading that could be the clinic rung from 2021 or
2026-03-12. It was not moved because the source is the supplier's release and not the clinical
setting's own publication of its practice, the apheresis society's category for Alzheimer's
disease was not seen, and a stage never moves down, so a mistake here could not be undone. Whether a
company-run clinic programme counts as routine care, and whether the clinic rung's test should be
widened to say so, is John's call. If it counts, the entry moves to in clinical use and its estimate
(earliest 2030) must be rewritten. This entry stays at first human.
RULED 2026-10-17. The outside review of 2026-10-17 (item 13 in docs/reviews/2026-10-17-rulings.md)
brought the centre's own announcement of 2026-04-27 (ace-barcelona-2026): 71 patients completed its
15-month programme "under routine clinical practice conditions in Barcelona", presented at the
apheresis society's 2026 meeting. That answers the first objection above (the only source had been
the supplier's). The second stands and is recorded: it is an announcement of a conference
presentation, not a peer-reviewed publication of the practice, and the apheresis society's guidelines
place plasma exchange for Alzheimer's disease in the category whose role is not established. John
weighed both and ruled that the announcement counts as the clinical setting publishing its practice.
The entry moved to in clinical use, dated 2026-04-27 (the centre's own publication) and not 2021
(the start the supplier's release gives), the inflammation branch counts as handled from 2026 because
colchicine was already in the clinic, and the estimate below is rewritten for the wide-use rung.
"""


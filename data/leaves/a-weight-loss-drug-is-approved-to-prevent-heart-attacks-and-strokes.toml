# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The approval date
# was checked against coverage of the regulator's notice on 2026-10-16; the trial record is from
# memory and in the verify list. The estimate is a first pass.

id = "a-weight-loss-drug-is-approved-to-prevent-heart-attacks-and-strokes"
added_on = 2026-10-16
name = "A weight-loss drug is approved to prevent heart attacks and strokes in people without diabetes"
branch = "energy-and-fuel"
description = """
The GLP-1 drugs (semaglutide, sold as Wegovy and Ozempic, and their successors) copy a gut hormone
that tells the body it has eaten, and they act on the same fuel-sensing pathways the ageing field
has studied for decades. In 2023 a trial of 17,604 overweight people with heart disease but no
diabetes found that semaglutide cut heart attacks, strokes and heart deaths by a fifth over three
years, with fewer deaths from any cause. On 8 March 2024 the United States regulator approved it
for that purpose, the first time a weight-loss drug was approved to prevent an age-related disease
rather than to treat weight. Whether the drugs slow ageing itself is not shown; whether they are
the closest thing in wide use to a drug that does is the question the entry tracks."""
test = """
A controlled trial in people without diabetes reports that a GLP-1 drug lowers death from any
cause, or heart attacks and strokes, more than placebo, in a peer-reviewed report. For the clinic
rung: a regulator approves such a drug to prevent an age-related disease, rather than to treat
weight or blood sugar. For wide use: the drug is available by prescription for that purpose in
several countries and taken by a substantial share of eligible people."""
settler = "The peer-reviewed trial report; the regulator's approval record; published uptake figures for the wide-use rung"
stage = "in-clinical-use"
stage_reached_on = "2024-03-08"
stage_record = "https://www.fda.gov/news-events/press-announcements/fda-approves-first-treatment-reduce-risk-serious-heart-problems-specifically-adults-obesity-or"
status = "tracked"
horizon = "near"

notes = """
Semaglutide for weight loss alone is in wide use by any measure; this entry's test is narrower, the
approval to prevent an age-related disease, and the record keeps that rung at clinical use until
uptake figures for that purpose are in hand. The drugs' effect on measures of biological age was
being studied when this was written and has no peer-reviewed result; if one comes it belongs on
the measuring branch's entry on a treatment slowing a clock, not here.
Added 2026-10-17, from the weekly reading of that date: the first published uptake figure for the
heart-prevention purpose is a study in the American Journal of Managed Care (Scannell and colleagues,
2026-07-09), using national prescription counts to September 2024. Wegovy fills rose 136 per cent
after the approval of 2024-03-08 and Medicare coverage, yet six months after Medicare plans began
covering it only 32,732 prescriptions had been filled, under 1 per cent of an estimated 3.6 million
eligible beneficiaries. It is one country and one payer, and the data end in September 2024. It
does not change the stage.
No earlier stage is recorded for the animal rung. The nearest animal result is a Nature report of
2026-09-02 (Feng and colleagues, https://doi.org/10.1038/s41586-026-10940-7): semaglutide started in
20-month-old female mice and continued for life lengthened their median life, from 742 days to 834
days. It came after the drug's approval, and it is a result on lifespan in mice, not on heart
attacks, strokes or deaths in people, which is what the test for this entry (what would count) asks about, so it is not entered
as an earlier stage.
Added 2026-11-27: on 2026-11-09 the United States regulator required every drug of this family, semaglutide among them, to carry a new warning of a possible raised risk of a rare, sudden loss of sight in one eye (non-arteritic anterior ischaemic optic neuropathy). Its pooling of 126 randomised trials in 134,253 people found 10 probable cases on the drugs and 5 on the comparison treatments, or 6.4 against 3.8 for every 100,000 people treated for a year (https://www.fda.gov/drugs/drug-safety-communications/fda-requires-safety-labeling-changes-glucagon-peptide-1-receptor-agonists-glp-1-ras-due-potential). Also from November 2026: among the 357 Japanese people in the large semaglutide heart trial in people without diabetes, 10 on the drug and 16 on placebo had a heart attack, a stroke or a heart death, too few to be sure of on their own but pointing the same way as the whole trial (Circulation Journal, 2026-11-21, https://doi.org/10.1253/circj.cj-26-0448). Lilly's trial of tirzepatide on deaths, heart attacks and strokes in 15,374 people with obesity expects its main result in October 2027 (https://clinicaltrials.gov/study/NCT05556512).
"""

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
The drugs are taken by tens of millions of people and prices were falling as pills and copies
arrived; the likely year for wide use on the heart-prevention indication is 2029, the earliest
allows that it is already met once uptake is counted, and the latest allows for the indication
staying a label line that few prescribers use.
[Note 2026-10-17, from the weekly reading of that date: the first published uptake figure for this
purpose (Scannell and colleagues, 2026) is under 1 per cent of eligible Medicare beneficiaries six months after
coverage began, with data to September 2024. That points the other way from the earliest year of
2027 above, which assumed uptake might already count. The years are unchanged; I may want to weigh
moving the earliest wide-use year later at the next review.]
[Note 2026-10-17, on an outside review's proposal: the wide-use earliest year moved from 2027 to 2030 and the likely year from 2029 to 2033. The record's one published uptake figure (Scannell and colleagues, 2026: under 1 per cent of eligible Medicare beneficiaries six months after coverage began) says the earliest's assumption, that uptake might already count, does not hold, and a substantial share of eligible people in several countries takes years of payer coverage and prescribing habit. The latest of 2040 stays. This rung is shown on the page and not drawn by the headline.]
[Note 2026-11-27: the regulator's eye warning of 2026-11-09 (in the notes) was weighed and the years held. The event is rare, and how fast the drugs spread for heart prevention turns more on their cost and on payers' coverage than on this warning.]
"""

[[estimate.rung]]
rung = "in-wide-use"
earliest = 2030
likely = 2033
latest = 2040


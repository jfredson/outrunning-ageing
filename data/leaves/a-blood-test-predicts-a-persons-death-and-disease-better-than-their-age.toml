# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage facts are
# from memory of the papers and are in the verify list. The estimate is a first pass.

id = "a-blood-test-predicts-a-persons-death-and-disease-better-than-their-age"
name = "A clock read from blood predicts a person's death and disease better than their age does"
branch = "measuring-age"
description = """
A trial that slows ageing cannot wait thirty years to count deaths; it needs a reading, taken at
the start and the end, that stands in for them. The best candidates read the chemical marks on
DNA from a blood sample. A clock published in 2013 estimated a person's calendar age from those
marks in most tissues and cell types; the useful ones came later, trained not on age but on
outcomes. In 2019 a Los Angeles group published GrimAge, trained on smoking and blood proteins,
which predicted time to death, to heart disease and to cancer more strongly than the earlier
clocks did, in validation groups of thousands of people, and later clocks (DunedinPACE, 2022)
read the pace of ageing rather than its level. No regulator treats
any of them as a medical test, and none is used in routine care, though several are sold to the
public."""
test = """
A clock read from a blood or saliva sample predicts time to death or to an age-related disease
better than calendar age, in two or more independent groups of at least a thousand people
followed for years, in peer-reviewed reports. For the clinic rung: a regulator clears or approves
such a clock as a medical test, or a named health system uses it in routine care and publishes
that practice. For wide use: offered in routine care in several countries."""
settler = "Peer-reviewed validation reports; the regulator's clearance record, or a named health system's published practice, for the clinic rung"
stage = "first-human"
stage_reached_on = "2019-01-21"
stage_record = "https://doi.org/10.18632/aging.101684"
status = "tracked"
horizon = "mid"

notes = """
The ladder fits a measuring tool loosely, and the test says how it is read here: first human is
a validated clock in people, the clinic rung is a regulator or a health system treating it as a
test, wide use is routine care. Clocks sold to the public (several companies since 2019) are not
a rung, because a sale is not a validation. A clock used as the thing a trial must move is the entry
beside this one.
Checked 2026-10-17 against the papers' abstracts and open full texts: the 2013 clock (Horvath, Genome
Biology, https://doi.org/10.1186/gb-2013-14-10-r115) was built from 8,000 samples covering 51 tissues
and cell types; the 2015 report (Marioni and colleagues, Genome Biology, https://doi.org/10.1186/s13059-015-0584-6)
found, in four groups of older people, that a clock reading older than the person's age went with a
higher risk of death after allowing for health and lifestyle, which is a link to death and not a
better prediction than age. The record does not claim either was the first of its kind: no source
read settles that, and the earlier wording to that effect was removed on 2026-10-17 for want of a
source. The stage date stays at 2019, the year of the GrimAge report, which gave validation figures
in several groups of over a thousand people (https://doi.org/10.18632/aging.101684)."""

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
Clocks are improving fast and several large health systems were piloting them in 2026; the
likely year assumes a health system publishes routine use, or a regulator clears one as a test,
around 2034. The earliest assumes a pilot already running becomes routine within two years; the
latest allows for the clocks staying research and consumer tools because no regulator sees a
treatment decision that depends on them."""

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2028
likely = 2034
latest = 2060

[[estimate.rung]]
rung = "in-wide-use"
earliest = 2032
likely = 2042
latest = 2080

[[revision]]
date = 2026-10-17
field = "description"
old = "The first such clock, in 2013, matched a person's calendar age to within a few years from any tissue; the useful ones came later, trained not on age but on outcomes. In 2019 a Los Angeles group published GrimAge, trained on smoking and blood proteins, which predicted who would die, and when, better than age in several large groups of people, and later clocks (DunedinPACE, 2022)"
new = "A clock published in 2013 estimated a person's calendar age from those marks in most tissues and cell types; the useful ones came later, trained not on age but on outcomes. In 2019 a Los Angeles group published GrimAge, trained on smoking and blood proteins, which predicted time to death, to heart disease and to cancer more strongly than the earlier clocks did, in validation groups of thousands of people, and later clocks (DunedinPACE, 2022)"
why = "A check against the sources on 2026-10-17: the wording 'The first such clock' was a priority claim that no source read settles, and 'better than age' was more than the GrimAge abstract says (it reports prediction of time to death, heart disease and cancer more strongly than earlier clocks, in validation data from thousands of people). The text now says what the Horvath 2013 abstract (https://doi.org/10.1186/gb-2013-14-10-r115) and the GrimAge abstract (https://doi.org/10.18632/aging.101684) say. The stage and its date do not change."

[[revision]]
date = 2026-10-17
field = "estimate.status"
old = "first-pass"
new = "reviewed"
why = "An outside review of the ranges of years ran on 2026-10-17 (by Google's Gemini 3.1 Pro, an AI model, in its preview version, sent the records in four parts) and left this range as it is, with a line saying why. John ruled on every point of the review on 2026-10-17, so the estimate moves from a first estimate, not yet reviewed, to reviewed, as the rules for the records and for the review say; no year changed."

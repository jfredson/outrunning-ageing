# from memory of the papers and are in the verify list. The estimate is a first pass.

id = "drug-breaks-the-sugar-cross-links-that-stiffen-old-tissue"
added_on = 2026-10-16
name = "A drug breaks the sugar cross-links that stiffen old tissue"
branch = "broken-proteins"
description = """
Sugar in the blood slowly reacts with long-lived proteins such as the collagen in artery walls
and skin, welding them together with cross-links that the body cannot undo; arteries stiffen,
blood pressure rises, and the heart works harder. A drug that broke those welds was tried in
people in 2001: alagebrium made the arteries of older adults measurably more elastic over eight
weeks in a small controlled trial. A placebo-controlled trial in 102 people with heart failure (2011) found no gain,
the company ran out of money and ended its remaining trials in January 2009, and nothing shows the
drug breaks glucosepane, the main human cross-link. A new generation of drugs aimed at glucosepane was in the laboratory when this was
written; the first peer-reviewed paper from that work, in 2026, describes an enzyme that removes a single sugar mark rather than breaking a weld (see the notes)."""
test = """
A person given a drug meant to break advanced glycation cross-links afterwards has measurably
more elastic arteries, or less of the cross-link in a tissue sample, in a peer-reviewed controlled
report. The animal rung is the same in a living animal. For the clinic rung: a regulator approves
such a drug for an age-related condition."""
settler = "Peer-reviewed reports; the regulator's approval record for the clinic rung"
stage = "first-human"
stage_reached_on = "2001-09-25"
stage_record = "https://doi.org/10.1161/hc3801.097806"
status = "tracked"
horizon = "far"

notes = """
Cross-links are not one of the twelve published kinds of ageing damage (the "hallmarks"), and the branch carries
them in its meaning rather than its hallmark list; they are on the site because arterial
stiffening is among the most reliable changes of age and nothing in the clinic reverses it. The
2001 result stands as a first human on a measurement for the class even though the drug that
produced it is gone.
Added 2026-11-27: the first peer-reviewed paper from Revel Pharmaceuticals, the company working on glucosepane breakers, appeared on 2026-07-14 (Trabosh and colleagues, Nature Communications, https://doi.org/10.1038/s41467-026-75141-2; some of the authors are at Calico Life Sciences and the University of Colorado). It reports an enzyme, found by testing more than 500 million variants, that removes one kind of sugar mark (called CML) from a protein and restores the protein's original building block. It worked on model proteins in a dish and on tissue samples from elderly donors. That mark sits on a single protein and is not a cross-link between two proteins, and the work was not done in a living animal or a person, so it does not bear on this entry's test, and the stage and years are unchanged.
"""


# was checked against coverage of the paper on 2026-10-16; the rest is in the verify list. The
# estimate is a first pass.

id = "heart-muscle-grown-from-stem-cells-is-grafted-onto-a-failing-heart"
added_on = 2026-10-16
name = "Heart muscle grown from stem cells is grafted onto a person's failing heart"
branch = "replacing-parts"
description = """
A heart that has lost muscle to a heart attack does not grow it back, and heart failure is among
the commonest ways an old person dies. A Göttingen group grows sheets of beating heart muscle
from stem cells and sews them onto the outside of the heart. In 2025 they reported that in
monkeys the patches took, grew blood vessels and strengthened the heart's pumping, and that in a
person with advanced heart failure, given ten patches (about 400 million cells in all) in the first
trial in people, the grafted muscle cells were found alive, with blood vessels, when the heart was
removed for a transplant three months later. That small trial in people, with no comparison group, reported in the New England Journal of
Medicine on 2026-05-27: of 20 people given the patches, three died during the study and one had a
heart transplant; of the 16 given the highest safe dose, 12 had completed the prespecified 3-month interim
follow-up; in that interim analysis the heart's pumping (ejection fraction) was 3.9 percentage points
higher and the treated wall 4.5 mm thicker. The 2025 case remains the first grafted human heart muscle found alive in a person.
On 2026-03-06 Japan gave a conditional, time-limited approval to a different product of this kind,
Cuorips' sheets of heart muscle grown from donor stem cells, and since 2026-09-01 it has been
covered by public health insurance there (see the notes)."""
test = """
Heart muscle grown from stem cells is grafted onto a person's failing heart and is afterwards
found alive and supplied with blood there, or the heart's pumping measurably improves, in a
peer-reviewed report. The animal rung is the same in a living animal with improved pumping. For
the clinic rung: a regulator approves such a graft for heart failure."""
settler = "The peer-reviewed report; the trial registry; the regulator's approval record for the clinic rung"
stage = "in-clinical-use"
stage_reached_on = "2026-03-06"
stage_record = "https://www.pmda.go.jp/files/000281693.pdf"
stage_publication = "pmda-2026-riheart"
status = "tracked"
horizon = "mid"


notes = """
The animal rung is settled by the same 2025 paper (rhesus monkeys), so no separate earlier
stage is recorded. The patches are made from a donor stem cell line, not the patient's own cells,
and need anti-rejection drugs; a version from the patient's own cells is the next step and is
not yet in people. The 2025 paper (open to read) does not give the patient's age, sex or the year of
the operation, so the description no longer does; it reports that the grafted cells were found
retained, smaller than the host heart's own cells, and with fewer blood vessels than the surrounding
muscle (187 against 963 per square millimetre), with signs of an immune reaction against the graft
or its support material (checked 2026-10-17).
Added 2026-11-27: the clinic rung is reached, in Japan, by a different product from the German patches described above. On 2026-03-06 Japan's regulator gave a conditional, time-limited approval, for seven years, to RiHEART, sheets of heart muscle cells grown from donor stem cells by the company Cuorips, for severe heart failure after heart attacks in people whom standard treatment has not helped enough (the regulator's review report, https://www.pmda.go.jp/files/000281693.pdf; the company's release, https://cuorips.co.jp/news-en/20260306). Public health insurance has covered it since 2026-09-01, and the first operation under that cover was done at Osaka Police Hospital on 2026-09-29 (https://cuorips.co.jp/news-en/200261001). A conditional approval counts here because, under it, doctors can give the treatment outside a trial. Two things weigh against reading much into it. The approval rests on an open study of 8 patients with no comparison group. And Japan approved an earlier heart-sheet product the same way in 2015, Terumo's HeartSheet, made from the patient's own muscle cells, then refused it full approval in July 2024, after which its sales ended (the regulator's record, https://www.pmda.go.jp/files/000272880.pdf). If RiHEART is refused full approval, this entry will record that it was withdrawn.
"""


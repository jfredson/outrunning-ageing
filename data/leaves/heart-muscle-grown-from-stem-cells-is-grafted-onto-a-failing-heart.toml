# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage record
# was checked against coverage of the paper on 2026-10-16; the rest is in the verify list. The
# estimate is a first pass.

id = "heart-muscle-grown-from-stem-cells-is-grafted-onto-a-failing-heart"
name = "Heart muscle grown from stem cells is grafted onto a person's failing heart"
branch = "replacing-parts"
description = """
A heart that has lost muscle to a heart attack does not grow it back, and heart failure is among
the commonest ways an old person dies. A Göttingen group grows sheets of beating heart muscle
from stem cells and sews them onto the outside of the heart. In 2025 they reported that in
monkeys the patches took, grew blood vessels and strengthened the heart's pumping, and that in a
46-year-old woman with heart failure, given ten patches in 2021 while she waited for a donor
heart, the patches were alive and vascularised when her old heart was removed three months
later. A small trial in people, with no comparison group, was under way. It is the first grafted human heart muscle
found alive in a person."""
test = """
Heart muscle grown from stem cells is grafted onto a person's failing heart and is afterwards
found alive and supplied with blood there, or the heart's pumping measurably improves, in a
peer-reviewed report. The animal rung is the same in a living animal with improved pumping. For
the clinic rung: a regulator approves such a graft for heart failure."""
settler = "The peer-reviewed report; the trial registry; the regulator's approval record for the clinic rung"
stage = "first-human"
stage_reached_on = "2025-01-29"
stage_record = "https://doi.org/10.1038/s41586-024-08463-0"
status = "tracked"
horizon = "mid"

verify = [
  "The patient details in the description (a 46-year-old woman, grafts in 2021) are from secondary coverage; the paper itself gives ten patches holding about 400 million cells in all and a donor heart three months later, but not her age, sex or the year.",
]
notes = """
The animal rung is settled by the same 2025 paper (rhesus monkeys), so no separate earlier
stage is recorded. The patches are made from a donor stem cell line, not the patient's own cells,
and need anti-rejection drugs; a version from the patient's own cells is the next step and is
not yet in people."""

[estimate]
status = "first-pass"
set_on = 2026-10-16
why = """
A small trial with no comparison group was running in 2026, with the heart's pumping among its main measures; the likely year assumes
it reports positive around 2030 and a larger trial carries the graft to approval in the late
2030s. The earliest assumes a conditional approval in Europe or Japan on the first trial; the
latest allows for the grafts not improving pumping enough to matter, which the monkey data
suggest but do not prove in people."""

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2031
likely = 2038
latest = 2070

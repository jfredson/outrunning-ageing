# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage facts are
# from memory of the paper and are in the verify list. The estimate is a first pass.

id = "a-treatment-slows-a-biological-age-clock-in-a-controlled-trial"
name = "A treatment slows a biological age clock in a controlled trial"
branch = "measuring-age"
description = """
A clock is only useful to a trial if a treatment can move it, and the first clear case came from
the oldest treatment in the field. The CALERIE trial cut the calories of 145 healthy adults by
about twelve per cent for two years, against 75 who ate as usual, and in 2023 a Columbia and
Duke group read the pace of ageing from their blood, with DunedinPACE, before and after: the
restricted group's pace had slowed by two to three per cent, while the clocks that read the level
of age (not the pace) did not move. It is a controlled, pre-planned analysis of a treatment on a
clock, with the caution that the clock's own validity is the companion entry's business. The
treatment here, eating less, is not a drug; the entry is about the measurement, and any treatment
counts."""
test = """
A controlled trial in people, with the clock analysis planned before the data were unblinded,
reports that a treatment slowed or reversed a validated clock compared with the control group,
in a peer-reviewed report that names the clock. For the clinic rung: a regulator's approval, or a
named clinical setting's published routine practice, rests on a clock result from such a
trial."""
settler = "The peer-reviewed trial report with its pre-registered plan; the regulator's approval record, or a named clinical setting's published practice, for the clinic rung"
stage = "first-human"
stage_reached_on = "2023-02-09"
stage_record = "https://doi.org/10.1038/s43587-022-00357-y"
stage_publication = "waziry-2023"
status = "tracked"
horizon = "mid"

notes = """
John ruled on 2026-10-17, as proposed to him after a check of the record: the 2023 CALERIE paper
does not settle this entry's rung, because the paper itself calls its clock analysis a post hoc
analysis (the assays were blind to trial arm, but the analysis was not planned before the data
were unblinded), and the test asks for one planned in advance. The paper (Waziry and colleagues,
Nature Aging, 2023) is therefore not counted as settling the stage, though it stays the record
cited for this entry's stage, as written.
This entry exists so that the site separates three things that get mixed up: a clock that
predicts outcomes (the companion entry), a treatment that moves a clock in a controlled trial
(this entry), and a regulator accepting the clock as proof (the regulatory entry). The 2019 TRIIM
result on the cell settings branch moved clocks but had no control group, which is why this entry
rests on the 2023 result.
Added 2026-10-17, from the weekly reading of that date: a 2026-09-07 paper in Nature Biotechnology
(Zhavoronkov and colleagues) applied six blood-protein clocks to stored samples from a placebo-controlled
phase 2a trial of the lung-scarring drug rentosertib in 42 people, and all six predicted a lower
biological age in the treated groups. The authors call the findings exploratory and say the clocks
cannot separate slower ageing from an improved lung; the clocks were run on samples already
collected, so, like the 2023 CALERIE paper, it was not a clock analysis planned before the data were
unblinded, and it does not settle a rung. Statements by Eli Lilly and Novo Nordisk that clocks show
people on their weight-loss drugs ageing more slowly were opened on 2026-10-17 in the MIT Technology Review article of 2026-10-06
(https://www.technologyreview.com/2026/10/06/1145836/weight-loss-drugs-glp1-lilly-novo-aging-clocks/). They were talks at a
conference (Aging Research & Drug Discovery, Boston, the weekend before): Novo reported blood-protein clocks on samples from 10,052
people in placebo-controlled semaglutide trials, and Lilly a smaller tirzepatide study with clocks read from the marks on DNA. They
are company talks reported by a journalist, not peer-reviewed reports. Novo's analysis is also posted as an unreviewed preprint
(Research Square, 2026-09-22, https://doi.org/10.21203/rs.3.rs-11082091/v1), whose abstract does not say the clock analysis was
planned before the data were unblinded and says it does not establish biological rejuvenation. One peer-reviewed report does exist
for a related trial: semaglutide against placebo in 84 adults with HIV-associated lipohypertrophy (abnormal fat build-up in the
abdomen) found slower epigenetic ageing on several clocks, with the pace of ageing on one clock 9 per cent slower (Corley and
colleagues, Nature Communications, 2026-05-19, https://doi.org/10.1038/s41467-026-72861-3). Its authors call it a post hoc
exploratory analysis and say epigenetic ageing was not pre-specified, so, like the 2023 CALERIE paper, it does not settle this
rung.
No stage or year was changed.
Added 2026-10-18, from the weekly reading of 2026-10-18 and the audit of that reading the same day: the clock analysis of the COSMOS trial was published in Nature Medicine on 2026-03-09 (Li and colleagues). Its abstract calls it a prespecified ancillary study of a randomised, placebo-controlled trial, in 958 people (average age about 70) given a daily multivitamin-multimineral tablet or cocoa extract for two years, and it names its clocks. The multivitamin slowed two of the five clocks (PCGrimAge by 0.113 years a year, P = 0.017; PCPhenoAge by 0.214 years a year, P = 0.032); the cocoa extract moved none. Read plainly, a prespecified analysis in a placebo-controlled trial that names its clocks meets the test as worded, which the 2023 CALERIE paper did not (John, 2026-10-17). This entry is already at first human, so no stage moves. Whether this paper should replace CALERIE as the record cited for the stage, and so change the stage's date of 2023-02-09, is John's to rule and is left open; the journal's own page needs a sign-in, so the point that the analysis was planned before the data were unblinded rests on the abstract's word 'prespecified'.
"""

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
The clinic rung needs an approval or a published routine practice resting on a clock result,
which waits on a regulator accepting a clock (likely around 2040 on that entry) or on a named
clinic adopting clock-guided treatment and publishing it, which the test allows and which could
come sooner; the likely year is 2037, the earliest assumes a clinic's practice is published
within four years, and the latest allows for the clocks never earning that standing."""

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2030
likely = 2037
latest = 2070


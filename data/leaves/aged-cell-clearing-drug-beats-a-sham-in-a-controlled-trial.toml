# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage facts
# were checked against the trial registry and the company's publication notice on 2026-10-16;
# anything still from memory is in the verify list. The estimate is a first pass and is the
# arguable part.

id = "aged-cell-clearing-drug-beats-a-sham-in-a-controlled-trial"
added_on = 2026-10-16
name = "A drug that clears aged cells beats a sham treatment in a controlled trial"
branch = "worn-out-cells"
description = """
Clearing aged cells (cells that have stopped dividing but will not die, and inflame their
neighbours) from a person is one thing; making a person measurably better is another. This entry
is the second: a controlled trial in which people given such a drug do better on the trial's main
measure than people given a sham or placebo. The first such result came in a small trial in the
eye: in 2022 the company Unity Biotechnology reported that a single injection of its drug UBX1325
into the eyes of people with diabetic macular oedema (swelling at the back of the eye) improved
their vision over twenty-four weeks compared with a sham injection, and the trial was published in a
peer-reviewed journal in 2025. The follow-on trial against the standard drug missed its main goal
in 2025 and the company let its staff go, so the result stands but nothing is approved. A second
controlled result came on 2026-10-01: in a phase 2 trial in Amsterdam, 31 people with scarred fatty
liver were given a by-mouth course of two drugs that clear aged cells (dasatinib and quercetin) or a
placebo, and 47 per cent of those treated, against 7 per cent on placebo, had at least one stage
less scarring on biopsy without the disease worsening."""
test = """
A controlled trial in people, with a placebo or sham group, in which a drug meant to kill aged
cells improves the trial's pre-stated main measure (vision, walking, joint function, disease
progression) by a statistically significant margin, in a peer-reviewed report or a trial
registry's posted results. For the clinic rung: a regulator approves such a drug for an
age-related condition on the strength of such a trial."""
settler = "A peer-reviewed trial report or the trial registry's posted results for the first-human rung; a regulator's approval record for the clinic rung"
stage = "first-human"
stage_reached_on = "2022"
stage_record = "https://clinicaltrials.gov/study/NCT04857996"
status = "tracked"
horizon = "mid"

notes = """
The animal record is shared with the entry on clearing aged cells to make old animals live
longer: the 2011 Mayo Clinic report in which clearing such cells from mice delayed several age-related conditions. The
knee osteoarthritis trial of Unity's earlier drug UBX0101 failed its main measure in 2020; the
2022 eye result was the first controlled human result in the drug class, a small trial of one dose;
the 2026 liver result (Koning and colleagues, Nature Metabolism) is a second, with a by-mouth two-drug course in a different organ.
It too is small (31 people) and in one condition, run by an academic group, with two of its authors
holding patents on drugs of this class. Two other entries on this branch hold the measurement result (fewer aged cells in a
tissue sample) and the knee result; this one holds the clinical benefit."""

[[earlier_stage]]
stage = "shown-in-animals"
reached_on = "2011-11-02"
record = "https://doi.org/10.1038/nature10600"
publication = "baker-2011"

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
One positive controlled trial exists, small and in one eye condition, and the company that ran it
has no staff. Reaching the clinic needs a sponsor to carry a drug of this class through a large
trial and an approval; several academic and company programmes in the knee, the lung and the eye
are at early stages. The likely year assumes one of them reads out positive in the early 2030s
and approval follows in two or three years; the earliest assumes the UBX1325 asset is picked up
and a confirmatory trial starts within two years; the latest allows for the whole first generation
failing on safety or effect and a second generation starting over.
[Note 2026-10-17, from the weekly reading of that date: the reasoning above counts one positive
controlled trial. Two now exist, the 2022 eye trial and the 2026-10-01 liver trial (Koning and colleagues),
each small and in a single organ. The years are unchanged; I may want to weigh the second
trial at the next review of the ranges.]
"""


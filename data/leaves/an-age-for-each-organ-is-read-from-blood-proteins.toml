# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage facts are
# from memory of the paper and are in the verify list. The estimate is a first pass.

id = "an-age-for-each-organ-is-read-from-blood-proteins"
added_on = 2026-10-16
name = "An age for each organ is read from the proteins in a person's blood"
branch = "measuring-age"
description = """
A single number for a person's biological age hides that their heart may be old and their liver
young. In 2023 a Stanford group measured thousands of proteins in the blood of over five
thousand people, assigned each protein to the organ that makes it, and read an age for eleven
organs per person. About one person in five had at least one organ ageing fast; a fast-ageing
heart predicted heart failure over the following fifteen years, and a fast-ageing brain predicted
dementia worsening within five years. It is the kind of reading a trial of a repair treatment would want: not whether the
person is younger, but whether the organ the treatment aimed at is. It is a research tool, not a
test anyone can order from a doctor."""
test = """
A panel of blood proteins read as an age for each of several organs predicts disease of that
organ better than calendar age, in two or more independent groups of at least a thousand people
followed for years, in peer-reviewed reports. For the clinic rung: a regulator clears such a panel
as a medical test, or a named health system uses it in routine care and publishes that practice."""
settler = "Peer-reviewed validation reports; the regulator's clearance record, or a named health system's published practice, for the clinic rung"
stage = "first-human"
stage_reached_on = "2023-12-06"
stage_record = "https://doi.org/10.1038/s41586-023-06802-1"
status = "tracked"
horizon = "mid"

notes = """
The protein approach and the DNA-mark clocks (the companion entry) are the two main families of
ageing marker; this one is newer and has the organ-by-organ reading the other lacks. Neither is
a medical test yet. The entry on a regulator accepting a marker of ageing is where either would
have to go to count for a trial.
Checked 2026-10-17 against the papers' abstracts: the 2023 report (Oh, Wyss-Coray and colleagues, Nature, https://doi.org/10.1038/s41586-023-06802-1)
estimated organ ages in five independent cohorts with 5,676 adults in all. The 2025 follow-up (Oh, Wyss-Coray and colleagues, Nature
Medicine, online 2025-07-09, https://doi.org/10.1038/s41591-025-03798-1) is from the same group: organ ages from 44,498 people in
the UK Biobank were linked to disease starting within 17 years. An independent group (Goeminne, Gladyshev and colleagues, Cell Metabolism, online 2024-11-01,
https://doi.org/10.1016/j.cmet.2024.10.005) built organ-specific protein ages from over 50,000 people in the UK Biobank and other
cohorts and reported that they predict disease in those organs. On the test as worded (two or more independent groups of at least a
thousand people), the second independent group would date from 2024-11-01. This record has not ruled whether the test is met, or
from when, and the stage and its date (2023-12-06) are unchanged. The abstracts do not state a comparison with calendar age, which
the test also asks for; the full texts were not read for it.
Added 2026-10-18, from the weekly reading of 2026-10-18 and the audit of that reading the same day: two further peer-reviewed reports, both read in their open full texts. Wang and colleagues (Nature Aging, online 2025-11-26), who are not the Stanford group, built an organismal and ten organ clocks from a different protein platform in 43,616 UK Biobank people and validated them in 3,977 people in China and 800 in the United States; accelerated organ ageing predicted disease onset, progression and death beyond clinical and genetic risk factors. Robinson and colleagues (Nature Aging, online 2026-06-29) tested the Stanford group's organ clocks in 17,473 people in the European EPIC study followed for up to 28 years (the mortality results replicated in 6,240 people in Whitehall II) and found lung, kidney and stomach cancers more strongly linked to the related organ's age gap (the kidney age gap and kidney cancer, hazard ratio 1.63, 95 per cent confidence interval 1.36 to 1.94); the authors say that before this only the Stanford organ clocks had been independently tested for disease onset across disease classes. The passages read compare the combined clock, not each organ clock, with a model of calendar age and sex, so the open question above, whether the test as worded is met and from when, is not ruled by them. The stage and its date are unchanged.
Added 2026-10-20, after both Stanford papers were read in full. The 2023 report's numbers are as given above (4,979 proteins,
eleven organs, 5,676 people in five groups; nearly one person in five with one organ ageing fast). Two corrections: the
fifteen-year result is for the heart (each extra four years or so of heart age brought about two and a half times the risk
of heart failure, in about a thousand healthy older people), while the brain result is dementia worsening within five years,
in two groups followed by Alzheimer's research centres; the description said both were over fifteen years and was corrected.
On the question above of a comparison with calendar age: in both papers every test of an organ's age against later disease
already allows for the person's calendar age and sex, so the organ's age adds to what calendar age predicts; the 2025 paper
also found the organ ages predicted death better than two other measures (a kidney blood test and a clock built from routine
blood tests) with calendar age allowed for. Neither paper sets an organ's age against calendar age alone, head to head, for
that organ's disease. Whether that meets the test as worded is still mine to rule, and the stage and its date are unchanged.
"""

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
The protein-measuring platforms are expensive and the panels are two years old; the likely year
assumes a health system publishes routine use of an organ-age panel around 2036, after a few
years of cheaper assays; the earliest assumes a specialist clinic's published practice counts
sooner; the latest allows for the panels staying a research tool."""

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2029
likely = 2036
latest = 2070


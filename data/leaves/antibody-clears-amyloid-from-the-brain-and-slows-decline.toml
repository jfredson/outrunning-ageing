[estimate]
status = "first-pass"
set_on = 2026-10-16
why = """
Wide use needs a form that does not require infusions and frequent scans (an under-the-skin
version was approved in 2025 for maintenance), lower prices, and clinics able to give it. The
likely year assumes those come together in the mid 2030s; the earliest assumes the next
generation of antibodies, with fewer brain-swelling events, arrives sooner; the latest allows for
the drugs staying a specialist treatment given to a small share of patients.
[Note 2026-10-17, from the weekly reading of that date: the first sentence above names infusions as
a bar to wide use and says the under-the-skin form was approved in 2025 for maintenance only.
Since 2026-07-13 it is also approved as a starting dose (eisai-2026, the companies' own release),
so that bar no longer holds. The frequent brain scans, the price and the absence of any published
uptake figure stand. The years are unchanged; John may want to weigh whether the earliest and likely
wide-use years (2028, 2035) should move at the next review.]
"""


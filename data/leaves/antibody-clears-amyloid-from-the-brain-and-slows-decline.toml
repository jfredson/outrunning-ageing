# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The approval date
# was checked against coverage of the regulator's notice on 2026-10-16; the earlier stages are
# from memory and in the verify list. The estimate is a first pass.

id = "antibody-clears-amyloid-from-the-brain-and-slows-decline"
name = "An antibody clears amyloid from the brain and slows the decline of Alzheimer's disease"
branch = "broken-proteins"
description = """
Amyloid is a protein that misfolds and piles up between brain cells with age, and in Alzheimer's
disease it piles up faster. Antibodies that stick to it and get the immune system to clear it
were first shown to work in mice in 1999, failed in people for twenty years, and in 2022 one of
them, lecanemab, slowed the decline of people with early Alzheimer's by about a quarter over
eighteen months in a trial of nearly eighteen hundred people. The United States regulator gave it
full approval on 6 July 2023, and a second antibody followed in 2024. The effect is modest, the
drug needs frequent brain scans, and some patients bleed or swell in the brain; so it is in
clinical use, not wide use. It has needed infusions, but on 2026-07-13 the United States regulator
approved an under-the-skin weekly autoinjector as the starting dose too, so a whole course can now
be given at home."""
test = """
A person given an antibody against amyloid afterwards has measurably less of it in the brain on
a scan, and in a controlled trial such people decline more slowly on a pre-stated measure of
thinking and function than those on placebo, in a peer-reviewed report. The animal rung is amyloid
cleared from a living animal's brain. For the clinic rung: a regulator's full approval, not an
accelerated one, for Alzheimer's disease. For wide use: available by prescription in several
countries and taken by a substantial share of eligible patients."""
settler = "Peer-reviewed trial reports; the regulator's approval record; published uptake figures for the wide-use rung"
stage = "in-clinical-use"
stage_reached_on = "2023-07-06"
stage_record = "https://www.fda.gov/news-events/press-announcements/fda-converts-novel-alzheimers-disease-treatment-traditional-approval"
status = "tracked"
horizon = "mid"

verify = [
  "That uptake of both antibodies has been slow is supported by trade coverage (2025-11-10); the patient counts (tens of thousands) and the number eligible (millions) were not found in a primary source.",
  "A Cochrane overview of the two Alzheimer's antibodies, reported in 2026-04 (seen only in a German news report of 2026-04-16), concluded that they offer little clinical benefit against their risks; the overview's own page was not opened, so it is not logged.",
]
notes = """
The branch's own line on what would move it asks for a kind of waste cleared throughout the body,
not one organ; this leaf is one organ and one protein, and the branch's notes say so. It is on the
tree because it is the first approved drug that removes an age-related protein deposit from a
person and changes the course of the disease, and because the twenty years of failure before it
are the best record the tree has of how long such a drug takes."""


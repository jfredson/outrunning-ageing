# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The approval date
# was checked against coverage of the regulator's notice on 2026-10-16; the earlier stages are
# from memory and in the verify list. The estimate is a first pass.

id = "antibody-clears-amyloid-from-the-brain-and-slows-decline"
name = "An antibody clears amyloid from the brain and slows the decline of Alzheimer's disease"
branch = "broken-proteins"
description = """
Amyloid is a protein that misfolds and piles up between brain cells with age, and in Alzheimer's
disease it piles up faster. Antibodies that stick to it and get the immune system to clear it
were first shown to work in mice in 1999, failed in people for twenty years, and in 2022 one of
them, lecanemab, slowed the decline of people with early Alzheimer's by about a quarter over
eighteen months in a trial of nearly eighteen hundred people. The United States regulator gave it
full approval on 6 July 2023, and a second antibody followed in 2024. The effect is modest, the
drug needs frequent brain scans, and some patients bleed or swell in the brain; so it is in
clinical use, not wide use. It has needed infusions, but on 2026-07-13 the United States regulator
approved an under-the-skin weekly autoinjector as the starting dose too, so a whole course can now
be given at home."""
test = """
A person given an antibody against amyloid afterwards has measurably less of it in the brain on
a scan, and in a controlled trial such people decline more slowly on a pre-stated measure of
thinking and function than those on placebo, in a peer-reviewed report. The animal rung is amyloid
cleared from a living animal's brain. For the clinic rung: a regulator's full approval, not an
accelerated one, for Alzheimer's disease. For wide use: available by prescription in several
countries and taken by a substantial share of eligible patients."""
settler = "Peer-reviewed trial reports; the regulator's approval record; published uptake figures for the wide-use rung"
stage = "in-clinical-use"
stage_reached_on = "2023-07-06"
stage_record = "https://www.fda.gov/news-events/press-announcements/fda-converts-novel-alzheimers-disease-treatment-traditional-approval"
status = "tracked"
horizon = "mid"

notes = """
The branch's own line on what would move it asks for a kind of waste cleared throughout the body,
not one organ; this treatment is one organ and one protein, and the branch's notes say so. It is
listed because it is the first approved drug that removes an age-related protein deposit from a
person and changes the course of the disease, and because the twenty years of failure before it
are the best record the site has of how long such a drug takes.
Added 2026-10-17, after checking the sources: the companies publish sales but not how many people
are being treated or are eligible. Biogen's results release of 2026-07-29 for the quarter ending
2026-06-30 gives worldwide sales of the antibody (lecanemab) of $184 million, $97 million of it in
the United States, and neither that release, Biogen's quarterly filing with the United States
securities regulator for the same quarter, nor its annual filing for 2025 gives a count of people
treated. No uptake figure is therefore recorded here; the stage rests on the approval and does not
need one. A Cochrane overview of the antibodies, published 2026-04-16 (Nonino and colleagues;
abstract at https://pubmed.ncbi.nlm.nih.gov/41985900/), pooled 17 trials of seven antibodies
(20,342 people), only one of them for lecanemab and one for donanemab, and concluded that the effect
on thinking and on dementia severity at 18 months is "trivial" and on everyday function "small at
best". The overview is not used in the estimate.
"""

[[earlier_stage]]
stage = "shown-in-animals"
reached_on = "1999-07-08"
record = "https://doi.org/10.1038/22124"

[[earlier_stage]]
stage = "first-human"
reached_on = "2022-11-29"
record = "https://doi.org/10.1056/NEJMoa2212948"

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
Wide use needs a form that does not require infusions and frequent scans (an under-the-skin
version was approved in 2025 for maintenance), lower prices, and clinics able to give it. The
likely year assumes those come together in the mid 2030s; the earliest assumes the next
generation of antibodies, with fewer brain-swelling events, arrives sooner; the latest allows for
the drugs staying a specialist treatment given to a small share of patients.
[Note 2026-10-17, from the weekly reading of that date: the first sentence above names infusions as
a bar to wide use and says the under-the-skin form was approved in 2025 for maintenance only.
Since 2026-07-13 it is also approved as a starting dose (the companies' own release, Eisai and
Biogen, 2026-07-13), so that bar no longer holds. The frequent brain scans, the price and the absence of any published
uptake figure stand. The years are unchanged; John may want to weigh whether the earliest and likely
wide-use years (2028, 2035) should move at the next review.]
"""

[[estimate.rung]]
rung = "in-wide-use"
earliest = 2028
likely = 2035
latest = 2055


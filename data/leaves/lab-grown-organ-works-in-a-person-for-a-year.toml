# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. One of the five
# leaves shared with The Upgrade Tree; the stage facts are copied from its record
# (upgrade-tree/data/lifespan.toml, id lifespan-lab-grown-organ-works-in-a-person-for-a-year),
# which a session there checked on 2026-10-16. The estimate is a first pass.

id = "lab-grown-organ-works-in-a-person-for-a-year"
name = "A printed or lab-grown organ works in a person for a year"
branch = "replacing-parts"
description = """
Take a few of a person's own cells, grow them on a scaffold shaped like the organ, and put the
result in. In 2006 a North Carolina group reported seven young people with bladders made this way,
working for years. Nothing more complicated than a hollow organ has been done, and printed organs
with their own blood supply remain in the laboratory. The leaf is written to count working organs,
not patches: skin, cartilage and blood vessels grown from cells are already approved, but they
replace a surface or a tube, not an organ's job."""
test = """
An organ built outside the body from living cells, with or without a printed scaffold, is placed
in a person and does that organ's job for at least a year, in a peer-reviewed report. Organ here
means a bladder, kidney, liver, heart, lung, pancreas, windpipe, oesophagus or length of
intestine; skin, cartilage, cornea and blood vessels are counted as tissues and left out. For the
clinic rung: a regulator approves an engineered organ for use outside a trial."""
settler = "Peer-reviewed reports with follow-up of a year or more; a regulator's approval record if an engineered organ is approved"
stage = "first-human"
stage_reached_on = "2006-04-15"
stage_record = "https://doi.org/10.1016/S0140-6736(06)68438-9"
stage_publication = "atala-2006"
status = "tracked"
horizon = "mid"
sibling = "lifespan-lab-grown-organ-works-in-a-person-for-a-year"

notes = """
The record is the 2006 Lancet report of engineered bladders in seven patients. The printed ear
of 2022 (a company announcement with no peer-reviewed report) is cartilage, not an organ, and
would not count under the test even if published. The later synthetic windpipe cases of the
2010s were found to be fraudulent and do not count. The Upgrade Tree keeps the same leaf at first
human; the weekly reading checks the two stages agree."""

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
Twenty years after the bladders, no engineered organ is in a late-stage trial; the solid organs
need a blood supply that nobody has grown at scale. The likely year assumes a hollow organ (a
bladder or a length of windpipe or gut) reaches an approval in the mid 2040s through a rare
condition; the earliest assumes one of the bladder programmes restarts and files on existing
data; the latest allows for the vascular problem staying unsolved for the century."""

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2032
likely = 2045
latest = 2100

[[revision]]
date = 2026-10-17
field = "estimate.status"
old = "first-pass"
new = "reviewed"
why = "The outside review of the ranges ran on 2026-10-17 (Google's gemini-3.1-pro-preview, four packets; docs/reviews/protocol.md) and left this range as it is, with a line saying why under 'Treatments the reviewer left as they are' in docs/reviews/2026-10-17-rulings.md. John ruled on every item of the review on 2026-10-17, so the estimate's status moves from first pass to reviewed, as the record layout and the review protocol say; no year changed."

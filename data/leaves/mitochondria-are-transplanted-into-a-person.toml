# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage facts are
# from memory of the papers and are in the verify list. The estimate is a first pass.

id = "mitochondria-are-transplanted-into-a-person"
name = "Fresh mitochondria are transplanted into a person's failing tissue"
branch = "energy-and-fuel"
description = """
Mitochondria are the cell's power plants, and they fail with age; one way around that is to put
fresh ones in. From 2009 to 2016 a Boston group showed, first in rabbit hearts kept alive in a dish and then in
living rabbits and pigs, that mitochondria taken from a healthy muscle and injected into the heart
during a heart attack were taken up by the heart cells and helped the heart recover. In 2017 the same group reported the first people: five
babies and young children whose hearts had failed after surgery, given mitochondria from their own
abdominal muscle,
four of whom came off the heart-lung machine. It is a first human on a function, in a desperate
setting, with no control group. Whether the same could refresh an old person's tissues is what
the leaf tracks."""
test = """
A person given an infusion or injection of mitochondria into a failing tissue afterwards has a
measurable improvement in that tissue's function, in a peer-reviewed report. The animal rung is
the same in a living animal. For the clinic rung: a regulator approves mitochondrial
transplantation for any condition."""
settler = "Peer-reviewed reports; the trial registry; the regulator's approval record for the clinic rung"
stage = "first-human"
stage_reached_on = "2017-07"
stage_record = "https://doi.org/10.1016/j.jtcvs.2017.02.018"
stage_publication = "emani-2017"
status = "tracked"
horizon = "mid"

verify = [
  "That trials of mitochondrial transplantation have treated people in stroke (United States), heart attack (Iran) and muscle disease (Korea) is confirmed; whether a trial in Taiwan exists is unchecked, and note that a small randomised heart-attack trial (Iran, 2024) has reported a controlled result.",
]
notes = """
This is a different thing from the mitochondrial replacement used in fertility clinics (a donor's
mitochondria put into an egg), which is reproduction, not repair, and is not on this tree. The
leaf's hard problem is that injected mitochondria do not last; whether they help by being taken
up or by signalling is still argued."""

[[earlier_stage]]
stage = "shown-in-animals"
reached_on = "2013-01-25"
record = "https://doi.org/10.1152/ajpheart.00883.2012"

[estimate]
status = "first-pass"
set_on = 2026-10-16
why = """
Several early trials were running in 2026 with no controlled result; the likely year assumes
one in heart surgery or stroke reports positive around 2033 and an approval for that setting
follows in the mid 2040s. The earliest assumes a fast route through paediatric heart surgery,
where the procedure began; the latest allows for the transplanted organelles never being shown to
do more than a signal, and the leaf resting at first human."""

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2033
likely = 2045
latest = 2095

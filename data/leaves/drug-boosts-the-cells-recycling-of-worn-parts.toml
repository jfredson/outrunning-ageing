# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage facts are
# from memory of the papers and are in the verify list. The estimate is a first pass.

id = "drug-boosts-the-cells-recycling-of-worn-parts"
name = "A drug that boosts the cell's recycling of its worn parts improves an age-related function in people"
branch = "broken-proteins"
description = """
Cells break down and recycle their own worn parts, a process called autophagy, and it slows with
age so that damaged proteins and worn power plants pile up inside the cell. Several substances
turn it back up. Spermidine, found in wheat germ and aged cheese, lengthened the lives of old mice
and protected their hearts in a 2016 report from Graz and elsewhere. In people the record is
thinner: a 2022 controlled trial of spermidine in older adults found no effect on memory, and the
best-known recycling booster, rapamycin, has its own leaves on the energy branch. The leaf asks
for a human function result, not a blood marker."""
test = """
A controlled trial in people reports that a drug or supplement given to boost autophagy (the
cell's recycling of its worn parts) improves an age-related function (memory, heart function,
muscle strength) more than placebo on the trial's pre-stated main measure, in a peer-reviewed
report. The animal rung is the same in a living animal, or a longer life. For the clinic rung: a
regulator approves such a treatment for an age-related condition."""
settler = "The peer-reviewed trial report; the regulator's approval record for the clinic rung"
stage = "shown-in-animals"
stage_reached_on = "2016-11-14"
stage_record = "https://doi.org/10.1038/nm.4222"
status = "tracked"
horizon = "mid"

notes = """
The difficulty with this leaf is that most drugs on the energy branch also boost recycling, so a
human result there could be claimed here; the test asks that the drug be given for that purpose
and the report say so. Rapamycin's human results are on the energy branch and are not counted
twice.
Added 2026-10-17, after checking the trial reports: urolithin A, which switches on the clearing of
worn power plants and has its own entry on the energy branch, was tested in two controlled trials in 2022,
and neither counts here because neither met its main measure. In 66 adults aged 65 to 90 (JAMA
Network Open, https://doi.org/10.1001/jamanetworkopen.2021.44279) the main measures, the distance
walked in six minutes and the energy output of hand muscle, did not differ from placebo, though muscle
endurance, a secondary measure, improved. In middle-aged adults (Cell Reports Medicine,
https://doi.org/10.1016/j.xcrm.2022.100633) the main measure, peak power output, did not differ from
placebo, though muscle strength improved by about 12 per cent."""

[estimate]
status = "first-pass"
set_on = 2026-10-16
why = """
Spermidine and related supplements are cheap and widely sold, which means trials are small and
underfunded; the likely year assumes a mid-sized controlled trial reports a function benefit in
the early 2030s and that an approval for an age-related condition, rather than supplement sales,
comes in the mid 2040s. The earliest assumes a trial already running reports positive by 2029;
the latest allows for the supplements staying unproven and the rung being reached by a
prescription drug designed for the purpose much later."""

[[estimate.rung]]
rung = "first-human"
earliest = 2028
likely = 2032
latest = 2050

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2033
likely = 2045
latest = 2095


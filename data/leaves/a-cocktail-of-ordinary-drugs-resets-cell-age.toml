# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The facts are from
# memory of the papers and are in the verify list. The estimate is a first pass.

id = "a-cocktail-of-ordinary-drugs-resets-cell-age"
name = "A mix of small-molecule drugs resets a cell's age without gene therapy"
branch = "cell-settings"
description = """
Resetting a cell's age with genes needs a virus to carry them and a way to switch them off, which
is why the first human trial is in the eye, a small sealed organ. A pill or an infusion that did
the same with ordinary chemicals could reach the whole body. In 2023 a Harvard group reported six
mixes of known drugs that, in a dish, turned back a reading of human cells' age (taken from which genes are active) by several
years within a week without turning the cells into stem cells, following a 2022 Chinese report
that a chemical mix could fully reset human cells. In 2025 peer-reviewed reports gave a two-chemical mix to animals: it extended the lifespan and healthspan of worms, and in a small study in ageing mice it improved neurological scores and the longest lifespan, with some changes in liver and brain tissue. The reports describe no clock of cell age read in the animals, and a 2026 report in mice found no change in the age of kidney or liver tissue at lower doses, and weight loss at higher doses that forced the mice to be put down. These are not counted as the result the test asks for, so the leaf stays at idea only."""
test = """
A living animal given a mix of small-molecule drugs, with no genes delivered, afterwards has a
measured marker of biological age (a clock read from the chemical marks on its DNA, a restored
tissue function) moved towards youth compared with untreated controls, in a peer-reviewed report;
that is the animal rung. The first-human rung needs the same in a person; the clinic rung a
regulator's approval of such a mix for any condition."""
settler = "Peer-reviewed reports; the trial registry and report for the first person treated; the regulator's approval record for the clinic rung"
stage = "idea-only"
status = "tracked"
horizon = "far"

notes = """
This is the version of cell resetting that could matter for the headline, because it is the one
that could be given to a whole person; it is also the one furthest from the record. The gene
version has two leaves beside this one.
Checked 2026-10-17 against the papers' abstracts (Europe PMC searches; not a complete survey). The worm report (Schoenfeldt and
colleagues, EMBO Molecular Medicine, 2025-06-30, https://doi.org/10.1038/s44321-025-00265-9) found that a two-chemical mix improved
ageing features in aged human cells in a dish and extended the lifespan and healthspan of the roundworm C. elegans. The mouse report
(Vedunova and colleagues, Brain and Behavior, 2025-05-30, https://doi.org/10.1002/brb3.70573) gave two chemicals (RepSox and
tranylcypromine) by injection for 30 days to female mice: the older group (16 to 20 months) had better neurological scores, fur and
skeletal health, with some adverse changes in liver and brain; in the younger group (10 to 13 months) overall survival did not differ
significantly but the longest lifespan was greater (p = 0.039). The 2026 mouse report (Mitchell and colleagues, Aging Cell,
2026-01-27, https://doi.org/10.1111/acel.70390) found no effect on the transcriptomic age of kidney or liver at lower doses and a drastic loss of body weight,
needing euthanasia, at higher doses. Whether the 2025 mouse report meets the test's animal rung (a marker of biological age or a
restored tissue function moved towards youth against untreated controls) is not settled: it measured behaviour, appearance and
lifespan, not a clock of cell age, and it also reports tissue changes. It is not counted, the stage stays at idea only, and the
question is left for John to rule. The earlier sentence that no peer-reviewed report existed was replaced on 2026-10-17 by the
description above, because these reports do exist.
"""

[estimate]
status = "first-pass"
set_on = 2026-10-16
why = """
Several companies and academic groups were testing chemical mixes in mice when this was written,
so the animal rung is probably close; the likely year for it is 2029. The first human is the
step that needs a safety case for a drug that reaches every cell, which is why it sits in the mid
2030s, and the clinic rung, an approval for some condition, around 2050. The earliest is a fast
path through a single organ (skin or eye); the latest allows for the whole approach stalling on
the tumour risk that hangs over every version of cell resetting."""

[[estimate.rung]]
rung = "shown-in-animals"
earliest = 2027
likely = 2029
latest = 2040

[[estimate.rung]]
rung = "first-human"
earliest = 2031
likely = 2036
latest = 2055

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2038
likely = 2050
latest = 2110


# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The facts are from
# memory of the papers and are in the verify list. The estimate is a first pass.

id = "a-cocktail-of-ordinary-drugs-resets-cell-age"
name = "A mix of small-molecule drugs resets a cell's age without gene therapy"
branch = "cell-settings"
description = """
Resetting a cell's age with genes needs a virus to carry them and a way to switch them off, which
is why the first human trial is in the eye, a small sealed organ. A pill or an infusion that did
the same with ordinary chemicals could reach the whole body. In 2023 a Harvard group reported six
mixes of known drugs that, in a dish, turned back a reading of human cells' age (taken from which genes are active) by several
years within a week without turning the cells into stem cells, following a 2022 Chinese report
that a chemical mix could fully reset human cells. None has been shown to work in a living animal
in a peer-reviewed report, so the leaf is at idea only."""
test = """
A living animal given a mix of small-molecule drugs, with no genes delivered, afterwards has a
measured marker of biological age (a clock read from the chemical marks on its DNA, a restored
tissue function) moved towards youth compared with untreated controls, in a peer-reviewed report;
that is the animal rung. The first-human rung needs the same in a person; the clinic rung a
regulator's approval of such a mix for any condition."""
settler = "Peer-reviewed reports; the trial registry and report for the first person treated; the regulator's approval record for the clinic rung"
stage = "idea-only"
status = "tracked"
horizon = "far"

verify = [
  "That no peer-reviewed report existed by 2026-10-16 of a chemical cocktail moving an age marker towards youth in a living mammal (a 2025 report extended the lifespan and healthspan of worms with a two-chemical mix, and a 2026 report found no change in mouse tissue age and toxicity at higher doses) is from searches of Europe PMC and the web, not a complete survey; whether the worm result counts as the animal rung is undecided.",
]
notes = """
This is the version of cell resetting that could matter for the headline, because it is the one
that could be given to a whole person; it is also the one furthest from the record. The gene
version has two leaves beside this one."""

[estimate]
status = "first-pass"
set_on = 2026-10-16
why = """
Several companies and academic groups were testing chemical mixes in mice when this was written,
so the animal rung is probably close; the likely year for it is 2029. The first human is the
step that needs a safety case for a drug that reaches every cell, which is why it sits in the mid
2030s, and the clinic rung, an approval for some condition, around 2050. The earliest is a fast
path through a single organ (skin or eye); the latest allows for the whole approach stalling on
the tumour risk that hangs over every version of cell resetting."""

[[estimate.rung]]
rung = "shown-in-animals"
earliest = 2027
likely = 2029
latest = 2040

[[estimate.rung]]
rung = "first-human"
earliest = 2031
likely = 2036
latest = 2055

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2038
likely = 2050
latest = 2110

# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage facts are
# from memory of the paper and are in the verify list. The estimate is a first pass.

id = "premature-ageing-mutation-corrected-in-a-living-animal"
added_on = 2026-10-16
name = "The mutation behind a premature-ageing disease is corrected in a living animal"
branch = "damaged-dna"
description = """
Progeria is a disease in which one wrong letter in one gene makes children age fast and die in
their teens. In 2021 a Harvard and National Institutes of Health group used a base editor, a tool
that changes a single letter of DNA without cutting it, carried into mice with the human mutation
by a harmless virus. One dose corrected the letter in roughly a fifth to three-fifths of the cells in various organs
(about a quarter in the main artery) six months later, and the mice lived about 2.4 times as
long as untreated mice. It is the clearest case
of repairing a single ageing-related mutation in a living body. The children's version of the
disease has an approved drug (lonafarnib, 2020) that treats its effects, but no person has had the
mutation itself corrected."""
test = """
A living animal carrying a mutation that causes premature ageing, or an ageing-related disease,
has the mutation corrected in a substantial share of the cells of an affected organ by a treatment
given after birth, and lives longer or stays healthier for it, in a peer-reviewed report. The
first-human rung is the same correction, measured, in a person. For the clinic rung: a regulator
approves a gene-correction therapy for such a disease."""
settler = "Peer-reviewed reports; the trial registry and report when a first person is treated; the regulator's approval record for the clinic rung"
stage = "shown-in-animals"
stage_reached_on = "2021-01-06"
stage_record = "https://doi.org/10.1038/s41586-020-03086-7"
status = "tracked"
horizon = "mid"

notes = """
The first person to have a single mutation corrected inside their body by a base editor was a
baby with a liver enzyme disease, treated in 2025 with a therapy made for him alone; that is not
a premature-ageing disease, so it does not settle this entry's first human rung, but it shows the
tool works in a person. A separate entry on this branch tracks gene editing inside a person's
body for an age-related disease."""

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
The 2025 one-patient case shows the tool can be made and dosed in a person within months when
the disease is grave enough. The likely year for the first human assumes a progeria child is
treated under a compassionate or single-patient route around 2029; the clinic rung, an approval
for a premature-ageing or ageing-related disease, assumes a small trial and a rare-disease
approval in the late 2030s. The earliest is the 2025 pace repeated; the latest allows for the
delivery problem (getting the editor into enough cells of the right organs) stalling the field."""

[[estimate.rung]]
rung = "first-human"
earliest = 2027
likely = 2029
latest = 2040

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2032
likely = 2038
latest = 2080

[[revision]]
date = 2026-10-17
field = "estimate.status"
old = "first-pass"
new = "reviewed"
why = "An outside review of the year ranges ran on 2026-10-17 (by an AI model from another company, Google's Gemini 3.1 Pro in its preview version, given the treatments in four groups) and proposed moving this range, which I declined on 2026-10-17: the reviewer proposed moving the earliest to 2036 and the likely to 2042 as too fast for a whole-body gene therapy, citing the regulator's long-term follow-up guidance of 2020-01-30 and Zolgensma's five years from first trial (2014-05-05) to approval (2019-05-24); the guidance does not say approval waits for the follow-up, and the record's earliest clinic year sits five years after its earliest first human year, the pace the reviewer's own precedent gives; the range stays 2032, 2038, 2080. With every point of the review ruled, this estimate moves from a first estimate, not yet reviewed, to a reviewed one, as the rules for the record and for outside reviews say."

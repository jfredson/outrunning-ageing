# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage record
# was checked against the paper's listing on 2026-10-16 (title, journal, DOI, the 11-of-12
# figure); the rest is in the verify list. The estimate is a first pass.

id = "a-drug-lengthens-chromosome-ends-in-a-person"
added_on = 2026-10-16
name = "A drug lengthens the ends of chromosomes in a person"
branch = "damaged-dna"
description = """
The caps on chromosome ends (telomeres) shorten with each cell division and with age, and some
people inherit faults that shorten them fast, so their bone marrow and lungs fail young. In 2016
a National Institutes of Health group gave such people danazol, a synthetic hormone that had been
on the market for decades, and measured their telomeres: in eleven of the twelve people who
reached two years, the caps had grown longer, and most patients' blood counts improved. It is the
first measured lengthening of telomeres in people by a drug. The drug is not approved for the
purpose, a long-term follow-up published in 2026 measured telomere length again, by a different method, in the few patients with usable samples, and found it stable, with no significant lengthening, and it was given for a rare disease,
not for ageing."""
test = """
A person given a treatment afterwards has measurably longer telomeres (the caps on chromosome
ends) in their blood cells than before, in a peer-reviewed report with the measurement method
stated. For the clinic rung: a regulator approves a treatment for lengthening telomeres, or for a
telomere disease on the basis of lengthening them; off-label use does not count."""
settler = "The peer-reviewed report; the regulator's approval record for the clinic rung"
stage = "first-human"
stage_reached_on = "2016-05-19"
stage_record = "https://doi.org/10.1056/NEJMoa1515319"
status = "tracked"
horizon = "mid"

notes = """
Danazol is a prescription drug, and doctors at a few specialist centres give it to people with
telomere diseases on the strength of this trial. That is off-label use, which the test excludes
from the clinic rung on purpose, so that the rung means a regulator looked at the evidence. A
telomerase gene therapy, the other route to the same result, has its own entry at the animal
rung.
Checked 2026-10-17: the long-term follow-up is a research letter in Blood Advances (Lee and colleagues, volume 10, pages 208 to 212,
online 2025-10-22, https://doi.org/10.1182/bloodadvances.2025017860; open access, https://pmc.ncbi.nlm.nih.gov/articles/PMC12805271/).
It reports 26 evaluable patients, median follow-up 3.3 years, and says danazol 'stabilized telomere attrition'. Telomere length was
re-measured by flow-FISH (a different method from the 2016 trial's): in two patients with stored samples from enrolment and two
years after treatment it was stable, in eight patients followed after the trial it was stable whether or not danazol was restarted,
and 'no significant TL elongation was observed in this limited number of samples'; the authors call the analysis limited by cohort
size. The figures from the 2024 conference abstract (stable in five of nine evaluable patients, shortening in three, lengthening in
one) are not in the letter and are no longer used here. The stage rests on the 2016 report of lengthening by its own method.
"""

[[earlier_stage]]
stage = "shown-in-animals"
reached_on = "2015-07-23"
record = "https://doi.org/10.3324/haematol.2015.129239"

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
The clinic rung needs a regulator's approval of a drug for lengthening telomeres, or for a
telomere disease on the basis of lengthening them. The first estimate of 2026-10-16 assumed a filing
on existing data within four years and an approval of danazol or a related hormone around 2034
after a confirmatory trial. Both premises failed on the record's own sources, and John moved the
range on 2026-10-17 on an outside review's proposal: the long-term follow-up of the 2016 trial
(Blood Advances, 2026) found telomere length stable, with no significant lengthening, in the few
patients re-measured, so a sponsor could not file for a lengthening claim on the data in hand; and
the trial registry (its entry for the TELO-SCOPE trial) shows the one phase 2 trial aimed at
telomere attrition, in lung scarring, stopped for futility in 2025, the other danazol trials small, completed or of unknown
status, no phase 3, and no sponsor carrying a generic hormone towards an approval. The earliest now
assumes a new confirmatory trial of danazol or a relative starts within a few years and reports
lengthening by the 2016 trial's method; the likely assumes a new molecule has to go through every
trial phase for a rare disease; the latest allows for no sponsor ever taking it up, in which case the
rung is reached by some later treatment. An approval for ageing itself, rather than a telomere
disease, is not what this entry asks."""

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2038
likely = 2048
latest = 2085


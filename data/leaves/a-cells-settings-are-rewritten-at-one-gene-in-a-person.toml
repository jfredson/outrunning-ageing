# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The animal record
# is from memory; the human trial's status was checked against the sponsor's 2026 notice on
# 2026-10-16. The estimate is a first pass.

id = "a-cells-settings-are-rewritten-at-one-gene-in-a-person"
name = "The chemical marks on one gene are rewritten in a person, with no cut in the DNA"
branch = "cell-settings"
description = """
Wholesale resetting of a cell's settings is one route; the other is to rewrite the marks on a
single chosen gene, switching it off or on for good without cutting the DNA. In 2024 a Milan group
did this in mice for a cholesterol gene in the liver, with one dose, and the gene stayed silenced, with the protein in the blood almost halved, for
nearly a year. The same tool, aimed at a liver-infecting virus rather than an ageing gene, is
the subject of a trial in people that the trial registry shows as started on 2024-11-29, and on 2026-05-30 the company reported that the virus's markers had stayed down for up to
seventeen months after one dose; that report is a conference
presentation, not a peer-reviewed paper, so the leaf waits at the animal rung for one."""
test = """
A person is given a treatment that rewrites the chemical marks on one chosen gene, without
cutting the DNA, and the gene's product is measurably changed in the way intended for at least
six months, in a peer-reviewed report or a trial registry's posted results. The animal rung is the
same in a living animal. For the clinic rung: a regulator approves such a treatment for any
condition."""
settler = "Peer-reviewed reports or the trial registry's posted results; the regulator's approval record for the clinic rung"
stage = "shown-in-animals"
stage_reached_on = "2024-02-28"
stage_record = "https://doi.org/10.1038/s41586-024-07087-8"
status = "tracked"
horizon = "near"

notes = """
The company's 2026 presentation would meet the test if it were peer-reviewed or posted to the
registry as results; the weekly reading should expect this leaf to move to first human soon
after either happens. The gene in the human trial is a virus's, not a person's, and the test
allows that on purpose: the tool is what this leaf tracks, and an ageing gene can be aimed at
later.
Checked 2026-10-17: the trial's registry entry (NCT06671093, https://clinicaltrials.gov/study/NCT06671093)
gives a study start of 2024-11-29 (marked actual), sites in Auckland, Hong Kong and Moldova, and the
status recruiting; the company's notice of 2024-11-14 says the New Zealand regulator had approved the
trial and the first site would be in Auckland, and its release of 2026-05-30 (results presented at a
European liver congress) says markers stayed repressed after a single dose "out to 17 months". Neither
the registry nor the company's releases give the date of the first person dosed, so this record does
not state one; an earlier wording that the first person was dosed in late 2024 was removed on
2026-10-17 for want of a source. The animal record is the paper at the stage link, whose abstract
says one injection almost halved the circulating protein for nearly a year in mice."""

[estimate]
status = "first-pass"
set_on = 2026-10-16
why = """
The first-human rung waits only on a peer-reviewed report of a trial that has already reported
at a conference; likely 2027. The clinic rung needs an approval for some condition: the hepatitis
B programme was moving to a larger trial in 2026, so an approval in the mid 2030s is likely, with
the earliest a fast route on strong late-stage data and the latest allowing for the first
indication failing and the tool waiting for another."""

[[estimate.rung]]
rung = "first-human"
earliest = 2026
likely = 2027
latest = 2032

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2031
likely = 2036
latest = 2070

[[revision]]
date = 2026-10-17
field = "description"
old = "has been given to people since late 2024, and the company reported in May 2026 that the virus's markers stayed down for seventeen months after one dose"
new = "is the subject of a trial in people that the trial registry shows as started on 2024-11-29, and on 2026-05-30 the company reported that the virus's markers had stayed down for up to seventeen months after one dose"
why = "[verification 2026-10-17] 'Has been given to people since late 2024' is not stated by the trial registry (https://clinicaltrials.gov/study/NCT06671093), which gives a study start of 2024-11-29, or by the company's releases of 2024-11-14 and 2026-05-30, none of which gives the date of the first person dosed. The text now says what they say: a trial the registry shows as started on 2024-11-29, and markers repressed for up to seventeen months after one dose (company release, 2026-05-30). The stage does not change."

why = "John ruled on 2026-10-17 on an outside review's proposal for this range, accepting it in part: the earliest year only. Northwestern Medicine's own release of 2025-07-07 says its Human Longevity Clinic measures molecular clocks of biological age in routine care and repeats selected tests at six months, so a named clinic's publication of a clock-monitored practice, which the test's clinic rung allows, could come within a few years rather than the six the old earliest assumed. The reviewer's proposed likely year (2035) and latest (2070) were declined: the test asks for a treatment given on the strength of a clock result, which no clinic has published, and the likely year is tied to the regulator's acceptance of a clock around 2040."
publication = "northwestern-2025"


# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The 2021 stage
# record is from memory; the trial's 2025-2026 status was checked against the sponsor's filings as
# summarised in trade coverage on 2026-10-16. The estimate is a first pass.

id = "a-gene-is-edited-inside-a-persons-body"
name = "A gene is edited inside a person's body to stop an age-related disease"
branch = "damaged-dna"
description = """
Most gene editing so far has been done on cells taken out of the body and put back. Editing a
gene inside a living person is the step that would let the damage of ageing be repaired where it
sits. In 2021 a London group gave six people a single infusion of a CRISPR gene editor (a tool that cuts DNA
at a chosen spot) packaged in fat droplets, which went to the liver and switched off the gene for transthyretin, a protein that
misfolds and clogs the heart and nerves in an inherited disease and, in its ordinary form, in many
old people. The protein fell by about nine tenths and stayed down. The treatment is in a large
late-stage trial for the heart form of the disease, which was paused in late 2025 after a
patient's liver was harmed, and restarted in March 2026 with closer liver monitoring; nothing is approved yet. That
patient, a man in his eighties, died on 2025-11-05. Early trade reports linked the death to the liver
event; the company's chief executive said in January 2026 that it followed an infection after a bowel
perforation and was not caused by liver failure. The cause is not yet confirmed in a written company statement."""
test = """
A person is given a treatment that edits a gene inside their body, and afterwards the gene's
product is measurably changed in the way intended, in a peer-reviewed report. For the clinic rung:
a regulator approves a gene-editing treatment given inside the body for an age-related disease,
or for a disease of DNA damage, so a doctor can give it outside a trial."""
settler = "The peer-reviewed trial report; the trial registry; the regulator's approval record for the clinic rung"
stage = "first-human"
stage_reached_on = "2021-06-26"
stage_record = "https://doi.org/10.1056/NEJMoa2107454"
status = "tracked"
horizon = "near"

verify = [
  "That a patient in the heart trial died on 2025-11-05 is from the trade press (CGTLive, 2025-11-09, citing the company); the cause given in January 2026 (an infection after a bowel perforation, not liver failure) is the chief executive's account at an investor conference as reported by Clinical Trials Arena on 2026-01-15. The company's own written statement of the cause and the registry's note of it were not found.",
]
notes = """
Transthyretin amyloidosis in its non-inherited form is a disease of old age, which is why a
treatment aimed at an inherited disease sits on this tree. The other way to the same end, a drug
that steadies the protein without touching the gene, is approved and has its own leaf on the
broken-proteins branch. This leaf does not ask for the editing to repair ageing damage in
general; it asks for the tool to be in the clinic, because every DNA-repair leaf above it needs
the tool first."""

[[earlier_stage]]
stage = "shown-in-animals"
reached_on = "2011-06-26"
record = "https://doi.org/10.1038/nature10177"

[estimate]
status = "first-pass"
set_on = 2026-10-16
why = """
The late-stage heart trial was designed to read out around 2027 to 2028 before the hold; the
likely year assumes the hold is resolved, the trial finishes a year or two late, and the first
approval of an in-body gene editor for an age-related disease comes in 2030. The earliest assumes
the nerve-disease trial, which is running, supports an approval first. The latest allows for the
liver-safety problem ending this programme and a competitor taking most of a decade more."""

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2028
likely = 2030
latest = 2042

[[estimate.rung]]
rung = "in-wide-use"
earliest = 2032
likely = 2038
latest = 2060


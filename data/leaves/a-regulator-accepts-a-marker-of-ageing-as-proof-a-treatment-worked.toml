# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The regulatory
# status was checked against trade coverage on 2026-10-16; the rest is in the verify list. The
# estimate is a first pass.

id = "a-regulator-accepts-a-marker-of-ageing-as-proof-a-treatment-worked"
name = "A regulator accepts a marker of ageing as proof that a treatment slowed it"
branch = "measuring-age"
description = """
Every treatment on this tree faces the same wall: to be approved for ageing, it must be shown to
slow ageing, and the only accepted way to show that is to wait for people to get sick or die. A
marker that a regulator accepted instead, a clock or a panel of blood proteins that a treatment
had to move, would cut a decade off every trial. Regulators do this in other fields (blood
pressure stands in for strokes, viral load for AIDS), through formal programmes that qualify a
marker on evidence. No marker of ageing has been qualified by any regulator, and as of 2026 none
had been submitted far enough through the United States programme to be listed. Several
foundations and companies say they are working toward it."""
test = """
A regulator's formal programme qualifies a marker of ageing (a clock, a protein panel, a
functional measure) as a stand-in for the outcome a trial would otherwise wait for (what the
regulators call a surrogate endpoint), so that a trial can be designed to move it and an
approval can rest on that, in the regulator's own published record; that is the clinic rung for
this leaf. The first-human rung is reached when a regulator agrees in writing, in a registered
trial's record, to a marker of ageing as the trial's main measure, before the trial runs.
There is no animal rung for a regulatory act, and the idea-only rung means neither has happened."""
settler = "The regulator's own qualification record or its written agreement to the trial's main measure; the trial registry entry that names the agreed endpoint"
stage = "idea-only"
status = "tracked"
horizon = "mid"

notes = """
This entry and the one on a regulator recognising ageing as a treatable condition are the two
regulatory acts the site's founding plan names; both are at idea only, and both are written with
the rungs spelt out in the test because the ladder was built for treatments. The headline year
cannot arrive until this branch is handled, for the reason this entry states.
Checked on 2026-10-17 against the United States regulator's own search of its drug development tools
(https://force-dsc.my.site.com/ddt/s/, reached from
https://www.fda.gov/drugs/biomarker-qualification-program/status-biomarker-qualification-submissions,
which says the database is updated twice a year). Searching its biomarker programme for the
determination "qualified" returns twelve biomarkers (for example a stand-in for the risk of hip and
other non-spine fractures, and a computer-read measure of fatty liver disease), and none is a marker
of ageing. Read with no filter, the database listed 238 projects, 107 of them in the biomarker
programme, and none names ageing, a biological-age clock or a protein panel for ageing. The only
entries that name ageing at all are three measures of muscle loss and physical function (a short
physical performance test put forward by the Alliance for Aging Research, a physical-functioning
question bank in sarcopenia, and a wearable belt in sarcopenia); the regulator accepted each for the
next step, none is qualified, and none is a marker of ageing as such. The European regulator's own
list was read on 2026-10-17 and has no ageing marker."""

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
A qualification takes years of evidence and a sponsor willing to submit it; the first human
rung, a regulator agreeing a marker as the main measure for one trial, is the nearer step and
likely around 2031 through a company trial in a single condition. Full qualification, the clinic
rung, likely follows around 2040, after the first such trial reads out and the marker proves it
tracked the outcome. The earliest assumes a submission already in progress succeeds within six
years; the latest allows for no marker ever being accepted because none tracks hard outcomes
closely enough."""

[[estimate.rung]]
rung = "first-human"
earliest = 2028
likely = 2031
latest = 2045

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2032
likely = 2040
latest = 2080


# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The approval date
# and application number were checked against the regulator's approval package listing on
# 2026-10-16; the trial record is from memory and in the verify list. The estimate is a first pass.

id = "an-anti-inflammatory-drug-is-approved-to-prevent-heart-attacks"
added_on = 2026-10-16
name = "A drug that acts only on inflammation is approved to prevent heart attacks"
branch = "inflammation-and-signalling"
description = """
Low-grade inflammation that never switches off is one of the twelve published kinds of ageing damage (the "hallmarks"), and
for decades the question was whether damping it, with no change to cholesterol or blood
pressure, would prevent the diseases of age. In 2017 a trial of 10,061 people who had already had
a heart attack showed that canakinumab, an antibody against one inflammatory signal, cut further
heart attacks and strokes by about a sixth and, unexpectedly, lung cancer deaths; the regulator
declined to approve it for the heart because the benefit was modest and infections rose. The
answer came from an old gout pill: low-dose colchicine cut heart attacks and strokes by about a
third in a 2020 trial of 5,522 people, and the United States regulator approved it for that
purpose on 16 June 2023, the first anti-inflammatory drug approved to prevent heart disease."""
test = """
A controlled trial in people reports that a drug acting on inflammation alone, with no effect on
cholesterol, blood pressure, blood sugar or weight, lowers heart attacks, strokes or deaths more
than placebo, in a peer-reviewed report. For the clinic rung: a regulator approves such a drug to
prevent an age-related disease. For wide use: prescribed for that purpose in several countries to
a substantial share of eligible people."""
settler = "The peer-reviewed trial report; the regulator's approval record; published uptake figures for the wide-use rung"
stage = "in-clinical-use"
stage_reached_on = "2023-06-16"
stage_record = "https://www.accessdata.fda.gov/drugsatfda_docs/nda/2024/215727Orig1s000Approv.pdf"
status = "tracked"
horizon = "mid"

notes = """
The branch's own line asks for an anti-inflammatory drug with a healthy-years result; this is a
heart-disease result, which is the biggest single cause of death in old age but not healthy years
as such. Uptake of colchicine for the heart has been slow, which is why the treatment stays at
clinical use. A 2025 trial (CLEAR SYNERGY) that found no benefit of colchicine after a heart attack is a
mark against, and the yearly review should weigh it.
Added 2026-10-17, from the weekly reading of that date: on 2026-07-31 the company Novo Nordisk
announced that its ZEUS trial of ziltivekimab, an antibody against the inflammatory messenger
interleukin-6, in over 6,300 people with hardened arteries, chronic kidney disease and raised
inflammation, lowered inflammation markers but not heart attacks, strokes or cardiovascular deaths
(hazard ratio 0.99; the company's announcement). It is the largest test since the 2017 canakinumab
trial of a drug acting on inflammation alone, it rests on a company announcement and not yet a peer-reviewed
report, and it is a second mark against, beside the 2025 colchicine trial, for the yearly review.
No stage or year was changed.
No earlier stage is recorded for the animal rung. The nearest candidate is a 2011 mouse study
(Bhaskar and colleagues, Atherosclerosis, https://doi.org/10.1016/j.atherosclerosis.2011.02.026),
which found less fatty plaque in the arteries of mice given an antibody against interleukin-1 beta,
an inflammatory signal. It does not meet what would count here: the same abstract reports lower ratios of
harmful to protective cholesterol in the blood, while what would count asks for a drug acting on
inflammation alone with no effect on cholesterol, and it measured plaque, not heart attacks,
strokes or deaths. It was therefore not entered as an earlier stage. A search of Europe PMC on
2026-10-17 for animal studies of colchicine in atherosclerosis found later studies (not examined here), and one rabbit
study of 2017 that found no effect on plaque, but no clean earlier record that meets the test.
Added 2026-10-18, from the weekly reading of 2026-10-18: Germany's Federal Joint Committee resolved on 2026-08-20 that colchicine added to the best standard care, in adults with coronary heart disease and a recent heart attack, has a hint of a minor added benefit, on the evidence of the COLCOT trial; its resolution gives the German marketing authorisation as of 2025-08-02. That is an authorisation and a benefit assessment in a second country, not a measure of how widely the drug is prescribed, which is what the wide-use rung asks for. The stage and the years are unchanged.
"""

[[earlier_stage]]
stage = "first-human"
reached_on = "2017-08-27"
record = "https://doi.org/10.1056/NEJMoa1707914"

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
The drug is generic and cheap, which helps uptake, and the guidelines in Europe and the United
States were adding it when this was written; the likely year for wide use is 2032, the earliest
assumes guideline adoption moves prescribing within a few years, and the latest allows for the
2025 negative trial keeping it a niche choice."""

[[estimate.rung]]
rung = "in-wide-use"
earliest = 2027
likely = 2032
latest = 2050


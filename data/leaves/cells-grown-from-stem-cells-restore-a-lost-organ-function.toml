id = "cells-grown-from-stem-cells-restore-a-lost-organ-function"
added_on = 2026-10-16
name = "Cells grown from stem cells restore a lost organ function in people"
branch = "replacing-parts"
description = """
The promise of stem cells was always this: grow the cells an organ has lost and put them back.
Insulin-making cells were grown from embryonic stem cells in bulk in 2014 and cured diabetic
mice; in June 2025 a Vertex Pharmaceuticals trial reported that twelve people with type 1
diabetes given an infusion of such cells into the liver all had their blood sugar back in the
target range a year later, and ten of them no longer needed insulin. They take anti-rejection
drugs. In 2025-08 the company said it expected to file for approval in 2026; it then paused the
last of the dosing for a manufacturing review, resumed it by 2026-05-04, and said on 2026-08-03 that
it would give updated timelines later in 2026. No filing has been announced. Parkinson's disease is close
behind: dopamine-making cells grown the same way were reported safe in 2025 and a late-stage
trial began in 2025. It is the first time grown cells have replaced a lost function, not just
survived."""
test = """
A person given cells grown from stem cells afterwards regains a lost organ function (makes their
own insulin, moves without dopamine drugs, sees) in a peer-reviewed report, with the function
measured. The animal rung is the same in a living animal. For the clinic rung: a regulator
approves such a cell therapy for use outside a trial."""
settler = "The peer-reviewed trial report; the trial registry; the regulator's approval record for the clinic rung"
stage = "first-human"
stage_reached_on = "2025-06"
stage_record = "https://doi.org/10.1056/NEJMoa2506549"
status = "tracked"
horizon = "near"

notes = """
The branch's own line asks for a stem cell therapy restoring a lost function in a controlled
trial; the 2025 diabetes result had no control group, and the Parkinson's trial is the first
with one. The anti-rejection drugs are the catch for ageing: a treatment that needs them trades
one failing system for another, and the encapsulated version that would avoid them was dropped in
2025.
Added 2026-10-17: filing status checked against the company's releases and its filings with the
United States securities regulator up to 2026-08-04 (its third-quarter results were not yet out);
none of them reports a filing for approval."""

[[earlier_stage]]
stage = "shown-in-animals"
reached_on = "2014-10-09"
record = "https://doi.org/10.1016/j.cell.2014.09.040"

[estimate]
status = "reviewed"
set_on = 2026-10-16
why = """
The diabetes therapy was due to be filed in 2026 on data from a late-stage trial that finished
dosing in 2025; the likely year for approval is 2028, the earliest 2027 if the filing is made this
year and reviewed fast, and the latest allows for a manufacturing or safety setback and the
Parkinson's therapy, due to read out in 2027, carrying the rung instead in the mid 2030s.
[Note 2026-10-17, from checking the company's own filings: the first sentence above is out of date.
The late-stage trial had not finished dosing in 2025: the company said in its quarterly filing of
2025-11-04 that it had postponed completing the dosing for a manufacturing review, and said on
2026-05-04 that it had resumed. Its release of 2026-08-03 and its quarterly filing of 2026-08-04 say
only that updated timelines will come later in 2026, and neither reports a filing for approval. The
years are unchanged; John may want to weigh whether the earliest and likely years (2027, 2028) still
hold when the new timelines come.]
[Note 2026-10-17, ruled by John on the outside review's point that this range assumed a filing for approval in 2026, conditional on no filing for approval having been announced by the day he ruled, which was checked that day against the company's releases and its filings with the securities regulator (none after the officer appointment of 2026-09-01; no filing for approval): the clinic years moved from 2027, 2028 and 2036 to 2030, 2032 and 2046. The company paused the last dosing in 2025 for a manufacturing review, resumed it by 2026-05-04 and said on 2026-08-03 it would give updated timelines later in 2026; the final patients' one-year follow-up runs into 2027, so a filing, a review and manufacturing scrutiny put an approval at 2029 or 2030 at the earliest; the latest allows for a demand for a larger trial, beyond what the Parkinson's therapy's read-out in 2027 would cover. The wide-use years are unchanged.]
"""


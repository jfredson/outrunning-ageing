# Leaf record (docs/record-schema.md). Written 2026-10-16 by the leaf session. The stage facts are
# from memory of the paper and are in the verify list. The estimate is a first pass.

id = "gene-therapy-lengthens-chromosome-ends-in-an-old-animal"
name = "A gene therapy lengthens the ends of chromosomes in an old animal, with no rise in cancer"
branch = "damaged-dna"
description = """
Each time a cell divides, the protective caps on the ends of its chromosomes (telomeres) get a
little shorter, and a cell whose caps run out stops dividing. An enzyme called telomerase rebuilds
the caps, and most adult cells keep it switched off, partly because cancers switch it on. In 2012
a Madrid group carried the telomerase gene into adult and old mice with a harmless virus, once,
and the mice lived longer (by about a quarter when treated at one year old, about an eighth at
two) without more cancer. The leaf asks for that result and for its safety, because a longer life
with more cancer would not count."""
test = """
A living animal given a treatment that lengthens its telomeres (the caps on chromosome ends)
afterwards lives longer, or stays healthier for longer, than untreated controls, with no rise in
cancer, in a peer-reviewed report. The first-human rung needs measurably longer telomeres in a
person after such a gene therapy, with the cancer rate reported, in a peer-reviewed report. For
the clinic rung: a regulator approves a telomere-lengthening gene therapy for any condition."""
settler = "Peer-reviewed reports; the trial registry and report when a first person is treated; the regulator's approval record for the clinic rung"
stage = "shown-in-animals"
stage_reached_on = "2012-05"
stage_record = "https://doi.org/10.1002/emmm.201200245"
stage_publication = "bernardes-de-jesus-2012"
status = "tracked"
horizon = "far"

notes = """
The same Madrid group later reported telomerase gene therapy repairing lung scarring and
anaemia in mice with short telomeres. A separate leaf on this branch holds the one human result
of lengthened telomeres, which came from an ordinary hormone drug and not a gene therapy. The
reason this leaf's horizon is far is the cancer question: a treatment that lengthens telomeres
in every cell lengthens them in any cancer cell too, and a regulator will want decades of data.
Added 2026-10-17, from the weekly reading of that date: the one human result of lengthened
telomeres from a gene therapy is a 2025 report of two people with a rare telomere disease, whose own
blood stem cells were treated outside the body with the gene ZSCAN4 (myers-2025); in one the average
length in a class of white blood cells rose from 3.6 to 6.7 thousand base pairs. It was not entered
as the first-human rung, for the four reasons given in the estimate's dated note. FOR JOHN: whether
that report counts is a reading of the test.
Added 2026-10-17, after checking the registry: the telomerase gene therapy trial in Colombia is a
small first trial (registry entry NCT04133649) of a single intravenous dose of a virus carrying the
human telomerase gene, sponsored by a company, Libella Gene Therapeutics, at one site in Zipaquirá,
Colombia. It started on 2019-10-17 with five people planned, was last updated on 2019-12-06 with its
status unknown, and has posted no result, so it does not move the first-human rung. A 2022
single-patient case report of this kind of therapy that was noted earlier was removed from the record
on 2026-10-17 for want of a source: a report of that kind was found only as a publisher's abstract
whose page does not open, and it does not name the person treated.
"""

[estimate]
status = "first-pass"
set_on = 2026-10-16
why = """
No registered trial of a telomerase gene therapy in people existed when this was written. The
first person would come through a rare telomere disease (dyskeratosis congenita, pulmonary
fibrosis from short telomeres), where the risk is worth taking; the likely year for that is the
early 2030s, and an approval for such a disease the early 2040s. The earliest assumes a sponsor
files within three years on the strength of the mouse data; the latest allows for the cancer
risk closing the route for good and the rung being reached, if at all, by a very different kind
of treatment late in the century.
[Note 2026-10-17, from the weekly reading of that date: the first sentence above is wrong as
written. A registered gene-therapy trial in people with a telomere disease did exist, for a
different gene, ZSCAN4 (registry entry NCT04211714), and it published two patients in 2025
(myers-2025); the registry also holds a 2019 trial of a telomerase gene therapy registered
in Colombia (registry entry NCT04133649; no result posted). The ZSCAN4 report does not meet this entry's first-human test on a plain reading: the
gene is ZSCAN4 and not telomerase, the cells were treated outside the body, there are two patients,
and no cancer rate is given. The years are unchanged. Whether the ZSCAN4 report should count for the
first-human rung is John's ruling; if it does, the first-human estimate falls away with the move.]
"""

[[estimate.rung]]
rung = "first-human"
earliest = 2029
likely = 2033
latest = 2055

[[estimate.rung]]
rung = "in-clinical-use"
earliest = 2036
likely = 2044
latest = 2110


version of this record called 2014 the year the site's archive begins; it is now the year the
Lifeboat page supports, and the record says only "about 2014".

His position and paper count were checked on 2026-10-17. The Tufts Human Nutrition Research Center
on Ageing pages could not be opened from here (they refuse automated requests), so the title rests

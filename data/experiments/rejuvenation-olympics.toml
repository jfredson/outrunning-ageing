# Written 2026-10-16 from the leaderboard's own site (home, about and rules pages, read that day).
# A leaderboard is a self-experiment record here because every entry on it is one person's
# commercial test result, ranked; nothing on it is a trial.

id = "rejuvenation-olympics"
added_on = 2026-10-16
who = "Bryan Johnson and Oliver Zolman"
who_is = "a public leaderboard founded by the entrepreneur Bryan Johnson and the physician Oliver Zolman, run with the testing company TruDiagnostic, that ranks members of the public by how slowly a blood-based clock says they are ageing"
name = "Rejuvenation Olympics"
started = "2023"
status = "running"
what = """
Anyone aged eighteen or over buys a TruDiagnostic blood test, registers, returns the sample and
consents to share the result; the site asks them to retest every three months. Two leaderboards
are kept: one by pace of ageing (DunedinPACE, a clock that reads the chemical marks on DNA and
reports how many years of ageing the body shows per calendar year) and one by an organ-by-organ
age from Yale's system-specific clocks. A participant is marked verified after three tests within
two years, and the ranking is the average of their three lowest pace scores in that time."""
measures = """
The two clock readings per test, as reported by one commercial laboratory; a rank; a verified
badge, which the site's rules define as three tests within two years. On 2026-10-16 the top five by
pace were Bryan Johnson at 0.50, then four other entrants between 0.51 and 0.57."""
claims = """
That the people at the top of the board are ageing at about half the normal rate, and that the
board shows what is possible for ordinary people as well as for its founder."""
public_record = """
Every figure on the board is a self-selected person's result from one commercial test, run by one
company that also sells the test, with no control group, no independent re-measurement and no
peer review of the board itself. The clock it ranks by is a research tool; a low reading is not an
accepted measure of slowed ageing, and the measuring branch of this site tracks exactly whether
it ever becomes one. The site's own rules describe the verification: three tests in two years.
No founding date is on the site; the 2023 start is from coverage (Vox, 2023-09-27, which calls it a leaderboard launched earlier that year). A claim about one person is a
story, not a record, and a ranked list of such claims is a list of stories; it moves no treatment."""
link = "https://rejuvenationolympics.com/"
branches = ["measuring-age"]

notes = """
Bryan Johnson's own programme, Dave Pascoe's, and that of Julie Gibson Clark, who held second
place in 2023 and 2024, each have their own entry among these self-experiments.

The start year is sourced to a Vox article of 2023-09-27, as republished on bioethics.com
(https://bioethics.com/archives/72522), which describes the leaderboard as launched by Bryan
Johnson earlier in 2023.

Checks of the leaderboard's rules, made again on 2026-10-17 at https://rejuvenationolympics.com/rules,
https://rejuvenationolympics.com/faqs (the frequently-asked-questions page; the address without the
final s gives "not found", which is what returned an error on 2026-10-16),
https://rejuvenationolympics.com/dunedin-pace and TruDiagnostic's page
(https://www.trudiagnostic.com/rejuvenation-olympics): none of them says whether the laboratory or
the organisers check that a returned sample belongs to the person named on the leaderboard. They
say participants register and consent to sharing at kit registration, and that "verified" means
three tests. The record therefore says nothing about any such check, and a reader should not assume
there is one or that there is not. The pages also differ among themselves: the rules and the home
page say three tests within two years, the leaderboard page says at least three tests that are less
than four years old, with the ranking average taken over the best three tests in two years; and the
frequently-asked-questions page says the board was founded by Bryan Johnson and TruDiagnostic, the
About page by Bryan Johnson and Oliver Zolman. An earlier version of this record said the "verified"
badge rests on the count of tests "and not on anything independent"; that was removed on 2026-10-17
because the pages do not say either way."""

# Worked example of a self-experiment record (docs/record-schema.md), first written 2026-10-16
# from memory and checked against sources the same day: his own protocol page and blog post, the
# Rejuvenation Olympics site, and news coverage quoting his posts where the posts themselves could
# not be reached. There is no field here that can move a leaf, and that is the point.

id = "bryan-johnson-blueprint"
who = "Bryan Johnson"
who_is = "the technology entrepreneur Bryan Johnson, who founded the payments company Braintree, sold it in 2013, and since late 2021 has run a published, team-measured programme to slow his own ageing, which he calls Blueprint"
name = "Blueprint"
started = "2021"
status = "running"
what = """
A fixed daily programme of diet (vegan, measured to the calorie, eaten within a set window),
exercise, sleep, dozens of supplements and several prescription drugs, all published and revised
in public on his protocol page. He has added one-off procedures: a gene therapy in 2023-10, an
injection of 300 million stem cells in 2024-03, hyperbaric oxygen sessions from 2024-11, and in
2023 a series of plasma exchanges, one of them with his teenage son as the donor, which he said
in a post of 2023-07-05 had shown no benefit he could detect. He took rapamycin, the drug this
site tracks under energy and fuel sensing, for about five years and stopped on 2024-09-28,
saying in a post of 2024-11 that the side effects outweighed the benefits. In 2025-07 he said he
was hiring people to run the Blueprint business so he could spend his time on his wider movement,
which he calls Don't Die. In a post on social media he said he had been diagnosed with an autoimmune disease; the NZ Herald, in a Daily Telegraph piece of 2026-07-06, names it as autoimmune gastritis (a disease in which the body's immune system attacks the lining of the stomach), quotes him as writing 'My stomach is eating itself', says he was diagnosed in May, and says he hopes to find a treatment by testing a million of his immune cells (https://www.nzherald.co.nz/world/millionaire-biohacker-hoping-to-cheat-death-has-incurable-disease/AOPYCH5T55FFXDTPHNK6P2MQP4/, read 2026-10-18)."""
measures = """
Hundreds of blood markers, biological-age clocks read from blood, a pace-of-ageing figure from
one of those clocks (DunedinPACE, which reads the chemical marks on DNA and reports how many years
of ageing a body shows per calendar year), organ-by-organ age estimates from imaging and function
tests (his page gives, for example, a skin age beside his calendar age), and sleep and fitness
measures, all published on his own site and in his own posts and videos."""
claims = """
That his measured pace of ageing is well below one year per year: his own figures over time are
0.76 (his post of 2023-02-01), 0.64 (a post in 2024-06, which he called a new record) and 0.50
(his entry at the top of the Rejuvenation Olympics leaderboard on 2026-10-16); that several of
his organs measure younger than his calendar age; and that the programme is the best-measured
attempt to slow ageing in one person. His stated aim, on the same 2023 post, was to have the
biology of an eighteen-year-old."""
public_record = """
What is published is one person's measurements, taken by his own team or by the commercial
testing company that runs the leaderboard he co-founded, with no control group, no independent
check and no peer review. The clocks he reports on are research tools whose meaning for one
person's remaining life is not established; a change in a clock reading is not yet an accepted
measure of slowed ageing, which is exactly what the measuring branch of this site tracks. The
record shows a well-documented, expensive, single-person programme with striking marker results,
one drug stopped for side effects, one procedure he himself judged to have done nothing, and no
way to say which part of the rest, if any, did what. On cost, two figures are public: a report in
Fortune of 2023-01-26, drawing on a Bloomberg profile of 2023-01-25, said he was on course to
spend over two million dollars in that year on medical interventions and tests; and in a post of
2023-02-04 he wrote that Blueprint does not cost two million dollars a year and can be done for
1,684.50 dollars a month including food. The record keeps both and does not choose between them.
A claim about one person is a story, not a record, and it moves no treatment."""
link = "https://protocol.bryanjohnson.com/"
branches = ["energy-and-fuel", "inflammation-and-signalling", "replacing-parts", "measuring-age"]

notes = """
He co-founded the Rejuvenation Olympics leaderboard, which ranks people by their measured pace
of ageing; that has its own entry among these self-experiments. His 2023-02-01 post
("Why I Am Spending Millions To Be 18 Again") was read in a repost on lifeboat.com; his site now
sells the Blueprint products, and the protocol page is the part that still describes the
programme.

His post of 2023-02-04 on cost is at https://x.com/bryan_johnson/status/1621921632184078337, and
the Fortune report of 2023-01-26 is at https://www.fortune.com/well/2023/01/26/bryan-johnson-extreme-anti-aging.
The Bloomberg profile itself could not be opened, so the two-million-dollar figure is recorded as
Fortune reported it, not as Bloomberg's own words."""

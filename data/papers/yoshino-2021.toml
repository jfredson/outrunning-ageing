authors = ["Mihoko Yoshino", "Jun Yoshino", "Brandon D. Kayser", "Gary J. Patti", "Michael P. Franczyk", "Kathryn F. Mills", "Miriam Sindelar", "Terri Pietka", "Bruce W. Patterson", "Shin-Ichiro Imai", "Samuel Klein"]
title = "Nicotinamide mononucleotide increases muscle insulin sensitivity in prediabetic women"
venue = "Science 372(6547), 1224–1229 (2021)"
link = "https://doi.org/10.1126/science.abe9985"
finding = """
Twenty-five overweight or obese post-menopausal women with prediabetes took either 250 mg a day
of nicotinamide mononucleotide (NMN, a building block of the cell's energy-carrying molecule NAD)
or a placebo for ten weeks in a double-blind trial. Muscle insulin sensitivity, measured directly
with an insulin clamp, rose by 25 percent in the NMN group and not at all on placebo; blood sugar,
blood pressure, blood fats, liver insulin sensitivity and liver fat did not change. The first
controlled trial to show an NAD precursor doing anything measurable in people, on one tissue and
one measurement."""
leaves = ["an-nad-raising-supplement-improves-a-function-in-a-controlled-trial"]

notes = """
Added during the weekly reading of 2026-10-17. An open-label company announcement of a visual-function change in two of three people is not the peer-reviewed report that the treatment "Partially resetting cells reverses ageing in a living animal" asks for at its first human stage, and it measures sight, not a marker of biological age; that treatment stays at shown in animals. The record of the first dose, of 2026-06-09, is the company's announcement of that date.

Checked 2026-10-17 against the company's release (opened on the company's own site), which gives the figures used here: three people with open-angle glaucoma, the first dose level, daily doxycycline by mouth for 56 days, no dose-limiting toxicity and no serious adverse events by day 56, the safety board's recommendation to move to the second dose level, and, in two of the three, at least 28 per cent of visual-field points improving by more than 4 decibels. The release itself does not name the meeting; the company's announcement of 2026-10-01 (https://www.lifebiosciences.com/life-biosciences-to-present-first-in-human-data-from-ongoing-phase-1-trial-evaluating-er-100-in-optic-neuropathies-at-eyecelerator-2026/) says the data would be given in an oral session at that event on 2026-10-08 in New Orleans. No conference abstract or published slides were found, so the figures rest on the company's own release and are the company's.
"""

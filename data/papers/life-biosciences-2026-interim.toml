finding = """
The company reports interim results from the first three people with open-angle glaucoma given its eye-injected reprogramming therapy ER-100 (first dose level, with a daily antibiotic to switch the genes on for 56 days) in an open-label safety trial: no dose-limiting toxicity and no serious adverse events by day 56, and a safety board's recommendation to move to the second dose level. In two of the three people, at least 28 per cent of tested points in the visual field improved by more than 4 decibels at day 56; the company calls this a preliminary signal in a trial designed to measure safety.

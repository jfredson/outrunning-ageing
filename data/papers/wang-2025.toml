title = "Organ-specific proteomic aging clocks predict disease and longevity across diverse populations"
venue = "Nature Aging (2026), pages 162-180; published online 2025-11-26"
link = "https://doi.org/10.1038/s43587-025-01016-8"
finding = """
Using blood-plasma proteins and machine learning, the authors built an organismal and ten organ-specific ageing clocks in 43,616 UK Biobank people and validated them in cohorts from China (3,977 people) and the United States (800 people; cross-cohort correlations 0.98 and 0.93). Accelerated organ ageing predicted disease onset, progression and death beyond clinical and genetic risk factors, with brain ageing the most strongly linked to death; a brain clock also stratified Alzheimer's disease risk across APOE gene types.
"""

notes = """
Added under the weekly reading of 2026-10-17. The entry's clinic-rung test accepts a named clinical setting that gives the treatment in routine care and publishes that practice; this release may be that for a named centre in Barcelona, but it is the supplier's account. The entry stays at first human; the case for the clinic rung is written into its notes for John.

Checked 2026-10-17. The release is the supplier's account, not the Barcelona centre's own publication of its practice. The society's guidelines (Connelly-Smith and others, Journal of Clinical Apheresis 2023, volume 38, pages 77 to 278, https://doi.org/10.1002/jca.22043; the journal's copy is behind a subscription wall, and the page was read in a copy of the full guidelines) list "Alzheimer's disease, mild or moderate, plasma exchange" as Category III with evidence grade 2A (table on page 105). The guidelines define Category III as "Optimum role of apheresis therapy is not established. Decision-making should be individualized." So the claim that the protocol is in the society's guidelines is confirmed, but the placement is the third of the society's four categories, for a treatment whose role is not settled, and not an endorsement as standard care.
"""

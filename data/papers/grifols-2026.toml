finding = """
The company says it has renewed its agreement with the Ace Alzheimer Center in Barcelona to keep running its plasma-exchange-with-albumin programme (AMBAR) there, which has operated since 2021; that AMBAR clinic centres are opening in hospitals in Madrid, Mallorca and Alicante; that more than 5,000 plasma exchanges with albumin have been done since the programme began; and that the protocol is included in the medical guidelines of the American Society for Apheresis. A registry with real-world data is planned. The release describes the 2020 trial as having slowed progression by 61 per cent in some patients, a figure that is the company's own wording.

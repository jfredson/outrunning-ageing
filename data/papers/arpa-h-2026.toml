finding = """
A working group convened by the United States health research agency gives the regulator its agreed recommendations on measuring a person's physical and mental capacity in five parts and using it as an outcome in trials of treatments for ageing. The document says it "does not claim" that the measure is a validated stand-in for death or disability, or that a single combined score is ready to be the main measure for approving a drug.

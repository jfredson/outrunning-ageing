finding = """
Using the UK Biobank, the authors found that organ ages trained on a person's calendar age came out just as well from random sets of blood proteins, which questions what such readings measure. Organ ages trained instead on the first onset of each organ's disease picked their own organ's proteins, predicted that organ's diseases, and held up in groups of people in the United States and Japan.

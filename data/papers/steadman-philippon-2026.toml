finding = """
The registry lists a finished randomised trial of fisetin, a plant compound some researchers use to clear aged cells, in 82 people. It compares two fisetin schedules, 100 mg a day for 60 days against a larger dose over two days, with no placebo group. Its main measure is the change in aged immune cells in blood; it ran from 2023-05-24 to 2024-01-30 and no results are posted.

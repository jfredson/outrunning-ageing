finding = """
A subgroup analysis of a randomised, double-blinded, placebo-controlled early-stage trial of an eye drop, called C-KAD, in people with early age-related cataract. In 41 eyes whose contrast vision was already reduced, it reports better contrast vision than placebo, with lens density analysed in a smaller group. The drop is a different one from the lanosterol drop, and the university's news page says three of the authors are employees of the company that makes it.

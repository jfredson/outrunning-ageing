title = "Clearance of p16Ink4a-positive senescent cells delays ageing-associated disorders"
venue = "Nature 479(7372), 232–236 (2011)"
link = "https://doi.org/10.1038/nature10600"
finding = """
In mice bred to age fast (the BubR1 progeroid strain), a genetic switch was added that kills cells
carrying the senescence marker p16 whenever a drug is given. Clearing those cells throughout life
delayed the age-related decline of fat tissue, muscle and the eye, and clearing them late in life
slowed decline already under way. A gain in healthy life in a fast-ageing mouse, not in lifespan or
in a normally ageing animal; the first direct evidence that worn-out cells drive ageing rather
than merely mark it."""

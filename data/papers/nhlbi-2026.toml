The registry entry shows the trial terminated, "stopped due to poor accrual", after 18 people, with results posted on 2026-10-27. The main measure was how many people's telomeres were shortening more slowly after six months: 5 of 8 on the lower dose and 5 of 10 on the higher, with no difference between the doses (P = 0.664) and no untreated group. That is slower shortening, not lengthening.

title = "Rejuvenation of aged progenitor cells by exposure to a young systemic environment"
venue = "Nature 433(7027), 760–764 (2005)"
link = "https://doi.org/10.1038/nature03260"
finding = """
Old and young mice were surgically joined so that they shared one bloodstream. The old mice's
muscle repair cells regained a young animal's ability to multiply and mend damage, their liver
cells divided more, and young serum alone did the same to old muscle cells in a dish. The paper
that showed something in young blood, or something missing from old blood, drives part of ageing
in tissue; the abstract gives no sample sizes or effect sizes."""

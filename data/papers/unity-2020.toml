title = "UNITY Biotechnology Announces 12-week data from UBX0101 Phase 2 Clinical Study in Patients with Painful Osteoarthritis of the Knee"
venue = "Company press release, South San Francisco, 2020-08-17, filed the same day as exhibit 99.1 to a Form 8-K with the US Securities and Exchange Commission"
link = "https://www.sec.gov/Archives/edgar/data/1463361/000119312520222493/d28349dex991.htm"
finding = """
In a phase 2 trial, 183 people with moderate to severe knee osteoarthritis pain had a single
injection into the knee of placebo or one of three doses of UBX0101, a drug meant to kill
worn-out cells in the joint. At twelve weeks there was no statistically significant difference in
pain between any dose and placebo (p-values 0.52, 0.81 and 0.99 against placebo); the drug was
well tolerated. The company said it would not take the drug into pivotal trials and would narrow
its work to eye and nerve diseases. The first controlled trial of a cell-clearing drug on a
clinical outcome, and it failed."""
branches = ["worn-out-cells"]

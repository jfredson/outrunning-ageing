authors = ["Selim Chaib", "Larissa G. P. Langhi Prata", "Masayoshi Suda", "and 45 others, ending with Ikeno, Tchkonia and James L. Kirkland (48 in all)"]
title = "Blocking PD-L2 prevents senescent cell accumulation and age-related dysfunction"
venue = "Cell Metabolism, online 2026-09-10 (September 2026 issue; the publisher's article number is S1550-4131(26)00339-6; volume and pages were not in the records read)"
link = "https://doi.org/10.1016/j.cmet.2026.08.014"
finding = """
The authors report that a protein called PD-L2, which immune cells read as a signal not to attack, is higher on aged (senescent) human cells grown in the laboratory and rises during ageing, and that drugs which kill aged cells remove the aged cells that carry the most of it. Old mice bred without PD-L2 held fewer aged cells than ordinary old mice, and had better insulin sensitivity and grip strength; a treatment against PD-L2 restored insulin sensitivity in ordinary old mice. They conclude that PD-L2 helps aged cells escape the immune system and persist.
"""

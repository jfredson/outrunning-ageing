notes = """
Added 2026-10-17. This is work in mice and in human cells in the laboratory, not a person given a drug, so it moves no stage and no estimate year. Only the abstract could be read: the journal's page asks for a subscription, and there is no open copy. A statement in trade coverage (GEN), quoting the paper's own highlights, that a form of PD-L2 circulating in the blood rose with age and fell after aged-cell-clearing drugs in people, and so might serve as a blood marker, is not in the abstract; the highlights themselves could not be opened, so that statement is not recorded here. The release of 2026-09-10 from Cedars-Sinai (the senior author's institution) says only that PD-L2 could serve as a blood marker.

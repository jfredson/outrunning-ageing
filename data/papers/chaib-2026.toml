# Publications log. Added 2026-10-17 while clearing the unchecked statements on the leaf for a drug that clears aged cells. The abstract was read on 2026-10-17 (PubMed and Europe PMC entry 42721966); the journal's own page is behind an access wall.

id = "chaib-2026"

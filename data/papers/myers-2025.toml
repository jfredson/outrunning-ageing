title = "Clinical Use of ZSCAN4 for Telomere Elongation in Hematopoietic Stem Cells"
venue = "NEJM Evidence 4(3) (2025), published 2025-02-25; trial registered as NCT04211714"
link = "https://doi.org/10.1056/EVIDoa2400252"
finding = """
Four people with a rare inherited disease of very short chromosome ends (a telomere biology disorder) were enrolled; two could have their blood stem cells collected, and these two were given their own stem cells back, treated outside the body with a virus carrying the gene ZSCAN4, which lengthens telomeres, and followed for 24 and 5 months (both still continuing). The telomeres of the treated stem cells were 1.06 to 1.34 times longer in the dish; in one person the telomere length in a subgroup of white blood cells (lymphocytes) changed from 3.6 to 6.7 thousand base pairs, and in both people a count of one kind of white blood cell (neutrophils) rose after treatment. The authors say definitive conclusions cannot be drawn from two treated patients. The abstract reports no rate of cancer.
"""

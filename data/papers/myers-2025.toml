title = "Clinical Use of ZSCAN4 for Telomere Elongation in Hematopoietic Stem Cells"
venue = "NEJM Evidence 4(3) (2025), published 2025-02-25; trial registered as NCT04211714"
link = "https://doi.org/10.1056/EVIDoa2400252"
finding = """
Two people with a rare inherited disease of very short chromosome ends (a telomere biology disorder) were given their own blood stem cells, treated outside the body with a virus carrying the gene ZSCAN4, which lengthens telomeres, and followed for 24 and 5 months. The telomeres of the treated stem cells were 1.06 to 1.34 times longer in the dish; in one person the average length in a class of white blood cells rose from 3.6 to 6.7 thousand base pairs, and both people's blood counts improved. The authors say no firm conclusions can be drawn from two patients. The abstract reports no rate of cancer.
"""

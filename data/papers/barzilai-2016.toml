title = "Metformin as a Tool to Target Aging"
venue = "Cell Metabolism 23(6), 1060–1065 (2016)"
link = "https://doi.org/10.1016/j.cmet.2016.05.011"
finding = """
The design paper for the Targeting Aging with Metformin (TAME) trial: the authors plan to enrol
3,000 people aged 65 to 79 at about 14 US centres and measure the time to a first new occurrence
of any of heart attack and stroke, cancer, dementia or death, a composite chosen so that a trial
can test whether a drug slows ageing as a whole rather than one disease, with function and frailty
measured alongside. The paper reviews the observational and animal evidence for metformin and says
the trial has planning money from the American Federation for Aging Research. The template for how
an ageing trial could be run and judged; as of 2026-10-16 the trial has not been shown to have
started (see afar-2026)."""

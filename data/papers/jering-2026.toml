title = "Effects of Eplontersen on Cardiac Structure and Function in Patients With Transthyretin Amyloidosis With Cardiomyopathy: Insights from the CARDIO-TTRansform Trial"
venue = "Circulation (online 2026-11-09)"
link = "https://doi.org/10.1161/circulationaha.126.083722"
finding = """
In 1,426 people with transthyretin amyloid in the heart followed by ultrasound in the trial of eplontersen, the drug modestly slowed the thickening of the heart wall and the decline in the heart's filling and pumping over 140 weeks. The benefit was almost all in people not already taking a protein-steadying drug, and none was seen in those who were. The paper repeats that the trial did not significantly reduce its main outcome, heart deaths and repeat heart events.
"""

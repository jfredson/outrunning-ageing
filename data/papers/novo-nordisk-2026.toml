title = "Novo Nordisk provides update on the ZEUS phase 3 trial in people with ASCVD, CKD and inflammation"
venue = "Company announcement, 2026-07-31 (reference PR260731-ZEUS)"
link = "https://www.novonordisk.com/news-and-media/news-and-ir-materials/news-details.html?id=916587"
finding = """
The company says its ZEUS trial of ziltivekimab, a monthly antibody against the inflammatory messenger interleukin-6, in over 6,300 people with hardened arteries, chronic kidney disease and raised inflammation, lowered the expected inflammation markers but did not lower heart attacks, strokes or cardiovascular deaths against placebo (hazard ratio 0.99, 95 per cent confidence interval 0.88 to 1.11). Overall rates of side effects were similar, serious infections were more frequent on the drug, and deaths from any cause did not differ. Full results are to be presented at a scientific meeting later in 2026; two further trials in heart failure and after a heart attack are expected to read out in the first half of 2027.
"""

Checked 2026-10-17 against the full text on the journal's page (https://www.ajmc.com/view/changes-in-semaglutide-fills-following-expanded-fda-and-medicare-policies). The figure of 3.6 million eligible beneficiaries is the authors' estimate, taken from a Kaiser Family Foundation brief of 2024-04-24 that they cite. The figures of 4,689 and 32,732 are monthly Part D fills, not a running total. The table of the extra fills by payer was not separately read; the text gives the overall figure.

venue = "The American Journal of Managed Care 32(7), 392-395 (2026), published 2026-07-09"
link = "https://doi.org/10.37765/ajmc.2026.89983"
finding = """
Using national prescription counts from September 2023 to September 2024, the authors found that monthly Wegovy fills rose 136.4 per cent (from 367,371 in February 2024 to 868,301 in September 2024), and that the March 2024 approval to reduce heart events, together with Medicare Part D coverage of it, was associated with an estimated 592,624 additional fills by September 2024 (95 per cent confidence interval 464,446 to 720,803) beyond what earlier trends predicted. Medicare Part D fills of Wegovy rose from 4,689 in February 2024 to 32,732 in September 2024, six months after coverage began; the authors say that is under 1 per cent of an estimated 3.6 million eligible beneficiaries.
"""

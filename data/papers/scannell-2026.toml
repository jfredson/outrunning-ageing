finding = """
Using national prescription counts from September 2023 to September 2024, the authors found that Wegovy fills rose 136 per cent (from 367,371 in February 2024 to 868,301 in September 2024), and that the March 2024 approval to reduce heart events and Medicare coverage of it were associated with about 592,624 extra fills. Six months after Medicare plans began covering Wegovy, only 32,732 prescriptions had been filled, under 1 per cent of the roughly 3.6 million Medicare beneficiaries estimated to be eligible.

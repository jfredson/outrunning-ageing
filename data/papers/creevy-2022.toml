The Dog Aging Project's description of itself as of its first data release: more than 30,000 pet
dogs and their owners enrolled, more than 100 staff at more than 20 institutions, genome
sequencing planned for at least 10,000 dogs, a closely studied group of 1,000, and a
placebo-controlled trial of rapamycin in 350 middle-aged large dogs (TRIAD, the Test of Rapamycin

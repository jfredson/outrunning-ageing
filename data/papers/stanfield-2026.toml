title = "Exercise and Weekly Sirolimus (Rapamycin) in Older Adults: RAPA-EX-01 Randomised, Double-Blind, Placebo-Controlled Trial"
venue = "Journal of Cachexia, Sarcopenia and Muscle 17(2), e70274 (2026)"
link = "https://doi.org/10.1002/jcsm.70274"
finding = """
Forty inactive people aged 65 to 85 took 6 mg of rapamycin or a dummy pill once a week for 13 weeks alongside a home exercise programme. Both groups improved, and rapamycin did not add to the gain in the main measure, the number of times a person can rise from a chair in 30 seconds (a difference of 2.13 fewer, 4.61 fewer to 0.34 more); the planned checks of the result leaned towards the dummy pill, and side effects were more common on the drug.
"""

title = "Life Biosciences Announces First Patient Dosed in Phase 1 Trial of ER-100 for Optic Neuropathies"
venue = "Company press release, Boston, 2026-06-09; trial registered as NCT07290244"
link = "https://www.lifebiosciences.com/life-biosciences-announces-first-patient-dosed-in-phase-1-trial-of-er-100-for-optic-neuropathies/"
finding = """
The company says a first participant has been given ER-100, a one-time injection into one eye of a
gene therapy that switches on three of the four Yamanaka reprogramming genes (OCT4, SOX2 and KLF4)
for 56 days under the control of an oral antibiotic, in a phase 1 safety trial for open-angle
glaucoma and a sudden loss of blood supply to the optic nerve. The registry entry plans about 18
adults in sequential dose groups and measures safety to days 56 and 112. This is a first person
dosed, not a result: the release reports no measurement of any kind."""

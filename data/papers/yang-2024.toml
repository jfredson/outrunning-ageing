title = "Metformin decelerates aging clock in male monkeys"
venue = "Cell 187(22), 6358–6378.e29 (2024)"
link = "https://doi.org/10.1016/j.cell.2024.08.021"
finding = """
Adult male cynomolgus monkeys, aged 13 to 16 years at the start (about 40 to 50 in human years), were
given metformin daily in their drinking water at 20 milligrams per kilogram of body weight for 40 months
and compared with untreated monkeys of the same age and with younger ones, on several biological age
clocks built from gene activity, DNA marks, blood proteins and metabolites across many tissues. The
clocks ran slower in the treated animals, with the brain reading about six years younger; the authors tie the brain effect partly to
the protective Nrf2 pathway. A controlled animal study on measurements, not on lifespan or
disease, in a small group: in the figures, mostly six treated monkeys and five untreated monkeys of the
same age (one of the untreated animals died of kidney failure during the study), three middle-aged
and six young adult comparison monkeys, with a few analyses using one fewer."""

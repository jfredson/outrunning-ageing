title = "Metformin decelerates aging clock in male monkeys"
venue = "Cell 187(22), 6358–6378.e29 (2024)"
link = "https://doi.org/10.1016/j.cell.2024.08.021"
finding = """
Adult male cynomolgus monkeys were given metformin daily for 40 months and compared with untreated
monkeys of the same and younger ages on several biological age clocks built from gene activity,
DNA marks, blood proteins and metabolites across many tissues. The clocks ran slower in the treated
animals, with the brain reading about six years younger; the authors tie the brain effect partly to
the protective Nrf2 pathway. A controlled animal study on measurements, not on lifespan or
disease, in a small group."""

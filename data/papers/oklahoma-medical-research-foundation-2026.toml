title = "Antecedent Metabolic Health and Metformin Aging Study"
venue = "ClinicalTrials.gov, NCT04264897 (results first posted 2026-07-02, entry updated 2026-11-05)"
link = "https://clinicaltrials.gov/study/NCT04264897"
finding = """
A completed placebo-controlled trial of metformin in 166 people free of chronic disease, with the National Institute on Aging among its collaborators. The results posted on the registry show no significant effect of metformin on either main measure, insulin sensitivity (P = 0.576 and 0.488 in the two groups of participants) or the working of the muscle's mitochondria (P = 0.88 and 0.932). It measured short-term biology, not time to disease, and no peer-reviewed report of it was found.
"""

title = "Agents targeting the hallmarks of ageing: the geroscience pipeline in 2026"
venue = "The Lancet Healthy Longevity (2026-11-23), 100943"
link = "https://doi.org/10.1016/j.lanhl.2026.100943"
finding = """
A search of the United States trial registry for trials running on 2026-01-01 found 193 trials of 131 candidate treatments aimed at the kinds of damage that make up ageing. Only 41 (21 per cent) enrolled healthy people or people at risk of decline, and 152 (79 per cent) people with an established disease; 61 trials were first-stage, 91 mid-stage and 41 late-stage. The authors conclude that most of the effort still aims at treating diseases rather than delaying ageing itself.
"""

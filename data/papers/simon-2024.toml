title = "A randomized, controlled clinical trial demonstrates improved owner-assessed cognitive function in senior dogs receiving a senolytic and NAD+ precursor combination"
venue = "Scientific Reports 14, article 12399 (2024); received 2024-02-17, accepted 2024-05-23"
link = "https://doi.org/10.1038/s41598-024-63031-w"
finding = """
In a randomised, placebo-controlled trial of 70 dogs aged ten or more with mild to moderate cognitive impairment (23 on placebo, 23 on a low dose and 21 on a full dose of a combined NAD-raising and aged-cell-clearing supplement for three months), the owner-rated cognition score changed differently between groups (p = 0.02, the largest improvement in the full-dose group). Activity monitors, the in-clinic cognitive tests, frailty (p = 0.32) and owner-rated happiness (p = 0.34) did not differ between groups; all groups improved, which the authors say suggests a placebo effect and the benefits of taking part; and the cognition gain was not kept at six months. By the abstract's count 59 dogs completed the three-month check (the results text says 62).
"""

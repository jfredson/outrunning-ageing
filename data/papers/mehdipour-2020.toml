title = "Rejuvenation of three germ layers tissues by exchanging old blood plasma with saline-albumin"
venue = "Aging (Albany NY) 12(10), 8790–8819 (2020)"
link = "https://doi.org/10.18632/aging.103418"
finding = """
Half of the blood plasma of old mice was replaced with salt water containing 5 percent albumin,
with no young blood involved. A single exchange matched or exceeded what young blood had done in
earlier work: better muscle repair, less fat and scarring in the liver, and more new neurons in
the memory centre of the brain. In a small human arm, serum taken after one ordinary therapeutic
plasma exchange no longer suppressed the growth of progenitor cells the way old serum does. The
authors' reading is that diluting what accumulates in old blood matters more than adding anything
young; the abstract gives no percentages."""
branches = ["inflammation-and-signalling"]

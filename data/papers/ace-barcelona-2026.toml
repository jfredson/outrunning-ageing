notes = """
John ruled on 2026-10-17 that this page settles whether the plasma-exchange treatment is in clinical use: a named clinical setting publishing, on its own page, that it gives the treatment for that purpose in routine care. The weekly reading of 2026-10-17 had left the question open because the only source then in the record was the supplier's release (Grifols, 2026-03-12). The centre's page answers that objection; it is still an announcement of a conference presentation and not a peer-reviewed publication of the practice, and the apheresis society's own guidelines (see the notes on the Grifols release) place plasma exchange for Alzheimer's disease in the category whose role is not established. John weighed both and ruled that the announcement counts; the treatment's entry carries the ruling. The treatment is dated to this page, 2026-04-27, and not to 2021, when the supplier's release says the programme began, because this page is the earliest publication by the clinical setting itself.
"""

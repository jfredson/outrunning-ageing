title = "Ace Alzheimer Center presents pioneering evidence on plasma exchange to slow Alzheimer's"
venue = "The centre's own news page, Barcelona, 2026-04-27"
link = "https://www.acebarcelona.org/en/plasma-exchange-alzheimers-asfa-2026"
finding = """
The centre says its medical team presented, at the 2026 meeting of the American Society for Apheresis, results of therapeutic plasma exchange with albumin in people with Alzheimer's disease given, in its words, "under routine clinical practice conditions in Barcelona" rather than in a clinical trial: 71 patients completed the 15-month programme as outpatients; the observed cognitive decline was lower than what is typically reported for the disease's natural course; 44 per cent of patients were classified as responders with stable cognitive trajectories; and more than 96 per cent of procedures were free of adverse events, all of them mild and transient. The page names no peer-reviewed paper or conference abstract and gives no date for when the service began.
"""
leaves = ["replacing-a-persons-plasma-slows-an-age-related-disease"]

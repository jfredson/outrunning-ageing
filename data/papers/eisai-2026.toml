title = "FDA Approves LEQEMBI IQLIK (lecanemab-irmb) Subcutaneous Injection as an Initiation Dose for Early Alzheimer's Disease"
venue = "Company press release, Tokyo and Cambridge, Massachusetts, 2026-07-13, as carried by BioSpace"
link = "https://www.biospace.com/press-releases/fda-approves-leqembi-iqlik-lecanemab-irmb-subcutaneous-injection-as-an-initiation-dose-for-early-alzheimers-disease"
finding = """
The two companies say the United States regulator has approved an under-the-skin weekly autoinjector form of lecanemab as the starting dose as well as the maintenance dose (500 mg a week as two injections to start; 360 mg a week after 18 months), so that a whole course can be taken at home; a United States launch as a starting dose was planned for late August 2026. The approval rests on exposure matching the drip form in a long-term extension of the main trial, with similar rates of brain swelling and bleeding and some injection-site reactions. The release gives no figure for how many people have been treated.
"""

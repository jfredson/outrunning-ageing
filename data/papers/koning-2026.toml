title = "Senolytics dasatinib and quercetin in metabolic dysfunction-associated steatohepatitis: a proof-of-principle randomized, controlled trial"
venue = "Nature Metabolism (2026), online 2026-10-01, pages 1 to 12; trial registered as NCT05506488"
link = "https://doi.org/10.1038/s42255-026-01643-4"
finding = """
Thirty-one adults with scarred fatty liver disease (median age 56) were randomly given either the two-drug course dasatinib plus quercetin, taken three days a week for three weeks and repeated across three seven-week cycles, or a matching placebo. The pre-stated main measure, at least one stage less scarring on paired liver biopsies without the disease worsening, was met by 47 per cent of treated people against 7 per cent on placebo (P = 0.02); the disease resolved in 53 per cent against 7 per cent. Sequencing of single cells from the biopsies showed fewer signs of aged cells and of scar-forming cells in the treated group. Side effects were more frequent on the drugs (82 per cent against 43 per cent of people), mostly mild or moderate; the authors call them all self-limiting, though their own table lists a few that left minor after-effects or were still going on. Four people did not finish, three of them on the drugs (one left because of side effects), and the main analysis counted all four as not improved. Counted the least favourable way for the drugs, the result was no longer significant (P = 0.068), and the authors call it hypothesis-generating, not confirmatory, pending a larger trial. The aged cells were not counted directly: the planned count was replaced by the sequencing, which found too little of the usual single markers of aged cells to rely on them and so used sets of genes typical of aged cells, in biopsies pooled two or three to a sample. More of the treated group had type 2 diabetes at the start (76.5 per cent against 35.7 per cent). Blood and scan measures of liver scarring did not differ between the groups at 21 weeks.
"""

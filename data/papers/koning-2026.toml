title = "Senolytics dasatinib and quercetin in metabolic dysfunction-associated steatohepatitis: a proof-of-principle randomized, controlled trial"
venue = "Nature Metabolism (2026), online 2026-10-01, pages 1 to 12; trial registered as NCT05506488"
link = "https://doi.org/10.1038/s42255-026-01643-4"
finding = """
Thirty-one adults with scarred fatty liver disease (median age 56) were randomly given either the two-drug course dasatinib plus quercetin, taken three days a week for three weeks and repeated across three seven-week cycles, or a matching placebo. The pre-stated main measure, at least one stage less scarring on paired liver biopsies without the disease worsening, was met by 47 per cent of treated people against 7 per cent on placebo (P = 0.02); the disease resolved in 53 per cent against 7 per cent. Sequencing of single cells from the biopsies showed fewer signs of aged cells and of scar-forming cells in the treated group. Side effects were more frequent on the drugs (82 per cent against 43 per cent) and all passed on their own.
"""

Added from the weekly reading of 2026-10-17, as one of the items it flagged, entered by hand. The page read is the journal's own. The trial is a second controlled result for this class of drug on a clinical-type measure, in the liver; the treatment "A drug that clears aged cells beats a sham treatment in a controlled trial" was already at first human on the 2022 eye trial, so it moves no stage. Two authors (Tchkonia, Kirkland) declare patents on drugs that clear aged cells (senolytic drugs) held by the Mayo Clinic, as the paper's competing-interests statement says. The years in the treatment's estimate were not changed.

Checked 2026-10-17. The journal's page and Crossref's record both list 35 authors, with the first twelve and the last four as given here; the journal's page gives the pages as 1 to 12.
Read in full on 2026-10-20, in the authors' accepted manuscript (which does not yet carry page numbers or a publication date), with its methods, extended-data tables and figures; the supplementary file, with the trial protocol and the analysis plan, was not part of the copy read. Every figure in the abstract matches the full text (the main result's P value is 0.021 there), and the manuscript lists the same 35 authors. The full text adds what the abstract left out: the dropouts and how they were counted, the result's sensitivity to that choice, the difference in diabetes between the groups at the start, and that the aged cells were read from gene patterns rather than counted; the finding above was corrected on 2026-10-20 to say so, where it had said only that every side effect passed on its own. None of this moves a stage or a year: the treatment it bears on was already at first human on the 2022 eye trial.

title = "Stem-Cell-Derived Biologic Ventricular Assist Tissue in Heart Failure"
venue = "New England Journal of Medicine 394(20), 1991-2001 (2026), published online 2026-05-27, issue dated 2026-05-28; trial registered as NCT04396899"
link = "https://doi.org/10.1056/NEJMoa2513525"
finding = """
In an open-label phase 1-2 study with no comparison group, 20 people with heart failure (ejection fraction 35 per cent or less) were given patches of engineered heart muscle made from donor stem cells, with drugs to prevent rejection. Three died during the study (one each of vasoplegia, covid-19 and aortic dissection) and one had a heart transplant. Of the 16 given the highest dose, 12 had reached the 3-month interim follow-up: the treated wall was 4.5 mm thicker, the heart's ejection fraction was 3.9 percentage points higher (P = 0.04) and a quality-of-life score 6.7 points higher (P = 0.06). Every patient had at least one adverse event.
"""

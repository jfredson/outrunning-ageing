notes = """
Added during the weekly reading of 2026-10-17. The treatment "Heart muscle grown from stem cells is grafted onto a person's failing heart" was already at first human on the 2025 single-case report in Nature (that report is still the record of its stage); this paper is a larger human result of the same kind and is the sort of evidence the next stage needs only in the sense that a regulator would look at it. Because it is an interim, uncontrolled analysis and the next stage is an approval, no stage moves. The paper is not named as the record of the treatment's stage, so it is not marked as having settled a stage.

Checked 2026-10-17: the journal's full text is behind a payment page and has no open copy, so this record states only what the published abstract says (read through the PubMed and Europe PMC records), and every figure above is in that abstract. The registry entry (NCT04396899) was read: a single-group, open-label phase 1-2 study with no masking, an estimated 53 people, still recruiting when last updated on 2026-02-20, primary completion estimated for 2027-12, and a target population described as heart failure with an ejection fraction of 35 per cent or less. The range of follow-up that press releases mention (6 to 52 months) is in neither the abstract nor the registry entry, so it is not recorded here. The abstract also says the drugs that prevent rejection were stopped in four people (two who received a mechanical pump, one with kidney failure and one with a cancer of the urinary tract).
"""

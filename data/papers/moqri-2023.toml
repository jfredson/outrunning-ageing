title = "Biomarkers of aging for the identification and evaluation of longevity interventions"
venue = "Cell 186(18), 3758–3775 (2023)"
link = "https://doi.org/10.1016/j.cell.2023.08.003"
finding = """
A position paper from a consortium of ageing researchers setting out what a measure of biological
age would have to do before a trial could use it in place of waiting for disease and death: be
practical to take, track age, predict function and death better than a birth date does, rest on a
mechanism, and move when an intervention works, then pass laboratory and clinical validation. It
states that no such measure has yet been validated as a stand-in outcome for a trial. The
field's own account of how far the measuring branch has to go."""
leaves = ["a-regulator-accepts-a-marker-of-ageing-as-proof-a-treatment-worked"]
branches = ["measuring-age"]
moved_range = false
settled_stage = false
notes = """
Intended leaf: a regulator accepts a marker of ageing as a trial endpoint, under measuring ageing;
this paper is the criteria such a marker must meet, not an acceptance. Cell prints the consortium
fourth in the author list, as given here; some indexes move it first or drop it."""

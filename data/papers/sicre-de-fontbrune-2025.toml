title = "Efficacy and safety of danazol for pulmonary fibrosis or bone-marrow failure associated with telomere-related gene mutation"
venue = "ERJ Open Research 12(2), 00905-2025 (2026; online 2025-11-09)"
link = "https://doi.org/10.1183/23120541.00905-2025"
finding = """
A French trial with no comparison group gave danazol for a year to 24 people with lung scarring and 5 with failing bone marrow, all carrying a faulty gene of the kind that shortens the protective ends of chromosomes. Only 10 of the 24 with lung scarring finished the year: 9 stopped for side effects and 3 died. The authors found the drug poorly tolerated in lung scarring and could not judge whether it worked; the report gives no measure of chromosome ends after treatment.
"""

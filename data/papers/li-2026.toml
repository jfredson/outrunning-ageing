authors = ["Li S", "Hamaya R", "Zhu H", "Chen BH", "Pereira AC", "Ivey KL", "Rist PM", "Manson JE", "Dong Y", "Sesso HD"]
title = "Effects of daily multivitamin-multimineral and cocoa extract supplementation on epigenetic aging clocks in the COSMOS randomized clinical trial"
venue = "Nature Medicine (2026), pages 1012-1022; published online 2026-03-09"
link = "https://doi.org/10.1038/s41591-026-04239-3"
finding = """
A prespecified ancillary study of the COSMOS randomised, placebo-controlled trial, in 958 people (482 women, 476 men) given a daily multivitamin-multimineral tablet (Centrum Silver) or cocoa extract for two years, measured five DNA-methylation clocks (PCHannum, PCHorvath, PCPhenoAge, PCGrimAge and DunedinPACE). The multivitamin slowed the yearly rise of PCGrimAge by 0.113 years (95 per cent confidence interval 0.020 to 0.205; P = 0.017) and of PCPhenoAge by 0.214 years (0.019 to 0.410; P = 0.032), and slowed PCGrimAge more in people with faster-than-expected ageing at the start. The cocoa extract had no effect on the five clocks. The authors call the effects small and say more studies are needed to know whether they matter clinically.
"""

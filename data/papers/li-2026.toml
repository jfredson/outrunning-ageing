notes = """
Added in the change to the records on 2026-10-18, on my ruling of that day on the audit's point about the COSMOS multivitamin paper (the audit, on 2026-10-18, of the first scheduled weekly reading). Checked 2026-10-18: the journal's own page needs a sign-in for a page reader, so this record states what the abstract says, read in the Europe PMC record of the paper (PubMed number 41803341); the first sentence of the abstract calls it a prespecified ancillary study. Harvard's news report of 2026-03-09 says all five clocks slowed with two significant; the abstract names the two and says nothing of the other three. The paper is not marked as having settled a stage: whether it should replace the 2023 CALERIE paper as the record of the stage of the treatment "A treatment slows a biological age clock in a controlled trial" is mine to rule (see the treatment's notes).
Checked 2026-10-19, on my agreement of that day to make this paper the stage record if its methods showed the clock analysis was planned before the data were unblinded and the clocks were named in advance. The full text still needs a sign-in, and the paper is not in PubMed Central, so the methods themselves were not read. Four open sources were read instead. (1) The journal's reporting summary, which the authors last updated on 2026-01-05 (https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41591-026-04239-3/MediaObjects/41591_2026_4239_MOESM2_ESM.pdf): it gives two trial registrations, the main COSMOS trial (https://clinicaltrials.gov/study/NCT02422745) and this clock study (https://clinicaltrials.gov/study/NCT05510375); it says the treatments ran until 2020-12-31, that participants, investigators and the people analysing the data were kept unaware of who took what, that the study was first planned for 600 people on one grant, and that the paper uses re-computed, steadier versions of the Horvath, Hannum, PhenoAge and GrimAge clocks (the method of Higgins-Chen and colleagues) and DunedinPACE. It does not say when the analysis plan was fixed. (2) The clock study's registration was first submitted on 2021-09-15, after the treatments had ended, and first posted on 2022-08-22; it names its main measure only as "epigenetic age acceleration", with no clock named. (3) The grant that paid for it (National Institutes of Health, R01HL157665, awarded 2021-07-15, https://reporter.nih.gov/project-details/10185971) names the clocks as the original Horvath, Hannum, GrimAge and PhenoAge clocks and a blood measure of the length of the chromosome tips (telomeres), for 600 people, and states its main hypothesis about the cocoa extract; the multivitamin is to be looked at in parallel. (4) The main trial's protocol, in its version of 2024-04-01 (https://cdn.clinicaltrials.gov/large-docs/45/NCT02422745/Prot_000.pdf), lists the same clocks in the same words. So: a clock study of this trial was planned and paid for before its results, and GrimAge and PhenoAge, the two clocks the multivitamin slowed, were named in advance. But no open source shows the plan was fixed before the data were unblinded (the earliest dated plan, the grant of 2021-07-15, comes after the treatments ended), the paper reports re-computed versions of those clocks rather than the ones named, adds DunedinPACE and drops the telomere measure, and the hypothesis named in advance was about the cocoa extract, which moved no clock. The condition was not met from open sources, so this paper is still not marked as settling the stage, and the question goes back to me.
Read in full on 2026-10-19, in the published paper (Nature Medicine, volume 32, pages 1012 to 1022, March 2026, with its online Methods and nine extended-data items; the separate supplementary file, with Supplementary Tables 1 and 2 and Supplementary Figure 1, is referred to but was not part of the copy read). On the four points my condition turns on: (1) Planned before unblinding. The Methods say the clock study "was prespecified before the data unlock and completion of the parent COSMOS trial", and the results section says the authors prespecified clock measures read from blood DNA as the main outcomes. No date is given for that plan, and the paper names no analysis plan beyond its trial registration, which was first submitted on 2021-09-15. So the paper states the plan came first but does not show when. (2) The clocks named in advance. The paper says what was prespecified only as "epigenetic aging measures"; it does not say the five clocks were named in advance. It says the authors "focused on" five clocks and used the re-computed, steadier versions of the first four (the method of Higgins-Chen and colleagues, published in Nature Aging in 2022) because they are more reliable, without saying that choice was made before the results were seen. The grant of 2021 named the original versions and a telomere measure, not the re-computed versions or DunedinPACE, so the two results the paper rests on, on PCGrimAge and PCPhenoAge, are on versions of the clocks that no dated plan names. (3) The main comparison. The paper states one main hypothesis for both supplements together, that they could slow biological ageing; it does not make either the main comparison, and the grant's main hypothesis was about the cocoa extract. The cocoa extract slowed no clock, though PCPhenoAge rose slightly faster with it; the earlier lines here that said it had no effect on any clock are corrected in the finding above. (4) Testing five clocks. The paper made no correction for testing five clocks on two supplements, because the clocks are closely related (the two-year changes on PCGrimAge and PCPhenoAge move together, with a correlation of 0.80), and its list of limits says "false positives are likely to occur". With the simplest correction for five clocks (a threshold of 0.01 in place of 0.05), neither of the multivitamin's two results would count as significant; that is this record's arithmetic, not the authors'. So the condition is met only in part: the paper says the clock study was planned before the data were unlocked, but gives no date, and does not show that the clock versions its result rests on were named in advance. The paper is still not marked as settling the stage, and the question goes back to me.
I ruled on 2026-10-19, told all of the above, and answered "yes" to making this paper the record of the stage of the treatment "A treatment slows a biological age clock in a controlled trial", so it is now marked as settling that stage (first human, dated 2026-03-09), and the treatment's description says what the paper does not show.
"""

title = "Tissue-engineered autologous bladders for patients needing cystoplasty"
venue = "The Lancet 367(9518), 1241–1246 (2006)"
link = "https://doi.org/10.1016/S0140-6736(06)68438-9"
finding = """
Seven children and young adults aged 4 to 19 with spina bifida and failing bladders had cells taken
from their own bladders, grown on a scaffold shaped like a bladder for about seven weeks, and
implanted to enlarge the organ. Over a mean follow-up of 46 months the best results came from the
composite scaffold wrapped in abdominal tissue: pressure at capacity fell by 56 percent, capacity
rose 1.58-fold and the bladder stretched 2.79 times better, with kidneys preserved and no stones.
The first organ-like tissue grown from a person's own cells to work in people for years."""
leaves = ["lab-grown-organ-works-in-a-person-for-a-year"]

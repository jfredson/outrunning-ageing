title = "Reversal of Heart Age in Adults with Obesity After Initiation of Semaglutide Detected by Serial Electrocardiography"
venue = "Preprints.org (preprint, 2026-11-11)"
link = "https://doi.org/10.20944/preprints202611.1116.v1"
finding = """
A computer model trained on about a million routine heart tracings estimates a person's age from a tracing. In hospital records, that reading fell relative to calendar age after people with obesity started the weight-loss drug semaglutide, by 0.73 years at 12 months and 1.23 years at 15 months, and did not change after weight-loss surgery, although surgery patients lost far more weight (25.6 per cent against 4.8 per cent). It compares matched patients who chose their treatment, so it cannot show the drug caused the fall, and the reading is not one made from the marks on DNA.
"""

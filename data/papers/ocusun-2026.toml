finding = """
The registry lists a phase 2 pilot in the United States of an investigational eye drop, 0.4 per cent ZOC2017217, against a drops-with-no-active-ingredient control, twice a day for 24 weeks in about 40 people aged 50 or over with age-related cataract, quadruple-masked and randomised. Its start date is 2026-02-10, the entry shows 8 people enrolled, and its primary completion is estimated for 2027-02; outcomes include best-corrected vision, contrast sensitivity and lens opacity at weeks 4, 12 and 24.

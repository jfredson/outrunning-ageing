title = "FDA Requires Safety Labeling Changes for Glucagon-Like Peptide-1 Receptor Agonists (GLP-1 RAs) Due to Potential Increased Risk of Rare But Serious Eye Condition"
venue = "FDA Drug Safety Communication (2026-11-09)"
link = "https://www.fda.gov/drugs/drug-safety-communications/fda-requires-safety-labeling-changes-glucagon-peptide-1-receptor-agonists-glp-1-ras-due-potential"
finding = """
The United States regulator requires the labels of the drugs of the weight-loss and diabetes family to warn of a possible raised risk of a rare, sudden loss of sight in one eye. Its pooling of 126 randomised trials in 134,253 people found 15 probable cases, 10 on these drugs and 5 on placebo: 6.4 against 3.8 cases for every 100,000 people treated for a year.
"""

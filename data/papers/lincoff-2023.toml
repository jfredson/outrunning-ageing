title = "Semaglutide and Cardiovascular Outcomes in Obesity without Diabetes"
venue = "New England Journal of Medicine 389(24), 2221–2232 (2023)"
link = "https://doi.org/10.1056/NEJMoa2307563"
finding = """
The SELECT trial randomised 17,604 adults aged 45 and over with existing heart or blood-vessel
disease and a body mass index of 27 or more, but no diabetes, to a weekly injection of semaglutide
2.4 mg or placebo, and followed them for a mean of 39.8 months. Heart attack, stroke or death from
cardiovascular causes came to 6.5 percent on the drug against 8.0 percent on placebo, a hazard
ratio of 0.80 (95 percent confidence interval 0.72 to 0.90). The first large controlled trial to
show that a GLP-1 drug prevents hard outcomes in people without diabetes; it was not designed to
measure ageing, and 16.6 percent stopped the drug for side effects against 8.2 percent on
placebo."""

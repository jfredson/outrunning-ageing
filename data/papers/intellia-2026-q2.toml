finding = """
The company says that a genomic analysis of more than 600 patient samples from its trials of the in-body gene editor nexiguran ziclumeran (nex-z), done with its partner Regeneron and outside experts, found the highest liver-enzyme (transaminase) rises in patients carrying one specific immune-gene variant (an HLA allele, which the release does not name). It says it is engaging the United States regulator and other health authorities about the finding, will give genotyping results to the doctors and patients in the two ongoing late-stage trials, and restarted enrolment in them in the second quarter. It also says it expects the regulator to accept its licence application for a different editor, lonvo-z, for hereditary angioedema in the second half of 2026.

A Chinese group built smaller tools for switching a gene up or down by changing the marks on it, small enough to be carried by a single virus shell. Given once to mice, one of them switched down a gene that drives blood-vessel growth in the eye and markedly reduced the abnormal vessels of a model of the wet form of age-related macular degeneration, with no sign of DNA damage. It is mouse work.

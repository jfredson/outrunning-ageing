finding = """
The university says its researchers will begin a double-blind, randomised phase 3 trial of low-dose rapamycin in people of 65 and over, paid for by a gift of 12 million dollars, to measure whether it maintains or improves physical and immune function. Participants take the drug or a placebo for two years with a further year of follow-up; the trial awaited final approval from the United States regulator and is expected to take six years.

finding = """
In 221,599 people of the UK Biobank, how unevenly a person's six organ systems had aged went with a higher risk of death beyond their overall biological age (11 per cent higher for each step, 1.09 to 1.13 times), and the link with death held in five other cohorts. The main organ ages here are not all read from blood proteins; the abstract says similar findings were seen with 11 organ ages that are.

notes = """
Added in the change to the records on 2026-10-18, on my ruling of that day on the audit's point about two more organ-clock papers (the audit, on 2026-10-18, of the first scheduled weekly reading). Checked 2026-10-18: the open full text at PubMed Central (PMC13375651) was read through its XML text. The organ-specific clocks tested here use the weights of Oh and colleagues (the Stanford group's), so this is an independent test of those clocks, in a different cohort; the paper also uses five earlier whole-body clocks for comparison. Its mortality comparison sets a model of calendar age and sex (concordance index 0.71) against the combined Global age gap (0.73), not each organ clock against calendar age.

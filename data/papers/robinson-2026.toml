title = "Associations of proteomic age clocks with lifestyle risk factors, incident chronic diseases and mortality in two European cohorts"
venue = "Nature Aging (2026), pages 1437-1451; published online 2026-06-29"
link = "https://doi.org/10.1038/s43587-026-01163-6"
finding = """
In 17,473 participants of the European Prospective Investigation into Cancer and Nutrition followed for up to 28 years (with the mortality results replicated in 6,240 people in the Whitehall II study), blood-protein ageing clocks, including organ-specific clocks, were linked to smoking, alcohol, inactivity and a higher risk of death, cardiovascular disease, dementia and cancers of the liver, upper airways and digestive tract, lung and kidney. Lung, kidney and stomach cancers were more strongly linked to the related organ's age gap (the kidney age gap and kidney cancer, hazard ratio 1.63, 95 per cent confidence interval 1.36 to 1.94). The authors say that before this only the organ clocks of Oh and colleagues had been independently tested for disease onset across disease classes in a longitudinal setting.
"""

title = "Intellia Therapeutics Announces FDA Lift of Clinical Hold on MAGNITUDE Phase 3 Clinical Trial in ATTR-CM"
venue = "Company press release, Cambridge, Massachusetts, 2026-03-02, filed with the United States securities regulator as exhibit 99.2 to a Form 8-K"
link = "https://www.sec.gov/Archives/edgar/data/1652130/000119312526084309/d101756dex992.htm"
finding = """
The company says the United States regulator has lifted its stop on the late-stage MAGNITUDE trial of its in-body gene editor nexiguran ziclumeran in people with heart disease caused by the protein transthyretin (about 1,200 people, a single infusion against placebo). The stops on this trial and its sister trial in nerve disease were imposed on 2025-10-29 after one person given the drug had a very large rise in liver enzymes and bilirubin; the sister trial's stop was lifted on 2026-01-27. The changes agreed with the regulator are closer liver-test monitoring, guidance on short steroid treatment, exclusion of people with certain liver abnormalities, and, for this trial, exclusion of people with a recent unstable heart or an ejection fraction under 25 per cent.
"""

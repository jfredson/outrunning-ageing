finding = """
The summary of a public meeting on treatments for ageing, held by the foundation that Congress created to support the United States regulator, with funding from the government agency ARPA-H and the XPRIZE Foundation. It says no approved route now exists for a drug whose stated use is ageing, that there is no validated marker of ageing and no accepted regulatory measure, and that no marker of ageing has reached the standing of a validated or reasonably likely stand-in for a trial's outcome. Speakers pointed to the routes that exist, among them meetings on a company's own trial plan, the marker qualification programme and approvals disease by disease.

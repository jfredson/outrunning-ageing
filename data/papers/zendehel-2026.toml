title = "Beyond organ age gaps: comparing plasma proteomic metrics of organ biology in relation to brain structure and neurodegenerative disease"
venue = "bioRxiv (preprint, 2026-11-10)"
link = "https://doi.org/10.64898/2026.11.09.765339"
finding = """
Three ways of scoring 15 organs from the proteins in blood were compared in 52,667 people of the UK Biobank. The three were related but not interchangeable. The gap between an organ's age and the person's age was the score most consistently linked to later brain and blood-vessel diagnoses, but adding the scores to a model of basic personal details improved prediction only modestly, the most for Alzheimer's disease.
"""

notes = """
Logged because the outside review of 2026-10-17 pointed to it (in its part on cells and the cell's settings), under John's ruling of the same day on the review's case for the treatment "A person's biological age, read from the marks on their DNA, falls after a treatment". It is the largest published test of whether clocks respond to treatments, which is why it is logged against both that treatment and the treatment "A treatment slows a biological age clock in a controlled trial" on the measuring ageing branch. It moves no stage and no year: it reanalyses other studies' samples, so it is not itself a controlled trial with a pre-planned clock analysis, and it is not a clinic's publication of its practice. The reviewer's reading of it, that it supports an earlier likely year for the biological-age-reading treatment to reach clinical use, was declined, for the reason given with John's ruling: the test asks for a treatment given on the strength of a clock, which this paper is not.
"""

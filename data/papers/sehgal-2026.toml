title = "Responsiveness of epigenetic aging biomarkers to longevity interventions in humans"
venue = "Nature Medicine 32, 3477–3490 (2026), online 2026-08-21, in the issue of 2026-09"
link = "https://doi.org/10.1038/s41591-026-04562-9"
finding = """
The authors assembled 51 public and private studies in which people were measured before and after a treatment, and read 16 widely used clocks (estimates of biological age from the chemical marks on DNA) and 94 other DNA-mark measures on every sample. Across the 16 clocks, 19 of the 50 treatments significantly lowered the clocks' readings (13 after correction for multiple testing), 5 raised them and 26 had no significant effect; clocks built to predict death or the pace of ageing responded most, drugs and lifestyle changes drove the strongest responses, and drugs that block the inflammatory messenger TNF moved nearly all of the newer clocks by similar amounts in patients with arthritis or inflammatory bowel disease. It is a reanalysis of existing trial samples, not a trial of its own.
"""

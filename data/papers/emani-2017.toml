authors = ["Sitaram M. Emani", "Breanna L. Piekarski", "David Harrild", "Pedro J. del Nido", "James D. McCully"]
title = "Autologous mitochondrial transplantation for dysfunction after ischemia-reperfusion injury"
venue = "The Journal of Thoracic and Cardiovascular Surgery 154(1), 286–289 (2017)"
link = "https://doi.org/10.1016/j.jtcvs.2017.02.018"
finding = """
Five babies and young children at Boston Children's Hospital whose hearts had failed after surgery
and who were on a heart-lung machine had mitochondria, the cell's power plants, taken from a small
piece of their own abdominal muscle and injected straight into the heart muscle, about a hundred
million in ten small injections. Four of the five regained enough heart function to come off the
machine within three to six days; two of the five later died of other organ failure. The first
report of mitochondria moved from one tissue to another in people, in a handful of emergencies with
no comparison group."""

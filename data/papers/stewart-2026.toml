title = "Rapamycin and human longevity among kidney transplant recipients surviving the first year"
venue = "GeroScience (online 2026-11-05), DOI 10.1007/s11357-026-02643-8"
link = "https://doi.org/10.1007/s11357-026-02643-8"
finding = """
Using the United States transplant registry, the authors compared 4,885 kidney transplant recipients prescribed rapamycin with 6,589 who were not, followed for a median of 11 years, during which 6,443 died. After adjusting for age, body weight, diabetes and 15 other factors, the age to which half of each group survived was 64.6 years with rapamycin and 64.3 without, a difference the authors call statistically similar (the 95 per cent range for the difference runs from 1.6 years shorter to 2.0 years longer). It is a study of records, not a randomised trial, in transplant patients who take the drug at transplant doses alongside other drugs.
"""

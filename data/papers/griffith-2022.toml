title = "Genetically Modified Porcine-to-Human Cardiac Xenotransplantation"
venue = "New England Journal of Medicine 387(1), 35–44 (2022)"
link = "https://doi.org/10.1056/NEJMoa2201422"
finding = """
On 2022-01-07 a 57-year-old man with heart failure who could not get a human heart received the
heart of a pig carrying ten gene edits (four pig genes removed, six human genes added) at the
University of Maryland. The heart worked for seven weeks, then thickened and failed suddenly from
day 49; life support was withdrawn on day 60, and the damage did not look like ordinary rejection.
The first pig organ to keep a living person alive, for two months."""

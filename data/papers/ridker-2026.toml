finding = """
The full report of the ZEUS trial. In 6,376 people with hardened arteries, chronic kidney disease and raised inflammation, mean age 69, given a monthly injection of ziltivekimab, an antibody against the inflammatory messenger interleukin-6, or a placebo, and followed for a median of 33 months, heart attack, stroke or death from heart disease happened to 17.6 per cent on the drug and 17.7 per cent on placebo (561 people against 565), no meaningful difference. The drug lowered the inflammation markers it was meant to lower, there was no effect on deaths from any cause, and infections rose slightly. The authors suggest the people enrolled, about ten years older and sicker than in the 2017 canakinumab trial, may have had disease too far along to change; the lead author added, in his hospital's release, that low-dose colchicine, already shown to work and approved, is under-used.
"""

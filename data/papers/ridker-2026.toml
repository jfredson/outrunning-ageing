notes = """
The peer-reviewed report of the result the company announced on 2026-07-31 (Novo Nordisk, its announcement of that date, also in this log). The weekly reading of 2026-11-09 found it and left it for me, because it bears on the estimate of when a drug acting only on inflammation is in wide use to prevent heart attacks. I ruled on 2026-11-09 that the estimate moves later, and it did the same day.

The journal's page did not open on 2026-11-09: it showed a check for automated visitors, which was not got round. So the figures were read from two pages opened in full that day. The release by Mass General Brigham, the hospital group of the lead author (Heart researchers unpack neutral findings from ZEUS, an anti-inflammatory clinical trial, 2026-11-07, https://www.eurekalert.org/news-releases/1150801), gives 561 against 565 events, the reassuring safety with a small rise in infections and no effect on deaths from any cause, the older and sicker population, and Ridker's remark that low-dose colchicine is under-used. The American College of Cardiology's report of the presentation (2026-11-07, https://www.acc.org/latest-in-cardiology/articles/2026/11/06/14/37/sat-935am-zeus-aha-2026) gives the 6,376 people, the dose, the mean age of 69, the median follow-up of 33 months, and 17.6 per cent against 17.7 per cent. The paper's title, its date of 2026-11-07 and its 33 named authors were read from the record the journal filed with the DOI registry. The hazard ratio of 0.99 is the company's own figure, from its announcement of 2026-07-31.
"""

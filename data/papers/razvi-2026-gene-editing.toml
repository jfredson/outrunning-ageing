finding = """
In the 72 people of the first trial of a one-time gene edit made inside the body for transthyretin amyloidosis, the level of the protein in blood was about 89 per cent lower a month after the single dose and stayed there at two years. In the 36 with advanced heart disease, heart measures held steady or improved, and 86 per cent were in the same or a better class of heart failure at 18 months. There was no comparison group, and it is a meeting abstract, not a full paper.

title = "Abstract 5183: Cardiac Outcomes Following a Single Dose of Nexiguran Ziclumeran in Patients with Transthyretin Amyloidosis with Cardiomyopathy or Hereditary Transthyretin Amyloidosis with Polyneuropathy: A Phase 1 Analysis"
venue = "Circulation 154 (supplement 1), abstract 5183 (meeting abstract, 2026)"

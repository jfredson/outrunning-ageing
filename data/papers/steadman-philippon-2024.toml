title = "Senolytic Drugs Attenuate Osteoarthritis-Related Articular Cartilage Degeneration: A Clinical Trial (registry entry with results posted)"
venue = "ClinicalTrials.gov, registry number NCT04210986; results first posted 2024-09-19; status verified 2024-09, completed 2023-02-01"
link = "https://clinicaltrials.gov/study/NCT04210986"
finding = """
A phase 1 and 2, randomised, quadruple-masked, placebo-controlled trial of fisetin (100 mg capsules, about 20 mg per kilogram a day, on two consecutive days, 28 days off, then two more days) in knee osteoarthritis. 74 people started (34 on fisetin, 40 on placebo; the entry's enrolment count is 75). The main measure was safety: 28 people on fisetin and 33 on placebo had at least one adverse event (p above 0.9). None of the secondary measures differed between the groups at the 0.05 level: knee pain and function questionnaires (p 0.44 to above 0.99), walking and strength tests, cartilage on MRI (p above 0.99) and blood markers (the lowest p was 0.0829, for one marker at six months).
"""

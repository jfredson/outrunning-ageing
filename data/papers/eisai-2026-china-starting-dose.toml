finding = """
The makers say China's medicines regulator approved the under-the-skin autoinjector form of the amyloid antibody lecanemab as a starting treatment for early Alzheimer's disease on 2026-09-03. It is given at home once a week, as two injections, in place of an infusion every two weeks in a hospital. The makers plan to launch it in China by 2027-03-31, so it was not yet on sale when the release was written.
"""

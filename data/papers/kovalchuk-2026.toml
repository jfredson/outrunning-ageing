finding = """
A fresh analysis of 78 blood and liver samples from an experiment already published, in which old mice were joined to a young mouse's circulation for a long period. The age-related marks on DNA were pushed back in both tissues, at many of the same sites, and much of the change was still there two months after the animals were separated. It is a re-analysis, not a new experiment.

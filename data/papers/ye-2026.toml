finding = """
Tools that edit the chemical marks on DNA, delivered briefly as RNA, switched off a platelet gene in human blood stem cells. The switching-off survived the cells' division and maturing, could be partly undone by a second edit, and was still in place 4 months after the cells were transplanted into mice. The work is in cells and mice, not in a person.

title = "Whole-blood NAD levels track cardiovascular disease but not chronological age"
venue = "Nature Metabolism (online 2026-11-04), DOI 10.1038/s42255-026-01660-3"
link = "https://doi.org/10.1038/s42255-026-01660-3"
finding = """
From 1,340 measurements in 1,068 adults, the authors found that the amount of NAD in whole blood does not fall with age in healthy people: it stays level in men and rises in women. It was lower in people with cardiovascular disease and high blood pressure. The authors say the study was not designed to show cause and gives no direct evidence that raising NAD would treat those diseases.
"""

finding = """
A registry entry for a phase 2, placebo-controlled trial of two approved drugs, dapagliflozin and semaglutide taken as a tablet, in 1,200 adults, with the United States Department of Health and Human Services named as collaborator. The conditions named are "Aging" and "Functional Decline", and the main measure is a score of physical performance (balance, walking speed and rising from a chair). It is not yet recruiting: the start is estimated for January 2027 and the main result for December 2030. No result exists.

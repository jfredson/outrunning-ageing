finding = """
Japan's regulator records a conditional and time-limited approval, on 2026-03-06 and for seven years, of sheets of heart muscle cells grown from donor stem cells, for severe heart failure after heart attacks in people whom standard treatment has not helped enough. The approval rests on an open study of 8 patients at five hospitals with no comparison group, and it requires the maker to follow every treated patient. The regulator's list of approved products (https://www.pmda.go.jp/files/000283257.pdf) marks it as a conditional, time-limited approval.
"""

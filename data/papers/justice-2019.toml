title = "Senolytics in idiopathic pulmonary fibrosis: Results from a first-in-human, open-label, pilot study"
venue = "EBioMedicine 40, 554–563 (2019)"
link = "https://doi.org/10.1016/j.ebiom.2018.12.052"
finding = """
Fourteen people with stable scarring of the lungs (idiopathic pulmonary fibrosis) at two centres
took dasatinib 100 mg and quercetin 1,250 mg a day for three days a week over three weeks, with no
placebo group. All fourteen stayed in; their six-minute walking distance, walking speed and
chair-stand time improved, while lung function, blood chemistry and frailty did not change, and
the effect on blood markers of worn-out cells was inconclusive. The first trial of a drug meant to
kill such cells in people, on physical function rather than on the cells themselves."""
leaves = ["drug-clears-aged-cells-from-a-person"]

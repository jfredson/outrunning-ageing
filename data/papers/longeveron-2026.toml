finding = """
The company, which makes a donor-cell therapy it is testing against frailty and Alzheimer's disease and is one of the ten finalists of the XPRIZE Healthspan competition, says its trial in 40 infants with a rare heart defect did not meet its main measure. It has 7.2 million dollars in cash, enough to last into the first quarter of 2027, has cut spending and has hired an adviser to look at a partnership, a sale or a merger. It says its chance at the competition's grand prize depends on completing the required trial and finding the money for it.

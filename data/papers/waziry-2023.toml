title = "Effect of long-term caloric restriction on DNA methylation measures of biological aging in healthy adults from the CALERIE trial"
venue = "Nature Aging 3(3), 248–257 (2023)"
link = "https://doi.org/10.1038/s43587-022-00357-y"
finding = """
The CALERIE trial had randomised 220 healthy adults without obesity to cut their calories by a
quarter or eat as usual for two years; those assigned to restriction managed 11.9 percent on
average. In the 197 with blood samples, a clock that reads the pace of ageing from DNA
methylation (DunedinPACE) ran 2 to 3 percent slower in the restricted group at one and two years,
while two clocks that read accumulated age (PhenoAge and GrimAge) did not move. The first
randomised trial in people to show an intervention slowing a biological age clock, by an amount the
authors call small."""
leaves = ["a-treatment-slows-a-biological-age-clock-in-a-controlled-trial"]

title = "Autologous Induced Stem-Cell–Derived Retinal Cells for Macular Degeneration"
venue = "New England Journal of Medicine 376(11), 1038–1046 (2017)"
link = "https://doi.org/10.1056/NEJMoa1608368"
finding = """
A 77-year-old Japanese woman with a wet form of age-related macular degeneration had skin cells
turned back into stem cells, grown into a sheet of the retina's supporting layer 1.3 by 3 millimetres
across, and transplanted under her retina on 2014-09-12. A year later the sheet was intact, her
sight was unchanged rather than worse, and there was no rejection and no serious complication
without any immune-suppressing drugs. The first person to receive tissue made from their own
reprogrammed cells; a second patient was not treated because of DNA changes found in his cells."""

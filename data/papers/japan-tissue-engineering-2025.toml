The company says Japan approved on 2025-05-13 the use of its cultured cartilage, grown from the patient's own knee cartilage cells and sold since 2013 for injuries, for osteoarthritis of the knee, in people with a cartilage defect larger than 2 square centimetres whom medicines and exercise have not helped. It ran its trial for this from April 2019 and applied in June 2024; the product had been used in more than 1,900 cases for its earlier uses. The release gives no trial figures.

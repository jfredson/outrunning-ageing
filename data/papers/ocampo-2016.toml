title = "In Vivo Amelioration of Age-Associated Hallmarks by Partial Reprogramming"
venue = "Cell 167(7), 1719–1733.e12 (2016)"
link = "https://doi.org/10.1016/j.cell.2016.11.052"
finding = """
Mice were given the four Yamanaka genes that turn an adult cell back into an embryonic-like stem
cell, but switched on for only two days in every seven so that cells reset part of the way without
losing their identity. In mice bred to age fast (the LAKI progeria model) the cycling treatment
reduced the signs of ageing in several tissues and lengthened life; in normally aged mice it
improved the repair of muscle and pancreas after injury. The first demonstration that partial
reprogramming can be done in a living animal without killing it with tumours."""

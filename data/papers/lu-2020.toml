title = "Reprogramming to recover youthful epigenetic information and restore vision"
venue = "Nature 588(7836), 124–129 (2020)"
link = "https://doi.org/10.1038/s41586-020-2975-4"
finding = """
Three of the four Yamanaka reprogramming genes (Oct4, Sox2 and Klf4, leaving out the cancer-linked
c-Myc) were delivered by a gene-therapy virus into the eyes of mice and switched on with an
antibiotic. The treatment made crushed optic nerves regrow, restored sight lost to a glaucoma model
and to ordinary ageing in twelve-month-old mice, and turned back a DNA-methylation measure of the
cells' age; the effect needed two enzymes that strip methylation marks, and switching the genes on
for up to fifteen months caused no tumours. The animal result behind the first reprogramming
therapy to be dosed in a person (Life Biosciences' announcement of
2026-06-09)."""

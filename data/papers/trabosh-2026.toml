The authors report an engineered enzyme that undoes one kind of sugar damage to proteins, called CML, restoring the protein's original building block. It worked on model proteins in a dish and in tissue samples from elderly donors. The damage it reverses is a single-protein modification, not a cross-link between proteins, and the work was not done in a living animal or a person.

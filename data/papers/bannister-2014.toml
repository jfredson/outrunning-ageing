title = "Can people with type 2 diabetes live longer than those without? A comparison of mortality in people initiated with metformin or sulphonylurea monotherapy and matched, non-diabetic controls"
venue = "Diabetes, Obesity and Metabolism 16(11), 1165–1173 (2014)"
link = "https://doi.org/10.1111/dom.12354"
finding = """
In UK general-practice records from 2000 onward, 78,241 people with type 2 diabetes who started on
metformin were matched to 90,463 people without diabetes. After adjustment, the people without
diabetes had a median survival 15 percent shorter than the metformin group (survival time ratio
0.85, 95 percent confidence interval 0.81 to 0.90), while 12,222 people started on a sulphonylurea
had a survival 38 percent shorter. An observational comparison, open to the objection that people
who start metformin are healthier than those who start the other drug; it is the result most often
cited as the reason to test metformin against ageing."""
leaves = ["metformin-delays-age-related-disease-in-people-without-diabetes"]

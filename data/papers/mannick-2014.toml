title = "mTOR inhibition improves immune function in the elderly"
venue = "Science Translational Medicine 6(268), 268ra179 (2014)"
link = "https://doi.org/10.1126/scitranslmed.3009892"
finding = """
Volunteers aged 65 and over took RAD001 (everolimus, a relative of rapamycin that damps the cell's
main fuel-sensing pathway) or a placebo for six weeks, then had a flu vaccine. At doses that were
reasonably well tolerated, the antibody response to the vaccine was about 20 percent stronger, and
fewer of their T cells carried the exhaustion marker PD-1. The first controlled trial in people to
show that a drug acting on the ageing pathways found in animals improves an age-related function,
here the immune system's."""

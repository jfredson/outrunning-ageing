venue = "Rejuvenation Research 22(5), 375–376 (2019)"
link = "https://doi.org/10.1089/rej.2019.2274"
finding = """
An editorial welcoming the news that the TAME metformin trial's 75 million dollar budget had been
found: nearly half pledged through the American Federation for Aging Research by the
philanthropist Paul Glenn, the National Institute on Aging having twice turned down applications
for the rest, and the remainder, "very recently", from an anonymous donor. De Grey, no admirer of
metformin as a treatment, argues the trial is worth the money because it would establish ageing as
something a regulator lets a drug be tested against. Seven years on, the trial has not started
(afar-2026)."""

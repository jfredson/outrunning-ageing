title = "Naturally occurring p16Ink4a-positive cells shorten healthy lifespan"
venue = "Nature 530(7589), 184–189 (2016)"
link = "https://doi.org/10.1038/nature16932"
finding = """
The same genetic switch as in the 2011 paper, this time in normally ageing mice of two genetic
backgrounds, with the cell-killing drug given twice a week from twelve months of age until death.
Median lifespan rose by 27 percent in the mixed-background mice and 24 percent in the inbred
strain, with increases of 17 to 35 percent by sex; kidney, heart and fat deteriorated more slowly,
cataracts came later, and tumours came later though not less often. The result that turned
clearing worn-out cells from a curiosity into a drug programme."""

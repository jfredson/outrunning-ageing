finding = """
Using population counts and life tables for Japan, Sweden, France, Italy and South Korea, a single author finds that the number of people aged 100 and over is growing because more people reach 100, while the model's measure of the far end of the lifespan shows no comparable long-term rise and sits at about 117 to 122 years. The author says this does not imply a fixed biological maximum.

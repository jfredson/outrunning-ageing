title = "Infusion of young donor plasma components in older patients modifies the immune and inflammatory response to surgical tissue injury: a randomized clinical trial"
venue = "Journal of Translational Medicine 23, article 183 (2025), published 2025-02-14; trial registered as NCT03981419"
link = "https://doi.org/10.1186/s12967-025-06215-w"
finding = """
In a double-blind, placebo-controlled phase 2a trial, 38 older people having a hip or knee replacement were randomly given four infusions of a plasma protein fraction from young donors (GRF6021) or salt water, around the day of surgery; 36 finished. Blood tests showed that the immune and inflammatory response to the surgery differed between the groups. The authors call it a first proof of principle in humans that a young plasma fraction regulates immune and inflammatory responses in older people; it was not designed to show a clinical benefit.
"""

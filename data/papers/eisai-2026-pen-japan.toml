finding = """
The makers say the under-the-skin pen form of the amyloid antibody lecanemab went on sale in Japan on 2026-11-13, the day it was listed in the national health insurance price list, after its approval there on 2026-09-16. Japan is the second country after the United States where a course can be given at home, once a week by the patient or a carer, in place of an infusion every two weeks at a hospital. Brain scans before and during treatment are still required.

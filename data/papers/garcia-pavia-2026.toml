finding = """
Of 654 people in the original heart trial, 466 entered the open-label extension. Through month 48, those on vutrisiran throughout had a 37 per cent lower risk of death or a first heart event than those who started it after placebo (hazard ratio 0.63, 95 per cent confidence interval 0.51 to 0.79), and the same for death alone (0.63, 0.46 to 0.84). Health-status scores and heart-failure class were better, and no new safety signals appeared.
"""

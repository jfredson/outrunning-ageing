title = "Hallmarks of aging: An expanding universe"
venue = "Cell 186(2), 243–278 (2023)"
link = "https://doi.org/10.1016/j.cell.2022.11.001"
finding = """
The same five authors' update ten years on, raising the count from nine hallmarks to twelve by
adding the failure of the cell's recycling of its own worn parts (disabled macroautophagy),
low-grade inflammation that never switches off, and an unbalanced community of gut microbes
(dysbiosis). It restates the three tests a hallmark must pass: it shows up with age, making it worse
speeds ageing, and treating it slows, stops or reverses ageing."""

title = "Integration of proteomic aging clocks in a phase 2a clinical trial supports simultaneous geroprotective assessment"
venue = "Nature Biotechnology (2026), online 2026-09-07, pages 1 to 13"
link = "https://doi.org/10.1038/s41587-026-03286-y"
finding = """
The authors applied six published blood-protein ageing clocks to stored blood samples from 42 people with a lung-scarring disease (idiopathic pulmonary fibrosis) in an earlier 12-week, placebo-controlled phase 2a trial of the drug rentosertib, and found that all six predicted a lower biological age in the treated groups than in the placebo group. Of 54 comparisons (six clocks, three time points and three dose regimens, each against placebo), 21 were statistically significant at the authors' adjusted threshold (Q value below 0.10), mostly at week 4. They call the findings exploratory and say the clocks alone cannot tell slower ageing from an improved diseased lung; the strongest effect was in the 30 mg twice-daily group.
"""

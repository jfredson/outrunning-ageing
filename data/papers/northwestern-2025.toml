The hospital system says its Human Longevity Clinic opened to the public on 2025-07-07, offering tests that were previously reserved for research studies to measure the difference between a person's age in years and their biological age. The tests listed include heart, lung, muscle, balance and memory assessments, retinal imaging and "lab work including molecular clocks that can be used to measure your biological age directly"; patients then meet a longevity physician for lifestyle recommendations, and selected tests are repeated six months later. The page does not name a clock, does not say "epigenetic", and names no published report of the clinic's practice.

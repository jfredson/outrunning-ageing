Logged because the outside review of 2026-10-17 pointed to it, in its part on cells and the cell's settings. It is the source behind my ruling of 2026-10-17 on the review's case for the treatment "A person's biological age, read from the marks on their DNA, falls after a treatment": a named academic clinic has measured molecular clocks in routine care since 2025 and repeats them at six months, so a publication of that practice could come any year, and the treatment's earliest year for reaching clinical use moved from 2032 to 2028. It does not itself put the treatment in clinical use: the test asks for a treatment given in routine care with the clock monitored and that practice published, and this page describes testing and lifestyle advice, with no published report of practice.

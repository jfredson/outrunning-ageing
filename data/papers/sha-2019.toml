title = "Safety, Tolerability, and Feasibility of Young Plasma Infusion in the Plasma for Alzheimer Symptom Amelioration Study: A Randomized Clinical Trial"
venue = "JAMA Neurology 76(1), 35–40 (2019)"
link = "https://doi.org/10.1001/jamaneurol.2018.3288"
finding = """
Eighteen people aged 50 to 90 with mild to moderate Alzheimer's disease were given four weekly
infusions of plasma from male donors aged 18 to 30 at Stanford: nine in a double-blind crossover
against salt water, and nine more in an open-label plasma-only group. The infusions were safe and
well tolerated, with no related serious adverse events. Cognition, measured only as an exploratory
outcome, did not change; caregivers rated day-to-day function better, which the authors treated as
unconfirmed. A safety trial of the young-blood idea in people, not a test of whether it works."""

finding = """
Germany's Federal Joint Committee, which rules on the added benefit of medicines, resolved on 2026-08-20 that colchicine added to optimised standard therapy, in adults with coronary heart disease and a recent heart attack, has a hint of a minor additional benefit over standard therapy alone, on the evidence of the COLCOT trial. The resolution gives the German marketing authorisation as of 2025-08-02, for the prevention of ischaemic cardiovascular events in those adults.
"""

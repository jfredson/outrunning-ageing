title = "Resolution of the Federal Joint Committee on an Amendment of the Pharmaceuticals Directive: Annex XII, Benefit Assessment of Medicinal Products with New Active Ingredients according to Section 35a SGB V: Colchicine (known active ingredient with new data protection: for the prevention of ischaemic cardiovascular events in patients with atherosclerotic CHD following a myocardial infarction)"
venue = "Regulator's resolution of 2026-08-20, in force the same day (courtesy English translation; only the German version is legally binding)"

title = "Effect of metformin on HIV reservoir, inflammation and cell differentiation in non-diabetic older people with HIV: a two-year placebo-controlled pilot trial (Metforaging)"
venue = "The Journal of Infectious Diseases (advance article, 2026-11-25), jiag579"
link = "https://doi.org/10.1093/infdis/jiag579"
finding = """
A placebo-controlled pilot trial in Madrid gave metformin or a dummy pill for 96 weeks to 35 people with HIV aged 50 or over who did not have diabetes. One kind of worn-out killer immune cell rose on the dummy pill and held steady on metformin (a difference of 5.2 percentage points, 2.0 to 8.5), while no blood marker of inflammation and no measure of the hidden virus differed between the groups. The authors call the result one to be tested further, not a finding of benefit.
"""

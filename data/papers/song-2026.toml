finding = """
A vaccine that trains the immune system against aged cells carrying a surface protein called Gpnmb cleared such cells from the fat of old mice, improved their handling of sugar and fat, and, the abstract says, lengthened their lives. A news report of 2026-10-30 on the paper gives the lifespan figure: a median life 12 per cent longer in female mice vaccinated at 75 weeks, with ten mice to a group and untreated mice that were short-lived for their strain. It is small mouse work and no person has been given the vaccine.

finding = """
The authors describe a single infusion that changes one letter of a liver gene, ANGPTL3, which raises LDL cholesterol and triglycerides. In monkeys it was well tolerated and cut the protein the gene makes by more than 90 per cent on average, with the effect lasting; in human liver cells no editing was found at about 3,000 other candidate sites. It is animal and cell work, not a trial in people.

finding = """
An essay arguing that once treatments cut the yearly risk of death at a given age fast enough, by
roughly a tenth a year in the age range where most people die, remaining life expectancy stops
falling with age and people pull away from death the way a rocket pulls away from the ground. De
Grey names that rate "actuarial escape velocity". The paper does not use the phrase "longevity
escape velocity"; that wording came later."""

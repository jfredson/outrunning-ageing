finding = """
A two-year placebo-controlled trial of metformin in 145 adults of about 72 with raised blood sugar short of diabetes, in San Antonio. On its first frailty score metformin showed no benefit once the weight loss it causes was set aside. On a second score that counts 95 health deficits it gave a small, significant slowing, and two clocks read from the marks on DNA in blood ran slightly slower (by 0.40 and 0.33 years a year). The trial measured frailty, not the time to a first age-related disease.
"""

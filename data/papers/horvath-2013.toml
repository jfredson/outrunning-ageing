title = "DNA methylation age of human tissues and cell types"
venue = "Genome Biology 14(10), R115 (2013)"
link = "https://doi.org/10.1186/gb-2013-14-10-r115"
finding = """
From about 8,000 samples across 51 healthy tissues and cell types, a predictor of a person's age
was built from the chemical methyl marks on 353 sites in their DNA. In samples it had not been
trained on it matched birth-certificate age with a correlation of 0.96 and a median error of 3.6
years, across tissues as different as blood, brain and skin; 20 kinds of cancer tissue read on
average 36 years older than the patient. The first multi-tissue "epigenetic clock", and the tool
every later claim of age reversal in people is measured with."""
leaves = ["a-blood-test-predicts-a-persons-death-and-disease-better-than-their-age"]
branches = ["measuring-age"]

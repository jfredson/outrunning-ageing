settled_stage = false
notes = """
Logged for the treatment planned as a clock validated to predict outcomes in a large cohort (a
large group of people followed over time), on the measuring ageing branch; this is the clock,
and the validation against outcomes came in later clocks (PhenoAge, GrimAge, DunedinPACE) and in
the criteria set out by Moqri and colleagues in 2023. The training-set error is 2.9 years; 3.6
years is the test-set figure. An erratum appeared in Genome Biology 16, 96 (2015) and was not
read here."""

# Publications log. Added 2026-10-17 when John's rulings on the outside review of that date were applied (docs/reviews/2026-10-17-rulings.md, item 6). The registry's data were read on 2026-10-17 through the registry's public interface, by the review session and again by the session that applied the rulings.

id = "telo-scope-2021"
date = "2020-11-20"
added_on = 2026-10-17
authors = ["The University of Queensland (sponsor)"]
title = "The TELO-SCOPE Study: Attenuating Telomere Attrition With Danazol. Is There Scope to Dramatically Improve Health Outcomes for Adults and Children With Pulmonary Fibrosis"
venue = "ClinicalTrials.gov registry entry NCT04638517, first posted 2020-11-20, last updated 2025-08-05"
link = "https://clinicaltrials.gov/study/NCT04638517"
finding = """
The registry lists a phase 2, multi-centre, randomised, placebo-controlled trial in Australia of danazol added to standard care in pulmonary fibrosis (lung scarring) linked to short telomeres, aimed at slowing telomere shortening, started 2021-09-07 with 29 people enrolled. Its status is terminated: the data safety monitoring board recommended stopping for futility, with a primary completion date of 2025-01-16. On 2026-10-17 the registry held five trials of danazol in telomere disease in all: this one; a withdrawn phase 1/2 trial after lung transplant (NCT04807309); a phase 1/2 trial in Paris of unknown status (NCT03710356); and the two completed National Institutes of Health phase 1/2 studies (NCT01441037, the 2016 trial that settled this treatment's stage at first human, and NCT03312400, low-dose danazol). None is a phase 3, and none names a sponsor carrying danazol to an approval.
"""
leaves = ["a-drug-lengthens-chromosome-ends-in-a-person"]
branches = ["damaged-dna"]
moved_range = true
settled_stage = false
notes = """
Logged as the added source behind John's ruling of 2026-10-17 on the outside review's case for the treatment "A drug lengthens the ends of chromosomes in a person": the likely year in the treatment's estimate had assumed a confirmatory trial and an approval of danazol or a relative for a telomere disease around 2034, and the registry shows the one phase 2 trial aimed at telomere attrition stopped for futility and no sponsor in sight. The futility finding is the registry's own stated reason for stopping and was not in the write-up of the review and John's rulings, which recorded the trial as terminated.
"""

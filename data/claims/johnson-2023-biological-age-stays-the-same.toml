the first generation that will, in principle, not die, and that death can be defeated in our lifetimes
but not for people already seventy or older; the interview itself was not found. On 2026-10-08 the
Axios Show published a printed account of an interview with him
(https://www.axios.com/2026/10/08/bryan-johnson-dont-die-longevity, by Madison Mills), headlined with the
aim of making 300 the new 70 (the headline is Axios's wording, not his); in it he gives his ultimate
goal as being thanked by people of the 25th century. Neither restates the goal of a pace of ageing of
zero in his own words, so the verdict is unchanged. His programme has its own entry among the

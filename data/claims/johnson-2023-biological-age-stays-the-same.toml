notes = """
The version that circulates, that his goal is the organs of an eighteen-year-old, is press
framing from interviews; on his own pages eighteen-year-olds appear only as comparisons for single
markers and in a line about restoring his joints. The verdict is the one this site gives a goal
with no date; by his own figures (his post of 2024, also on this log) his pace has run between
0.48 and 0.76 years per year, never zero. His programme has its own entry among the
self-experiments on this site.
Updated 2026-10-17, from the weekly reading of that date, and checked the same day against the pages
themselves: coverage in 2026 shows him still speaking of beating death, with no date or result that
could settle this claim. Blue News of 2026-07-16
(https://www.bluewin.ch/it/attualita/mondo/appartengo-alla-prima-generazione-che-non-morir-li.3531368,

notes = """
The post is the whole statement: he gives no reasons in it and names no treatment, so it is about the whole question and not any one branch. His page at the Jackson Laboratory is https://www.jax.org/research-and-faculty/faculty/derya-unutmaz, and the post he wrote above, by Elon Musk, is https://x.com/elonmusk/status/2116026811570069944.
The three parts fall due at different times, and the entry is scored at the first. When 2036 passes, the verdict turns on whether, in that year, the best available care added at least a year of remaining life expectancy per year lived. The second part comes due about 2041, and turns on whether a treatment by then makes an old person's body measurably younger, and not only slower to age. "In ~15 years" could also be read as fifteen years after escape velocity is reached, which would put it between 2046 and 2051; the plainer reading, fifteen years from the post, is the one used here. The third part, lifespans of hundreds of years, cannot be checked by anyone alive today: nobody could be shown to have lived that long before the 2100s at the earliest.

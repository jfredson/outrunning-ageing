notes = """
His own posts frame the same programme without a date: on 2023-01-12, announcing the Cell paper
on loss of the cell's settings as a cause of ageing, he said the age-reversal technology was being
tested in monkeys with results due in a few months; on 2023-07-12 that preparations for human
trials of the first age-reversal gene therapy were ongoing at Life Biosciences. Harvard Medical
School's own news item of 2023-01-12 said medical applications were a long way off. No statement
of his from 2023-01 naming 2024 or 2025 for eye trials was found, so the version that attributes
the date to that month is held as unsourced. The company's own date is
Life Biosciences' claim of 2024; the 2016 forecast the trial fulfils is the Salk Institute's;
both are on this log.
Checked against the recording on 2026-10-17, in the video of the episode on YouTube
(https://www.youtube.com/watch?v=Jk_GcwkfJGs, posted 2023-08-24; the podcast feed lists the episode
on 2023-08-25). YouTube's automatic captions and a computer transcription of the audio agree on the
words, at about 19:50: "it's my prediction that we'll be in the next 18
months or two years testing our first age reversal clinical trial in humans to cure blindness". The
record had "age-reversed" from the third-party transcript; it is corrected to "age reversal". A
larger transcription model read "age reversed" in one pass, "age reverse" in a second and "age
reversal" in a third, so it does not settle for the hyphenated form; the quote follows the two
readings that agree. In the episode's introduction Diamandis calls it a
fireside chat from the summit "this year".
The day of the recording is not settled and the record stays dated by the podcast release. The
summit's announcement of 2023-02 (Diamandis's post "Embrace the Future - Don't Fear It!") planned
the conversation about reversing ageing for the evening of the first day (2023-03-20); the summit's
member replay listing files the talk, "Age-Reversal & Epigenetics", under Day 3 (2023-03-22 if the
days run from 2023-03-20). No source says which."""

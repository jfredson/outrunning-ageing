taken.
Updated 2026-10-18, from the weekly reading of that date: a peer-reviewed version of the study exists. Simon and colleagues, North Carolina State University, Scientific Reports 14, article 12399, published 2024-05-29 (simon-2024; the open copy at PubMed Central was read in full), randomised 70 dogs (23 on placebo, 23 on a low dose, 21 on a full dose) for three months and found that owner-rated cognition changed differently between the groups (p = 0.02) while activity monitors, the in-clinic cognitive tests, frailty (p = 0.32) and owner-rated happiness (p = 0.34) did not; all groups improved, which the authors say suggests a placebo effect and the benefits of taking part; the cognition gain was not kept at six months. The paper says it was funded by 'Animal Bioscience, Boston MA', which played no role in data acquisition, analysis or presentation, and the authors declare no competing interests. The result is narrower than 'proven to reverse aging in dogs', which supports the verdict. The verdict, missed, is unchanged.

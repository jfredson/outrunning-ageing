summary = """
The weekly reading run by the scheduled task on 2026-11-09, covering 2026-11-02 to 2026-11-09 and so overlapping the last reading by a week. Every one of the 45 treatments, 31 claims and 9 self-experiments was read. Nothing moved a rung. Five publications were logged: a Nature Aging mouse paper (2026-11-06) that adds a mineral compound as a second kind of aged-cell-clearing drug; a newly posted registry entry for a finished fisetin trial in 82 people (2026-11-05); a Cell Stem Cell paper (2026-11-05) on switching off one gene in human blood stem cells, in cells and mice only; the 48-month follow-up of the vutrisiran heart trial in Circulation (2026-11-03); and a newly posted registry entry for a planned gut-microbe capsule trial against biological ageing (2026-11-03). One item is flagged: the full results of the ZEUS trial of ziltivekimab, reported on 2026-11-07, found no benefit on heart attacks, strokes or cardiovascular deaths, which bears on that treatment's estimate towards later. The other 79 were quiet. Other news of the week that matched no record: the Alzheimer's meeting CTAD opened with previews of five-year lecanemab data and tau drugs (the data itself was not out), a free personal longevity assistant from Insilico built with David Sinclair, and a 500-person six-month biological-age contest.
"""
limits = """
Several dozen pages were opened: trial-registry data pages, Europe PMC records, company and trade-press pages and a regulator's page. The newswire sites, the filings site and several company investor pages refused to load, so company results releases outside the trade press were not swept, and the journal page for the ZEUS paper refused too. Only the first 25 of 493 papers dated in the window were read in the field-wide sweep, one helper's paper searches returned nothing readable, the search tool cannot limit results by date, and ten helper readers did the work.
"""


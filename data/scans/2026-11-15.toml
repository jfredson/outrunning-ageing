summary = """
The weekly reading of 2026-11-15 covers 2026-11-08 to 2026-11-15, so it overlaps the two readings of 2026-11-09 by two days. Every one of the 45 treatments, 34 claims and 9 self-experiments was read. Nothing moved a stage. Twenty-seven publications were logged; 10 items were noted, 44 were quiet and 34 are left for me to decide, of which 22 are questions the reading of 2026-11-09 raised that are still unanswered and are listed again so that they are not lost. The week's main news for the treatments here: a reanalysis of 33,780 mice found that the drugs known to lengthen mouse life do so mostly in the heaviest males, which bears on every hope resting on those results (a preprint, 2026-11-11); heart scans showed less amyloid in people given eplontersen in the large trial that had missed its main outcome (2026-11-09); the under-the-skin pen form of the amyloid antibody lecanemab went on sale in Japan (2026-11-13); a mid-stage trial of a second in-body gene editor, this one to lower cholesterol in 175 people with or at risk of heart disease, is recruiting, and two more companies reported first trials of such editors cleared or begun; a preprint from Shinya Yamanaka's group found that briefly resetting human cells suits each kind of cell differently (2026-11-12); and three preprints tested ages read for each organ from blood proteins, with mixed results. The reading also found older facts the records lacked: Japan approved a product grown from a person's own cartilage cells for osteoarthritis of the knee on 2025-05-13; the first patient under Japan's conditional approval of a Parkinson's cell therapy was treated in October 2026; a two-year placebo-controlled trial of metformin against frailty has been written up; and a public meeting summary of July 2026 sets out that the United States regulator has no route for a drug against ageing itself and no accepted marker of ageing. News of the week that matched no treatment here: an antibody against tau, the second protein of Alzheimer's disease, missed its main outcome in 466 people (2026-11-10); the weight-loss injection retatrutide eased knee arthritis pain in two late-stage trials (2026-11-08); an antibody kept muscle on people losing weight with semaglutide (2026-11-11); a first trial in people of the protein klotho given as messenger RNA, registered with ageing as its condition, is recruiting 20 healthy people in Honduras (registry entry updated 2026-11-12); and Longeveron, a maker of a cell therapy tested against frailty, said it is short of money and looking at a sale (2026-11-12). The news of the whole field was gathered an hour earlier in a separate sweep, and its stories were handed to the treatments they match.
"""
limits = """
Eleven helper readers read the records, each given the same fixed written brief, and the news of the whole field came from a separate sweep run an hour earlier; the readers opened about 400 pages between them (trial-registry entries, paper abstracts, company filings and releases, regulators' pages). The search tool's allowance of 200 searches, shared by all the readers, ran out part-way for the second reading running, so 29 records had fewer open-web searches than asked for, most of them none, and were read from the trial registry, the paper database, company filings and pages opened directly; news reports, and releases from companies that do not file in the United States, are the likely gap, and the search tool cannot limit results by date in any case. The pages behind this week's new questions were opened a second time when the reading was put together (paper abstracts through the paper database, registry entries, filed company releases, three documents read as files), except some news and podcast pages; the pages behind the 22 questions carried over from 2026-11-09 were not opened again. Most journals' own pages refuse, so papers were read as abstracts, and the paper database was thin for the last two days of the week.
"""


]
publications = ["japan-tissue-engineering-2025"]
for_john = """
Correction: the entry says wide use needs a trial in osteoarthritis that nobody had run and that osteoarthritis is outside the label, but in Japan a product of this kind has been approved for osteoarthritis of the knee since 2025-05-13. Japan Tissue Engineering's cultured cartilage, grown from the patient's own knee cartilage cells and first approved in 2012 for injuries, had osteoarthritis of the knee added to its approved uses on that date, for people with a cartilage defect of 2 square centimetres or more whom exercise and other non-surgical treatment have not helped; the company ran its trial for this from April 2019, and the Japanese regulator's list of approved products shows the change. Public health insurance has covered the new use since 2026-01-01, and the company said in May 2025 that it aims for about 1,000 cases a year within a few years. This bears on the estimate towards earlier for wide use, since the reasoning's earliest year of 2033 rests on no approval for worn joints existing anywhere; whether one country and a trial reported as 27 people changes the years is left for me to weigh. Opened: the company's releases of 2025-05-13 and 2025-12-29, the Japanese regulator's list of approved regenerative products (April 2015 to July 2026), and a trade article of 2026-01-28, which is the only source read for the figure of 27 patients and for the comparison with joint injections. Seen in a search result only: that a different product, donor cartilage cells given by injection by the Korean company Kolon TissueGene, missed both main measures in a large United States trial reported on 2026-07-20.
"""


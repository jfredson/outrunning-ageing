[[later_note]]
date = 2026-10-18
text = "Correction to the summary above, made on 2026-10-18 after an audit of this reading on 2026-10-18. The summary says that where a paper, regulator's notice or release bore on a record, the journal or registry page could not be opened. Several pages of those kinds did open and were read (Intellia's release of 2026-08-06, the Federal Joint Committee's resolution of 2026-08-20, the open copy of the dog paper at PubMed Central), and the reading's procedure says to log them; they were logged only in the change to the records on 2026-10-18. The window of 2026-10-11 to 2026-10-18 began seven days before the reading, not the day after the previous reading. And the search tool used cannot limit results by date, so 'nothing dated in the window' means that no such result turned up in a news-style search, not that nothing happened."

The first weekly reading, run by hand on 2026-10-17, the day the site went live, on a computer in
the cloud. Every one of the 44 treatments and tools, all 9 self-experiments and 27 of the 30 claims
were read against the week from 2026-10-10 to 2026-10-17; every record had been checked against its
sources on 2026-10-16 and 2026-10-17, so the reading also says where those checks fell short.
Nothing moved: no record of the kind that settles a treatment's test showed a rung reached in the

resolved_on = 2026-11-09
resolved_by = "Ruled on 2026-11-09: waiting for a paper or a registry record. Heartseed's results so far are the company's own announcements, and this treatment's test asks for a peer-reviewed report, so the entry does not take them up until a paper, or posted registry results, can be opened; whether injected clumps of heart cells count as a graft is left until then."


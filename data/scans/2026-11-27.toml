for_john = "Correction: Still open from the weekly reading of 2026-11-15, where it was first raised: the entry on a regulator accepting a marker of ageing lacks the public meeting of 2026-05-27, \"Affecting the Aging Trajectory\", convened by the Reagan-Udall Foundation for the FDA with the government agency ARPA-H and XPRIZE Healthspan, whose summary of July 2026 says there is no validated ageing marker and no accepted regulatory measure for a treatment of ageing, and that no ageing marker has reached the standing of a validated or reasonably likely stand-in for a trial's outcome. It is the nearest thing to the regulator's side stating the entry's position in a public document, and it adds that officials pointed to the existing routes (meetings on a company's own trial plan, the marker qualification programme) and said progress waits on specific proposals; a trade report of 2026-10-02 adds that the regulator's chief scientist told a conference its next statement of science priorities, due in the financial year that began on 2026-10-01, will include ageing, and the regulator's own page still lists the 2022 edition as the latest. I opened the meeting summary, the trade report on Lifespan.io, the regulator's three pages and the European regulator's two lists; a second trade article on the same conference refused to load and was seen in a search result only. What the weekly reading of 2026-11-09 left open on this entry is still open as well. Nothing dated between 2026-11-20 and 2026-11-27 changes it; the pages behind it were opened by that reading and were not opened again this week."

# The tenth weekly reading of Outrunning Ageing (docs/weekly-reading.md; layout in docs/record-schema.md under
# "The scan record"). Run by the scheduled task under step 1a. Helpers: six treatment readers (T1 to T5
# with eight treatments each in branch order, T6 with the last five), four claim readers (C1 and C2 with nine claims
# each, C3 and C4 with eight) and one reader for the nine self-experiments (E1). Each was given the fixed brief
# docs/reading-briefs/record-reader.md as a file with only the bracketed values filled in, and no other instruction.
# The field-wide sweep came from its own run (docs/readings/sweeps/2026-11-27.md), so no sweep helper was started.
# The main session checked every item, reopened the sources behind this week's new flagged items and every
# publication it logged, handed the sweep's stories to the records they match, and flagged again the 33 items of
# 2026-11-15 that are still unruled (design choice 9); the amyloid antibody item of 2026-11-15 was dealt with by
# the change of 2026-11-21 and is not carried. The reading of 2026-11-22 did not run. Written once and never edited.

id = "2026-11-27"
read_on = 2026-11-27
covers_from = 2026-11-20
ran_at = "2026-11-27T14:05:55Z"
run_by = "scheduled"
commit_before = "0c605c1"
leaves_read = 45
claims_read = 34
experiments_read = 9
searches = 1001
summary = "The weekly reading of 2026-11-27 covers 2026-11-20 to 2026-11-27, so it does not overlap the reading of 2026-11-15, and the days from 2026-11-16 to 2026-11-19 were covered by no reading, because the reading due on 2026-11-22 could not run. Every one of the 45 treatments, 34 claims and 9 self-experiments was read. Nothing moved a stage. Twelve publications were logged; 5 items were noted, 47 were quiet and 36 are left for me to decide, of which 33 are questions earlier readings raised that are still unanswered and are listed again so that they are not lost. The week's main news for the treatments here: a woman given a gene-edited pig kidney has gone a full year without dialysis, the longest such a kidney has worked in a living person (2026-11-23); a count in The Lancet Healthy Longevity found 193 trials of drugs aimed at the biology of ageing, four in five of them early and most aimed at a disease rather than at ageing itself (2026-11-23); a small two-year placebo-controlled trial of metformin in older people with HIV found no change in inflammation (2026-11-25); a tuberculosis vaccine lowered an age read from DNA in young adults and raised it in the old (a preprint, 2026-11-26); a preprint found that organ ages read from blood proteins come out just as well from random proteins (2026-11-24); and a pilot trial of plasma exchange in veterans with early Alzheimer's disease was announced (2026-11-20). The reading also found older facts the records lack: a French trial of danazol in lung scarring that most people could not finish, a controlled trial in which weekly rapamycin added nothing to exercise in older people, and a foundation's statement that a woman was given the three cell-resetting genes on 2026-03-11, outside any trial. Stories from the week with no treatment of their own here: the twice-yearly cholesterol injection inclisiran cut heart attacks and strokes in its first outcomes trial (2026-11-23); Britain approved the cholesterol pill obicetrapib with ezetimibe (2026-11-26); a cell treatment for age-related knee arthritis goes to the United States regulator on 2026-12-08; and loading the bones of old mice lengthened their lives by about 9 per cent."
limits = "Eleven helper readers read the records, each given the same fixed written brief, and the news of the whole field came from a separate sweep run earlier the same day; the readers opened about 330 pages between them (trial-registry entries, paper abstracts, company filings and releases, regulators' pages). The search tool's allowance of 200 searches, shared by all the readers, ran out part-way for the third reading running, so about 16 records had fewer open-web searches than asked for and were read from the trial registry, the paper database, company filings and pages opened directly; the search tool cannot limit results by date in any case. The pages behind this week's new questions and every publication logged were opened again when the reading was put together, but the pages behind the 33 questions carried over from earlier readings were not; most journals' own pages refuse, so papers were read as abstracts, and the paper database was thin for the last two days of the week, which held a public holiday in the United States."



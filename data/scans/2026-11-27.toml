found = "On 2026-11-20 the company AmBARI Healthcare, the Phoenix veterans' hospital in Arizona, its research foundation and the Young Blood Institute announced an agreement to run a randomised controlled pilot trial of plasma exchange in up to 56 veterans with mild memory loss or the earliest stage of Alzheimer's disease, measuring the amyloid protein in the brain on scans. It is a trial still to start, with a brain-scan measure rather than a measure of the disease's course, so it does not bear on how widely the treatment is used. The registry, the paper searches and the filings showed nothing else in the window: no plasma-exchange trial for ageing or Alzheimer's disease posted or updated, five papers on the procedure in liver failure and other conditions, and one filing by the supplier Grifols on 2026-11-27 that is about a dividend."

  "https://clinicaltrials.gov/study/NCT04786262",
]
for_john = "Correction: Still open from the weekly reading of 2026-11-15, where it was first raised: last week's reading could not say whether the Parkinson's cell product approved in Japan on 2026-03-06 had yet been given to anyone under that approval, and the maker has since said that it has. Sumitomo Pharma's results presentation of 2026-10-30 says the first transplantation in the study it must run after approval was completed at Kyoto University Hospital in October 2026, that it plans about 1 or 2 patients in the year to March 2027, about 10 in the next year and 10 to 20 in the year after, and that patients in that study have priority, with other hospitals and a wider group of patients to follow only once the study is complete. That bears on the question still open from last week, whether a conditional, time-limited approval counts for the clinic step: the product is in use under the approval, but for a handful of people a year inside a required study. Nothing new on the diabetes therapy: its maker filed no announcement in the window. Opened: Sumitomo Pharma's presentation and its news feed, the Lineage and Century reports as filed with the United States securities regulator, the list of the diabetes therapy maker's filings, and five registry entries through the registry's data interface. Seen in a search result only: nothing, because no web search could be run for this entry. What the weekly reading of 2026-11-09 left open on this entry is still open as well. Nothing dated between 2026-11-20 and 2026-11-27 changes it; the pages behind it were opened by that reading and were not opened again this week."
resolved_on = 2026-11-27
resolved_by = "Ruled the same day: the stage stays at first human, because the Japanese product is supplied only within its required study for now, and a dated note says so (changelog, 2026-11-27, the four stage questions)."


  "https://clinicaltrials.gov/study/NCT06128629",
  "https://clinicaltrials.gov/study/NCT06672237",
  "https://www.sec.gov/Archives/edgar/data/1894562/000162828026073372/q320268-kex991xpressrelease.htm",
]
for_john = "Bears on the estimate, towards earlier: Still open from the weekly reading of 2026-11-15, where it was first raised: a second in-body gene editor for a condition of ageing has reached a mid-stage trial that the entry does not mention. The trial registry shows a phase 2 trial of the base editor VERVE-102, meant to lower LDL cholesterol for good, in 175 adults with or at high risk of heart disease (registry number NCT07839936; started 2026-09-24, recruiting in the United States, main measure the change in LDL cholesterol at 90 days, entry updated 2026-11-10), and Editas Medicine said on 2026-11-09 that it has Australian clearance for a first trial of its own LDL-lowering in-body editor and expects to treat a first patient this year. For the transthyretin editor itself, a meeting abstract in the journal Circulation (issue dated 2026-11-02, six days before this window, from the phase 1 trial's investigators) reports that in 72 people the protein stayed about 89 per cent lower two years after the single dose and heart measures held steady or improved, and Intellia's presentation of 2026-11-12 says the regulator plans no advisory committee for its angioedema editor, whose decision is due by 2027-03-10 and whose disease this test does not count. The registry entries for the two late-stage transthyretin trials are unchanged since 2026-11-05 (the heart trial recruiting, the nerve trial closed to new patients with 67 enrolled). Opened: the Intellia presentation and the Editas release as filed with the securities regulator, the registry entries for the four trials, and the abstract's text through Crossref because the journal's page refused; the heart-meeting data on the CRISPR Therapeutics editor for blood fats, which the last reading left unopened, could not be found in the dated sources, and the open web was not searched because the search allowance had run out. What the weekly reading of 2026-11-09 left open on this entry is still open as well. Nothing dated between 2026-11-20 and 2026-11-27 changes it; the pages behind it were opened by that reading and were not opened again this week."
resolved_on = 2026-11-27
resolved_by = "Applied the same day: a dated note records the trial dates and the other in-body editors, and the reasoning says the years were weighed and held. Intellia's slide dates the regulator's acceptance of the angioedema application 2026-09-03, not 2026-09-08 as an earlier reading had it. No stage or year changed (changelog, 2026-11-27, the third batch of older questions)."


found = "No new trial result, approval, stopped trial or figure for how widely colchicine is prescribed turned up for 2026-11-20 to 2026-11-27. The trial registry shows the third ziltivekimab trial, ARTEMIS, after a heart attack, updated on 2026-11-24 as closed to new patients with 8,350 enrolled and its main results due in early 2027, and the trial in heart failure still marked as stopped since 2026-10-01. The nearest papers were a British study of 12,175 people with rheumatoid arthritis (Tian and colleagues, Rheumatology, 2026-11-25) that found no difference in heart attacks and strokes between two kinds of anti-inflammatory drug, which is not a comparison with placebo, and a review of 2026-11-25 on the limits of anti-inflammatory treatment after the recent neutral trials."
sources = [
  "https://clinicaltrials.gov/study/NCT06118281",
  "https://clinicaltrials.gov/study/NCT05636176",
  "https://doi.org/10.1093/rheumatology/keag663",
  "https://doi.org/10.1007/s11883-026-01490-4",
]
for_john = "Correction: still open from the weekly reading of 2026-11-09, where it was first raised. On 2026-11-04 the drug's maker, Novo Nordisk, reported that a second large trial of ziltivekimab, in 4,874 people with heart failure, did not meet its main aim and was closed, and the entry's reasoning still speaks of the drug as being tested in heart failure; the registry, opened again this week, still shows that trial as stopped, and shows the trial after a heart attack closed to new patients with 8,350 enrolled and results due in early 2027. Opened this week: the registry entries for the three ziltivekimab trials through the registry's data interface and the two papers' abstracts on Europe PMC; the news reports on the heart-failure trial were seen in search results only."
resolved_on = 2026-11-27
resolved_by = "Ruled the same day: the clinic date moved to Canada's approval of 2021-08-20, and the reasoning now says the heart-failure trial was stopped early, with results expected in 2027 (changelog, 2026-11-27, the four stage questions)."


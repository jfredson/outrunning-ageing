found = "No trial in people without diabetes reported on time to a first age-related disease, and the large planned metformin ageing trial still has no registry entry and no news. One small controlled trial did report in the window: a two-year trial in Madrid of metformin against a placebo in 35 people with HIV aged 50 and over and without diabetes, published in the Journal of Infectious Diseases on 2026-11-25, found that one kind of worn-out immune cell grew in number on the placebo but held steady on metformin, with no difference in blood signs of inflammation. The authors call it a pilot whose findings need larger trials, and it measured immune cells, not disease."
sources = [
  "https://academic.oup.com/jid/advance-article/doi/10.1093/infdis/jiag579/9122941",
  "https://doi.org/10.64898/2026.07.27.26359055",
  "https://clinicaltrials.gov/study/NCT02570672",
  "https://doi.org/10.1136/bmjopen-2025-114393",
  "https://doi.org/10.1136/jnnp-2026-339219",
  "https://doi.org/10.1093/infdis/jiag579",
]
publications = [
  "gutierrez-garcia-2026",
]
for_john = "Correction: Still open from the weekly reading of 2026-11-15, where it was first raised: the entry does not mention a two-year placebo-controlled trial of metformin against frailty in older people without diabetes, which has finished and been written up. The trial, at the University of Texas Health Science Center at San Antonio, gave metformin or a placebo to 145 people of about 72 with raised blood sugar short of diabetes; its preprint of 2026-07-28 (Musi, Espinoza and colleagues, not yet peer-reviewed) reports no benefit on its first frailty score once weight loss is set aside, a small but significant slowing on a second frailty score that counts 95 health deficits, and slightly slower ageing on two blood-based clocks, and the registry entry is marked completed with results posted on 2025-08-06. It measured frailty and not time to a first disease, so it neither meets nor fails the test, but with the Oklahoma trial noted last week it is a second finished placebo-controlled trial of metformin as an ageing drug in people without diabetes, and the two do not point the same way. Opened: the preprint's abstract through Europe PMC, the registry entry through the registry's data interface, and the abstracts of the BMJ Open paper through PubMed; the second journal paper of 2026-11-13 has no abstract on PubMed, so only its title, authors and date were read. Seen in a search result only: nothing used here. What the weekly reading of 2026-11-09 left open on this entry is still open as well. Nothing dated between 2026-11-20 and 2026-11-27 changes it; the pages behind it were opened by that reading and were not opened again this week."
resolved_on = 2026-11-27
resolved_by = "Applied the same day: a dated note records the Oklahoma and San Antonio trials. No stage or year changed (changelog, 2026-11-27, the second batch of older questions)."


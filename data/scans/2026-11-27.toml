  "https://doi.org/10.1016/s2213-8587(26)00249-4",
]
for_john = "Bears on the estimate, towards later: Still open from the weekly reading of 2026-11-09. On 2026-11-09 the United States regulator required a new warning on every drug of this family, including semaglutide, of a possible raised risk of a rare, sudden loss of sight in one eye (6.4 against 3.8 cases for every 100,000 people treated for a year, pooled from 126 randomised trials); that page was opened by the reading of 2026-11-09 and not again this week. New this week and not changing the stage: the Japanese part of the large semaglutide heart trial in people without diabetes (Circulation Journal, 2026-11-21, https://doi.org/10.1253/circj.cj-26-0448) points the same way as the whole trial, which I read as its abstract in the Europe PMC database; I also opened the regulator's press list and the registry entry for the tirzepatide trial on deaths and heart events in 15,374 people with obesity, updated on 2026-11-24, still running, with its main result estimated for October 2027. The web searches for this entry could not be run because the search allowance had run out."

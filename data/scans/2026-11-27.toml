  "https://doi.org/10.64898/2026.11.10.765234",
]
publications = [
  "angioni-2026",
]
for_john = "Bears on the estimate, towards later: the review of 2026-11-23 in The Lancet Healthy Longevity (Angioni and colleagues, https://doi.org/10.1016/j.lanhl.2026.100943) found that of 193 registered trials under way at the start of 2026 of drugs aimed at the biology of ageing, only 41 were in healthy people or people at risk of decline, and 79 per cent were at an early phase; it is a count of plans, not a result, but it shows how few trials of the kind this entry waits for are running. Still open as well: from the reading of 2026-11-09, the registration on 2026-11-06 of the three-year trial of dapagliflozin and semaglutide in 1,200 healthy adults aged 60 to 75, with its main result estimated for December 2030 (towards earlier; registry entry opened again this week, unchanged); and from the reading of 2026-11-15, the preprint of 2026-11-11 by Bouvet and Partridge finding that much of the drugs' gain in the mouse testing programme went to the heaviest mice (towards later; not opened again this week). I opened the review's abstract in the Europe PMC database and the trial's registry entry; nothing else dated in the window bears on this entry."
sibling_stage = "shown-in-animals"

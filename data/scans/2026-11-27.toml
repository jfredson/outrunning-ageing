found = "No trial in people reported extra healthy years between 2026-11-20 and 2026-11-27. A review in The Lancet Healthy Longevity on 2026-11-23 (Angioni and colleagues) counted 193 trials under way at the start of 2026 of drugs aimed at the biology of ageing: only 41 were in healthy people or people at risk of decline, most were at an early phase, and most aimed to treat a disease rather than to delay ageing. The three-year trial of dapagliflozin and semaglutide in 1,200 healthy older adults is unchanged since 2026-11-06 (not yet recruiting), and two questions about this entry left open by the readings of 2026-11-09 and 2026-11-15 have not been answered, so they are listed again."
sources = [

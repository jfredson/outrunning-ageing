[[item]]
leaf = "organ-from-a-gene-edited-pig-keeps-a-person-alive"
verdict = "flagged"
queries = [
  "registry: xenotransplantation (last updated 2026-11-20 to 2026-11-27, and first posted)",
  "registry: pig kidney (last updated, and first posted)",
  "registry: porcine kidney (last updated, and first posted)",
  "registry: xenograft heart (last updated, and first posted)",
  "registry: porcine liver (last updated, and first posted)",
  "registry: NCT07696962; NCT07224763; NCT06878560 (each entry read through the registry's data interface)",
  "papers: (xenotransplant* OR \"pig kidney\" OR \"porcine kidney\" OR \"pig heart\" OR \"pig liver\" OR \"pig lung\" OR \"gene-edited pig\")",
  "filings: xenotransplantation",
  "filings: \"xenokidney\" OR \"UKidney\"",
  "filings: eGenesis",
  "filings: \"United Therapeutics\" xenotransplant",
  "filings: \"pig kidney\"",
  "filings: TNX-1500",
  "newswire: globenewswire businesswire prnewswire xenotransplantation pig kidney trial transplant results OR first patient November 2026",
  "newswire: United Therapeutics OR eGenesis OR ChoironeX OR Makana xenotransplant announcement November 2026 globenewswire businesswire prnewswire",
  "transplant centre announces patient gene-edited pig kidney transplant November 2026",
  "xenotransplant pig organ news this week patient update late November 2026",
]
found = "On 2026-11-23 eGenesis and Mass General Brigham said that a 58-year-old woman given a gene-edited pig kidney on 2025-11-22 has now gone a full year without dialysis, the longest such a kidney has worked in a living person; she was treated outside a trial, so the stage, first human, is unchanged. No regulator's decision dated 2026-11-20 to 2026-11-27 turned up. The dated paper search returned eleven papers, one on the subject: a Korean study of a pig heart that failed after nine days in a monkey (Oh and colleagues, Clinical Transplantation and Research, 2026-11-25), which is animal work and does not bear on the test in people. The three pig kidney trials on the registry are unchanged since 2026-11-10, 2026-09-09 and 2026-03-27, all still recruiting with no results posted, and the web searches found nothing newer than the 271-day pig kidney case reported in September 2026."
sources = [
  "https://clinicaltrials.gov/study/NCT07696962",
  "https://clinicaltrials.gov/study/NCT07224763",
  "https://clinicaltrials.gov/study/NCT06878560",
  "https://egenesisbio.com/news-media/press-releases/egenesis-and-mass-general-brigham-announce-first-patient-to-surpass-one-year-of-dialysis-independence-following-porcine-kidney-transplant",
]
publications = [
  "egenesis-2026-one-year",
]
for_john = "Bears on the estimate, towards earlier: the maker's release of 2026-11-23, opened on its own page, says a pig kidney has kept a woman free of dialysis for a full year, a year being the first test of durability that transplant medicine itself uses. It is one patient, reported by the maker and treated outside a trial, so it does not reach the clinic rung, which needs a regulator's approval for use outside a trial. Correction: still open from the weekly reading of 2026-11-09, where it was first raised. The description says the United States regulator cleared two formal trials in 2025, and the reasoning for the estimate says two registered trials were enrolling in 2025 and 2026, while that reading found three kidney trial clearances in 2025, a pig heart trial cleared in May 2026, and three pig kidney trials recruiting. Nothing dated between 2026-11-20 and 2026-11-27 changes it; this week the three registry entries were opened again through the registry's data interface and the Korean monkey study's abstract was read on Europe PMC, and nothing was seen in a search result only."
sibling_stage = "first-human"
sibling_agrees = true
resolved_on = 2026-11-27
resolved_by = "Applied the same day: the description and the reasoning now give the trial clearances of 2025 and 2026 and the first full year, a dated note records the release and the clearances, and the reasoning says the years were weighed and held. No stage or year changed (changelog, 2026-11-27, the third batch of older questions)."


  "https://clinicaltrials.gov/study/NCT07166354",
]
publications = [
  "stanfield-2026",
]
for_john = "Correction: the entry gives the 2014 flu-vaccine trial as the one positive controlled result and the 2025 year-long trial as a null one, but it lacks a third controlled trial in older people, RAPA-EX-01 (Stanfield, Leroux, Kaeberlein, Jones and Lucas, Journal of Cachexia, Sarcopenia and Muscle, online 2026-04-15), which counts against. In 40 inactive people aged 65 to 85 given 6 mg of rapamycin or a placebo once a week for 13 weeks alongside a home exercise programme, the drug did not improve the main measure, chair stands in 30 seconds (difference -2.1, p = 0.089), the prespecified sensitivity analyses favoured the placebo and reached significance, and side effects were more frequent on the drug, including one serious infection that may have been drug-related. Opened: the abstract in the Europe PMC database and the Crossref record for the date (the publisher's page refused the reader); seen in a search result only: a summary of the trial on a personal wiki. In the window itself, the San Antonio trial of rapamycin in people aged 70 to 95 updated its registry entry for its heart-scan substudy on 2026-11-25 (now active, not recruiting; one group of 20 with no comparison, due to finish 2027-02-28), opened through the registry's data interface. What the weekly reading of 2026-11-09 left open on this entry, the late-stage trial the University of Arizona announced on 2026-03-31, is still not in the entry."
resolved_on = 2026-11-27
resolved_by = "Applied the same day: the third controlled trial was added earlier the same day, and a dated note now records the University of Arizona's announced trial. No stage or year changed (changelog, 2026-11-27, the second batch of older questions)."


found = "No new approval and no figure for the share of eligible people taking these drugs to prevent heart attacks and strokes turned up with a date between 2026-11-20 and 2026-11-27; the United States regulator's list of press announcements shows no decision on them in that time. A further analysis of the large semaglutide heart trial in people without diabetes, published in the Circulation Journal on 2026-11-21 (Komuro and colleagues), looked at its 357 Japanese participants and found heart attacks, strokes and heart deaths in 10 on the drug and 16 on placebo, in line with the whole trial though too few to be sure on their own. A question about this entry first raised by the weekly reading of 2026-11-09 has not been answered, so it is listed again. Also in the window: pooled randomised trials in Ophthalmology on 2026-11-24 found these drugs slightly raise damage to the retina and lower glaucoma; a study in the Journal of Clinical Epidemiology on 2026-11-20 found the reported protection against cancer looks like a flaw of study design; and a late-stage substudy in The Lancet Diabetes and Endocrinology on 2026-11-25 found the newest combination kept blood sugar in range for much more of the day."
sources = [

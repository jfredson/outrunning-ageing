for_john = "Correction: Still open from the weekly reading of 2026-11-15, where it was first raised: the entry and the papers logged for it do not hold a mouse lifespan result published eleven days before this window. A paper in Advanced Science, online on 2026-10-28 (Song and colleagues), reports that a vaccine which trains the immune system against aged cells carrying a surface protein called Gpnmb cleared such cells from the fat of old mice and lengthened their lives; a news report of 2026-10-30 gives a 12 per cent longer median life in female mice vaccinated at 75 weeks, with ten mice to a group and untreated mice that were short-lived for their strain. It is small mouse work, so the stage and the test for people are untouched, but it is a third kind of treatment (after the two-drug course and the mineral supplement) said to add life by clearing aged cells, and it also bears on the note about an earlier vaccine in the entry on engineered immune cells. Opened: the paper's abstract through Europe PMC and its date through Crossref, and the news report on lifespan.io; the full paper was not read, so the lifespan figures rest on the news report. Nothing dated between 2026-11-20 and 2026-11-27 changes it; the pages behind it were opened by that reading and were not opened again this week."
resolved_on = 2026-11-27
resolved_by = "Applied the same day: a dated note records the vaccine's mouse lifespan result and its limits. No stage or year changed (changelog, 2026-11-27, the second batch of older questions)."


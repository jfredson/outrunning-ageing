found = "No approval for ageing and no written agreement by a regulator turned up for 2026-11-20 to 2026-11-27, and the trial registry still has no entry for the metformin trial. The government-funded trial of two approved drugs in 1,200 healthy older adults, with ageing as its condition, has not been updated since it was first posted on 2026-11-06 and is still not recruiting. The eight studies first registered in the window with ageing as a condition are tests of supplements, skin creams, a brain exercise course and occupational therapy, and two studies that only observe; none tests a drug against ageing itself; the metformin trial's sponsor page still does not load."
sources = [

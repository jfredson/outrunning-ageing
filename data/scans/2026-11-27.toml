found = "No report of a person treated with transplanted mitochondria turned up for the window. The three trials the entry names are unchanged on the trial registry (the stroke trial and the trial in children on heart-lung support still recruiting, last updated 2025-05-21 and 2026-01-05; the muscle-disease trial completed, with no results posted), and no trial of transplanted mitochondria was registered or updated in the window. The papers dated in the window were laboratory and cancer studies, among them a report in Science Advances on 2026-11-20 of a light-driven device that restored energy to injured heart cells, and the web searches returned older items only. A paper in Molecular Cell on 2026-11-25 described an editor that changes single letters of the DNA inside the cell's power plants in living mice, which is laboratory work and not a transplant."


found = "No paper, registry change or company filing dated between 2026-11-20 and 2026-11-27 reports longer telomeres in people after a treatment, and no danazol trial was registered or updated in the window. The searches did turn up an older trial report the records do not hold: a French phase 2 trial of danazol in people with telomere-gene faults, published in ERJ Open Research (online on 2025-11-09), in which fewer than half of those with lung scarring finished a year of treatment, most who stopped because of side effects, so that the authors could not judge whether it worked. That is why this is flagged."
sources = [
  "https://doi.org/10.1183/23120541.00905-2025",
  "https://europepmc.org/article/PMC/PMC13054709",
  "https://clinicaltrials.gov/study/NCT03710356",
  "https://clinicaltrials.gov/study/NCT03312400",
  "https://clinicaltrials.gov/study/NCT04638517",
  "https://clinicaltrials.gov/study/NCT06817590",
]
publications = [
  "sicre-de-fontbrune-2025",
]
for_john = "Correction: the entry's reasoning on the years names the stopped Australian danazol trial in lung scarring but not a French one that the records do not hold. The ANDROTELO trial (Sicre de Fontbrune and colleagues, ERJ Open Research, volume 12, issue 2, online on 2025-11-09; registry number NCT03710356, whose entry was last updated in 2018 and still shows status unknown) gave danazol for a year to 24 people with lung scarring and 5 with bone-marrow failure, all carrying faults in telomere genes: only 10 of the 24 with lung scarring finished the year, 9 stopped because of side effects and 3 died, so the authors write that danazol was poorly tolerated and its effect could not be judged, while all 5 with marrow failure finished and had at least a partial response; the report gives no telomere length after treatment. It does not touch the stage, which rests on the 2016 report, but it is a second trial in lung scarring that weighs towards the later years, and it also cites a 2023 trial of another hormone, nandrolone, measuring telomere length in people with telomere disease (Haematologica, 2023), which an earlier reading saw and the entry does not name. Opened: the abstract and the full text through Europe PMC, the date through Crossref and the registry entry through its data interface; the nandrolone trial was seen only in the paper's reference list. Also still open from the weekly reading of 2026-11-09, where it was first raised: The records name the National Heart, Lung, and Blood Institute's low-dose danazol trial in telomere disease (NCT03312400) only as one of two completed studies, but the registry now shows it terminated, \"stopped due to poor accrual\", with results posted on 2026-10-27, six days before this window, and no earlier reading says what the results are. Nothing dated between 2026-11-20 and 2026-11-27 changes it; the pages behind it were opened by that reading and were not opened again this week."
resolved_on = 2026-11-27
resolved_by = "Applied the same day: the French trial was added earlier the same day, and a dated note now gives the posted results of the National Heart, Lung, and Blood Institute's low-dose trial, whose entry in the publications log no longer calls it completed. No stage or year changed (changelog, 2026-11-27, the second batch of older questions)."


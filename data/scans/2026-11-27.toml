for_john = "Correction: Still open from the weekly reading of 2026-11-15, where it was first raised: the entry on a regulator recognising ageing as a treatable condition gives the metformin trial's planning as the closest a regulator has come, and lacks three later public records. The summary of a public meeting held on 2026-05-27 by the Reagan-Udall Foundation for the FDA says no approved route exists for an ageing indication and that officials pointed sponsors to disease-first routes; a trade report of 2026-10-02 says officials of the United States regulator told a conference on 2026-10-01 which of its review offices is responsible for ageing as an indication and described two ways a wider claim might be shown (benefit across several age-related conditions, or slower decline across several capacities), with no route or guidance announced; and a policy article in Science on 2026-10-01 (Strassle, Lynch and Zettler, \"Longevity products: Innovation through regulation\") argues for regulatory oversight of the field. None meets what would count, but together they are the regulator's most recent public position and belong beside the 2018 papers. I opened the meeting summary, the trade report and the registry entry; of the Science article only the one-line abstract was read, and the metformin trial's sponsor's page refused to load, so its status rests on the copy saved on 2026-07-04 that the entry already cites. What the weekly reading of 2026-11-09 left open on this entry is still open as well. Nothing dated between 2026-11-20 and 2026-11-27 changes it; the pages behind it were opened by that reading and were not opened again this week."

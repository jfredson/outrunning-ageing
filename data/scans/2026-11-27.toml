found = "No regulator's record dated 2026-11-20 to 2026-11-27 accepts a marker of ageing. The United States regulator's page on marker submissions still shows 2024-05-01 as its last update, its table of stand-in measures (updated 2026-10-29) names none for ageing, none of its nine notices in the Federal Register in the window concerns ageing, its list of science priorities still shows the 2022 edition, and the European regulator's list of qualification opinions has no marker of ageing. The open web returned only the public meeting of 2026-05-27 and the conference talks of early October 2026 that the site's readings already hold, and a trade article of 2026-11-05 restating them."
sources = [

search_short = "The search tool's allowance for this run was used up before this entry's web searches, so none were run; the dated sources and the makers' own news pages, opened by address, stand in for them."
found = "No filing for approval and no new trial report turned up in the window. The maker of the diabetes cell therapy filed no announcement with the United States securities regulator between 2026-11-20 and 2026-11-27, and the registry entries for its trial and for the United States Parkinson's trial are unchanged since 2026-09-01 and 2026-11-02; the Japanese maker of the approved Parkinson's cell product posted only cancer-drug news in the window. The papers dated in the window included a review of 2026-11-23 of the trials of insulin-making cells grown from stem cells, which says the results are encouraging but still depend on anti-rejection drugs, and the one related registry entry updated in the window, on 2026-11-20, is an early safety trial of grown retina sheets for an inherited form of blindness, still recruiting."
sources = [

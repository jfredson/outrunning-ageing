search_short = "The web search tool's allowance for the whole reading ran out before this entry's searches, so the newswire search and the open-web searches could not be run; the company newsrooms of Intellia, CRISPR Therapeutics and Beam Therapeutics were opened directly instead."
found = "No regulator approved an in-body gene editor and no peer-reviewed trial report on one appeared between 2026-11-20 and 2026-11-27. The registry entries for the two late-stage transthyretin trials are unchanged since 2026-11-04 and 2026-11-05 (the heart trial recruiting, the nerve trial closed to new patients with 67 enrolled), and Intellia, CRISPR Therapeutics and Beam Therapeutics posted no trial news in the window, only notices of investor conferences. The one paper on the subject was an editorial of 2026-11-20 on a base editor for LDL cholesterol whose mid-stage trial the last reading reported."
sources = [
  "https://www.sec.gov/Archives/edgar/data/1652130/000119312526458422/ntla-ex99_1.htm",
  "https://www.sec.gov/Archives/edgar/data/1650664/000165066426000100/editasmedicinepressrelease.htm",

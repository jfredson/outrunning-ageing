found = "No trial of grown cartilage cells reported and no regulator acted on one in the window. The two Swiss trials of engineered cartilage in arthritis behind the kneecap are still recruiting, with no update since 2026-09-10 and 2026-03-24; the papers dated in the window were a surgical technique note of 2026-11-20 on placing grown cartilage cells in the ankle and a review of 2026-11-24 of a one-step repair with minced cartilage, neither a controlled trial in worn joints. The United States maker of the knee product filed no announcement with the securities regulator in the window, and its newest news in the searches was its results of 2026-11-05."
sources = [
  "https://www.jpte.co.jp/sys/upload/save/6994297976822d27ac55a4.pdf",
  "https://www.jpte.co.jp/sys/upload/save/13737573296951e47b5d0db.pdf",
  "https://www.pmda.go.jp/files/000283257.pdf",
  "https://biopharmaboardroom.com/news/6/4291/japans-j-tec-secures-national-insurance-reimbursement-for-jacc-in-knee-osteoarthritis.html",
]
for_john = "Correction: Still open from the weekly reading of 2026-11-15, where it was first raised: the entry says wide use needs a trial in osteoarthritis that nobody had run and that osteoarthritis is outside the label, but in Japan a product of this kind has been approved for osteoarthritis of the knee since 2025-05-13. Japan Tissue Engineering's cultured cartilage, grown from the patient's own knee cartilage cells and first approved in 2012 for injuries, had osteoarthritis of the knee added to its approved uses on that date, for people with a cartilage defect of 2 square centimetres or more whom exercise and other non-surgical treatment have not helped; the company ran its trial for this from April 2019, and the Japanese regulator's list of approved products shows the change. Public health insurance has covered the new use since 2026-01-01, and the company said in May 2025 that it aims for about 1,000 cases a year within a few years. This bears on the estimate towards earlier for wide use, since the reasoning's earliest year of 2033 rests on no approval for worn joints existing anywhere; whether one country and a trial reported as 27 people changes the years is left for me to weigh. Opened: the company's releases of 2025-05-13 and 2025-12-29, the Japanese regulator's list of approved regenerative products (April 2015 to July 2026), and a trade article of 2026-01-28, which is the only source read for the figure of 27 patients and for the comparison with joint injections. Seen in a search result only: that a different product, donor cartilage cells given by injection by the Korean company Kolon TissueGene, missed both main measures in a large United States trial reported on 2026-07-20. Nothing dated between 2026-11-20 and 2026-11-27 changes it; the pages behind it were opened by that reading and were not opened again this week."
resolved_on = 2026-11-27
resolved_by = "Ruled the same day: a dated note records the Japanese approval and its randomised trial, and the earliest year for wide use moved from 2033 to 2030 (changelog, 2026-11-27, the four stage questions)."


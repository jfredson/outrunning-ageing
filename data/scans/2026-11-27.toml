for_john = "Correction: Still open from the weekly reading of 2026-11-09: the entry says no human trial of a cataract drop has been published, but a peer-reviewed report of one exists (Kuboi and colleagues, American Journal of Ophthalmology, published online 2024-08-02, https://doi.org/10.1016/j.ajo.2024.07.038, a placebo-controlled early-stage trial of a drop called C-KAD in early age-related cataract); that paper was opened by the reading of 2026-11-09 and not again this week. The searches also turned up an older paper the entry and the record of papers do not hold: Song and colleagues, Nature Communications, 2025-09-26 (https://doi.org/10.1038/s41467-025-63553-5), in which raising lanosterol inside the lens of rats, by an injection into the eye rather than drops, markedly improved cataract in two rat models; it bears on whether lanosterol itself can clear a lens in a living animal, though it is not a repeat of the 2015 dog result. I opened its abstract in the Europe PMC database, and opened the registry entry for the pilot trial directly; nothing dated between 2026-11-20 and 2026-11-27 changes either point."

found = "No controlled trial of a rapamycin-type drug at an ageing dose reported in the window. The papers dated in the window were transplant, cancer and laboratory studies, and one preprint of 2026-11-25 that used a computer model to sort blood and brain measures taken before and after rapamycin in 23 adults at raised risk of Alzheimer's disease, with no comparison group. But a search turned up an older trial the entry lacks: a randomised, placebo-controlled trial of weekly rapamycin in 40 inactive people aged 65 to 85, published in the Journal of Cachexia, Sarcopenia and Muscle in 2026-04, in which the drug did not add to the gains from home exercise and may have held them back a little."
sources = [
  "https://doi.org/10.1002/jcsm.70274",
  "https://api.crossref.org/works/10.1002/jcsm.70274",
  "https://doi.org/10.21203/rs.3.rs-11662487/v1",

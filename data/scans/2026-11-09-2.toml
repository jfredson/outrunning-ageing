found = """
A paper in Nature Aging published on 2026-11-06 (Wu and colleagues) reports that the mineral supplement vanadyl sulfate killed aged cells and that old male mice given it for three months from day 500 of life lived longer: a median of 952 days in 19 treated mice against 886.5 days in 20 untreated ones, about 7 per cent more. It is mouse work with one sex and small groups, so it adds a further kind of drug to the animal evidence and does not meet the test for people; the records already hold the paper, without these figures. A paper in Cell of 2026-11-02 (Kuehnemann and colleagues) reports that a dietary fatty acid lowered signs of aged cells and improved function in old mice, with no lifespan result in its abstract.
"""

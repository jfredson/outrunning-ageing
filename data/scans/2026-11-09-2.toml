summary = """
The second weekly reading run by the scheduled task on 2026-11-09, covering 2026-11-02 to 2026-11-09, the same week as the reading run earlier that day and so overlapping the one before by a week; it was run under a changed way of reading, in which helper readers start from the trial registry, the paper database and company filings, which can be searched by date. Every one of the 45 treatments, 31 claims and 9 self-experiments was read. Nothing moved a stage. Thirty-one publications were logged and 28 items are left for John; 12 were noted and 45 were quiet. The week's main news: a government-funded trial of two approved drugs against ageing itself in 1,200 healthy adults aged 60 to 75 was registered on 2026-11-06; the full results of the ZEUS trial of the anti-inflammatory antibody ziltivekimab were published on 2026-11-07 with no benefit on heart attacks or strokes, and its maker reported on 2026-11-04 that a second large trial had been closed; a study of 11,474 kidney transplant recipients found no longer life with rapamycin (2026-11-05); a paper found that NAD in blood does not fall with age in healthy people (2026-11-04); the United States regulator ordered a warning of a rare loss of sight on every drug of the weight-loss family (2026-11-09); Vertex said it would put a second version of its insulin-making cells ahead of the first (2026-11-02); and Intellia finished enrolling one of its two late-stage trials of a gene edit made inside the body (2026-11-05). The reading also found older facts the records lacked, the largest being that Japan gave conditional approval on 2026-03-06 to two treatments made of cells grown from stem cells, one for heart failure and one for Parkinson's disease; whether either treatment has reached the clinic stage is left for John. While the reading ran, John ruled on the ZEUS report and added two predictions to the records; those two were not read this time. News of the week that matched no treatment here: a tau antibody for Alzheimer's disease, posdinemab, posted results showing no effect in 523 people (2026-11-05), a controlled trial of a pill for age-related muscle loss in 225 people was registered (2026-11-06), and a company announced a first person given an immune treatment aimed at aged cells (2026-11-02). The Alzheimer's meeting that the earlier reading of the day said had opened runs from 2026-11-16 to 2026-11-19 and had not.
"""
limits = """
Eleven helper readers read the records and a twelfth swept the field's sources; between them they opened about 390 pages (trial-registry entries, paper abstracts, company filings and releases, regulators' pages) and the sweep read all 2,901 paper titles its dated searches returned for the week and 340 newly registered trials. The search tool's allowance of 200 searches, shared by all the readers, ran out part-way, so 30 records have fewer open-web searches than asked for and were read from the dated sources and pages opened directly; news reports and releases from companies that do not file in the United States are the likely gap, and the search tool cannot limit results by date in any case. The main reader reopened the registry entries, filings, paper records and company pages behind the items left for John, except some news reports, video pages and one journal page that refused; most journals' own pages refused, so papers were read as abstracts, and the paper database was thin for the last days of the week.
"""


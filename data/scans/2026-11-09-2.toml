]
publications = ["ut-health-san-antonio-2026", "stewart-2026"]
for_john = """
Bears on the estimate, towards earlier: a large controlled trial of the kind the estimate was waiting for was registered on 2026-11-06 (Validation and Intervention Testing for Aging, Longevity and Healthspan, https://clinicaltrials.gov/study/NCT07923630): 1,200 healthy adults aged 60 to 75, three years on dapagliflozin, semaglutide or placebo, with the United States health department as collaborator, an estimated start of January 2027 and a main result estimated for December 2030. The estimate assumes such a trial starts by 2029 and reads out in the late 2030s, so this is earlier on both counts, though its main measure is a physical performance score and not length of life or freedom from disease, so a positive result might not meet the test as written. The same week brought a result that counts the other way for rapamycin in people: a records study of 11,474 kidney transplant recipients followed for a median of 11 years (GeroScience, 2026-11-05, https://doi.org/10.1007/s11357-026-02643-8) found no gain in survival with it; it is not a randomised trial, and transplant patients take the drug at doses and for reasons unlike those of healthy people. I opened the registry entry in full; for the paper I read its abstract in the Europe PMC database and confirmed its date with the Crossref record, because the journal's page refused. The metformin trial designed to measure time to age-related disease still has no registry entry, and its sponsor's page for it returns an error.
"""
